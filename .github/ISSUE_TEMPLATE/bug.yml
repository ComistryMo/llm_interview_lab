name: Bug report
description: Report a reproducible problem in repository tooling or documentation
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include personal data, learner answers, secrets, or employer/client material.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include commands and sanitized output. Remove absolute local paths.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform and Python version
      placeholder: Windows 11, Python 3.12
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: I removed credentials, personal data, local paths, and third-party confidential material.
          required: true
        - label: I did not include a learner's complete solution.
          required: true
