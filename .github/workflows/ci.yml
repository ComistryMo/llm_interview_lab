name: CI

on:
  push:
    branches: [main, "refactor/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      job:
        description: "Run the full workflow or one release job"
        required: true
        default: all
        type: choice
        options:
          - all
          - desktop-windows

permissions:
  contents: read

jobs:
  repository-health:
    if: github.event_name != 'workflow_dispatch' || inputs.job == 'all'
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/check_environment.py
      - run: llm-lab doctor
      - run: python -m pytest --collect-only -q
      - run: python -m pytest -q
      - run: python scripts/validate_external_courses.py

  cpu-pytorch-validation:
    if: github.event_name != 'workflow_dispatch' || inputs.job == 'all'
    name: Ubuntu / Python 3.11 / CPU PyTorch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest tests/infrastructure/test_cpu_torch_validation.py -q
      - run: llm-lab doctor

  documentation:
    if: github.event_name != 'workflow_dispatch' || inputs.job == 'all'
    name: 中文文档契约 / Python 3.11
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest tests/infrastructure/test_chinese_docs.py tests/infrastructure/test_training_foundations_readme.py -q

  desktop-windows:
    if: github.event_name != 'workflow_dispatch' || inputs.job == 'all' || inputs.job == 'desktop-windows'
    name: Windows Desktop / Python 3.11
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"
          cache: pip
      - name: Install optional desktop and AI dependencies
        run: python -m pip install -e ".[desktop,ai,dev]"
      - name: Verify desktop, provider, and interview workflows
        run: >-
          python -m pytest
          tests/infrastructure/test_desktop.py
          tests/infrastructure/test_ai_connections.py
          tests/infrastructure/test_application_service.py
          tests/infrastructure/test_role_interviews.py
          -q
      - name: Build Windows standalone application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/desktop | Out-Null
          $scripts = python -c "import sysconfig; print(sysconfig.get_path('scripts'))"
          $env:PATH = "$scripts;$env:PATH"
          $env:NUITKA_CACHE_DIR = "$env:RUNNER_TEMP\\nuitka-cache"
          New-Item -ItemType Directory -Force -Path $env:NUITKA_CACHE_DIR | Out-Null
          Copy-Item -LiteralPath scripts/pysidedeploy.spec -Destination dist/pysidedeploy-ci.spec
          python scripts/generate_desktop_icons.py --output dist/icons
          pyside6-deploy -c dist/pysidedeploy-ci.spec -f
          # pyside6-deploy names the executable after the input file (main.exe)
          # inside the title-named .dist directory.  Normalize that generated
          # name only in the release bundle so the public launch path stays
          # stable for Explorer users.
          $executables = @(Get-ChildItem -Path dist/desktop -Recurse -File -Filter *.exe |
            Where-Object { $_.Directory.Name -eq 'LLMInterviewLab.dist' })
          if ($executables.Count -ne 1) {
            throw "Expected one standalone executable in LLMInterviewLab.dist, found $($executables.Count)"
          }
          New-Item -ItemType Directory -Force -Path dist/release | Out-Null
          Copy-Item -LiteralPath $executables[0].Directory.FullName -Destination dist/release/LLMInterviewLab -Recurse
          $releaseExecutable = Join-Path dist/release/LLMInterviewLab 'LLMInterviewLab.exe'
          $generatedExecutable = Join-Path dist/release/LLMInterviewLab $executables[0].Name
          if ($generatedExecutable -ne $releaseExecutable) {
            Rename-Item -LiteralPath $generatedExecutable -NewName 'LLMInterviewLab.exe'
          }
          Copy-Item -LiteralPath LICENSE -Destination dist/release/LLMInterviewLab/
          Copy-Item -LiteralPath docs/third-party-notices.md -Destination dist/release/LLMInterviewLab/THIRD_PARTY_NOTICES.md
          Copy-Item -LiteralPath docs/desktop-app.md -Destination dist/release/LLMInterviewLab/README.md
          Compress-Archive -Path dist/release/LLMInterviewLab -DestinationPath dist/release/LLMInterviewLab-Windows-x64-portable.zip
          $file = 'dist/release/LLMInterviewLab-Windows-x64-portable.zip'
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file).Hash.ToLowerInvariant()
          Set-Content -LiteralPath dist/release/SHA256SUMS-Windows.txt -Value "$hash  $([IO.Path]::GetFileName($file))" -Encoding utf8
      - name: Verify standalone executable and privacy boundary
        run: >-
          python scripts/check_desktop_artifact.py
          dist/release/LLMInterviewLab/LLMInterviewLab.exe
          --bundle-root dist/release/LLMInterviewLab
          --report desktop-nuitka-report.xml
          --archive dist/release/LLMInterviewLab-Windows-x64-portable.zip
      - name: Upload Windows portable artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: LLMInterviewLab-Windows-x64
          path: |
            dist/release/LLMInterviewLab-Windows-x64-portable.zip
            dist/release/SHA256SUMS-Windows.txt
          if-no-files-found: error

  desktop-macos-arm64:
    if: github.event_name != 'workflow_dispatch' || inputs.job == 'all'
    name: macOS 15 arm64 Desktop / Python 3.11
    runs-on: macos-15
    timeout-minutes: 120
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Report pinned runner architecture
        run: |
          sw_vers
          uname -m
          python3 --version
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"
          cache: pip
      - name: Install optional desktop and AI dependencies
        run: python -m pip install -e ".[desktop,ai,dev]"
      - name: Run core and macOS desktop tests
        run: python -m pytest -q
      - name: Build, sign ad-hoc, and smoke-test the application
        run: |
          export PATH="$(python -c 'import sysconfig; print(sysconfig.get_path("scripts"))'):$PATH"
          export NUITKA_CACHE_DIR="$RUNNER_TEMP/nuitka-cache"
          mkdir -p "$NUITKA_CACHE_DIR"
          python scripts/build_macos_desktop.py
      - name: Inspect the ZIP and mounted DMG privacy boundary
        run: >-
          python scripts/check_macos_artifact.py
          dist/release-macos/LLMInterviewLab-macOS-arm64.app.zip
          dist/release-macos/LLMInterviewLab-macOS-arm64.dmg
      - name: Upload macOS Apple Silicon artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: LLMInterviewLab-macOS-arm64
          path: |
            dist/release-macos/LLMInterviewLab-macOS-arm64.app.zip
            dist/release-macos/LLMInterviewLab-macOS-arm64.dmg
            dist/release-macos/SHA256SUMS.txt
          if-no-files-found: error
