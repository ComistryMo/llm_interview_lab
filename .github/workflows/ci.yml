name: CI

on:
  push:
    branches: [main, "refactor/**", "candidate/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      job:
        description: "Run the full workflow or one desktop build job"
        required: true
        default: all
        type: choice
        options:
          - all
          - desktop-windows
      publish:
        description: "Explicitly publish this already-created version tag after ALL gates (never overwrites a Release)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  repository-health:
    if: github.event_name != 'workflow_dispatch' || inputs.job == 'all'
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    # Windows core-only runs now collect 660 tests. Candidate run 34281371924
    # reached 349–399 passes before the old 12-minute job budget cancelled it.
    # Keep all checks; allow the slower Windows process/file operations to finish.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/check_environment.py
      - run: llm-lab doctor
      - run: python -m pytest --collect-only -q
      - run: python -m pytest -q
      - run: python scripts/validate_external_courses.py

  cpu-pytorch-validation:
    if: github.event_name != 'workflow_dispatch' || inputs.job == 'all'
    name: Ubuntu / Python 3.11 / CPU PyTorch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest tests/infrastructure/test_cpu_torch_validation.py -q
      - run: llm-lab doctor

  documentation:
    if: github.event_name != 'workflow_dispatch' || inputs.job == 'all'
    name: 中文文档契约 / Python 3.11
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest tests/infrastructure/test_chinese_docs.py tests/infrastructure/test_training_foundations_readme.py tests/infrastructure/test_alpha4_screenshot_contract.py -q

  desktop-windows:
    if: github.event_name != 'workflow_dispatch' || inputs.job == 'all' || inputs.job == 'desktop-windows'
    name: Windows Desktop / Python 3.11
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"
          cache: pip
      - name: Install optional desktop and AI dependencies
        run: python -m pip install -e ".[desktop,ai,dev]"
      - name: Verify desktop first-run workflows
        run: >-
          python -m pytest
          tests/infrastructure/test_desktop.py
          tests/infrastructure/test_onboarding_completion_hotfix.py
          tests/infrastructure/test_onboarding_qml_hotfix.py
          tests/infrastructure/test_windows_startup_hotfix.py
          -q
      - name: Build Windows standalone application
        shell: pwsh
        run: |
          $env:NUITKA_CACHE_DIR = "$env:RUNNER_TEMP\\nuitka-cache"
          python scripts/build_windows_desktop.py --output dist/release
      - name: Verify standalone executable and privacy boundary
        run: >-
          python scripts/check_desktop_artifact.py
          dist/release/LLMInterviewLab/LLMInterviewLab.exe
          --bundle-root dist/release/LLMInterviewLab
          --report dist/release/desktop-nuitka-report.xml
          --archive dist/release/LLMInterviewLab-Windows-x64-portable.zip
      - name: Verify packaged native credentials and HTTP without a real API key
        run: python scripts/check_packaged_connections.py dist/release/LLMInterviewLab/LLMInterviewLab.exe
      - name: Upload Windows portable artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: LLMInterviewLab-Windows-x64
          path: |
            dist/release/LLMInterviewLab-Windows-x64-portable.zip
            dist/release/SHA256SUMS-Windows.txt
          if-no-files-found: error

  desktop-macos-arm64:
    if: github.event_name != 'workflow_dispatch' || inputs.job == 'all'
    name: macOS 15 arm64 Desktop / Python 3.11
    runs-on: macos-15
    timeout-minutes: 120
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - name: Report pinned runner architecture
        run: |
          sw_vers
          uname -m
          python3 --version
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"
          cache: pip
      - name: Install optional desktop and AI dependencies
        run: python -m pip install -e ".[desktop,ai,dev]"
      - name: Run core and macOS desktop tests
        run: python -m pytest -q
      - name: Build, sign ad-hoc, and smoke-test the application
        run: |
          export PATH="$(python -c 'import sysconfig; print(sysconfig.get_path("scripts"))'):$PATH"
          export NUITKA_CACHE_DIR="$RUNNER_TEMP/nuitka-cache"
          mkdir -p "$NUITKA_CACHE_DIR"
          python scripts/build_macos_desktop.py
      - name: Inspect the ZIP and mounted DMG privacy boundary
        run: >-
          python scripts/check_macos_artifact.py
          dist/release-macos/LLMInterviewLab-macOS-arm64.app.zip
          dist/release-macos/LLMInterviewLab-macOS-arm64.dmg
      - name: Verify packaged macOS Keychain and HTTP without a real API key
        shell: bash
        run: |
          set -euo pipefail
          probe_keychain="$RUNNER_TEMP/llm-connection-probe.keychain-db"
          security create-keychain -p synthetic-build-only "$probe_keychain"
          security default-keychain -s "$probe_keychain"
          security unlock-keychain -p synthetic-build-only "$probe_keychain"
          trap 'security delete-keychain "$probe_keychain"' EXIT
          python scripts/check_packaged_connections.py dist/desktop-macos/LLMInterviewLab.app/Contents/MacOS/main
      - name: Upload macOS Apple Silicon artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: LLMInterviewLab-macOS-arm64
          path: |
            dist/release-macos/LLMInterviewLab-macOS-arm64.app.zip
            dist/release-macos/LLMInterviewLab-macOS-arm64.dmg
            dist/release-macos/SHA256SUMS.txt
          if-no-files-found: error

  publish-release:
    # Candidate pushes build only. Publishing needs explicit manual consent,
    # a matching existing tag, and every test/artifact job in THIS run.
    if: github.event_name == 'workflow_dispatch' && inputs.job == 'all' && inputs.publish == true && startsWith(github.ref, 'refs/tags/v')
    name: Publish verified version tag
    needs:
      - repository-health
      - cpu-pytorch-validation
      - documentation
      - desktop-windows
      - desktop-macos-arm64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"
      - name: Check source version, notes, and the requested tag
        id: version
        env:
          PYTHONPATH: src
        run: python scripts/release_metadata.py --tag "$GITHUB_REF_NAME" --github-output "$GITHUB_OUTPUT"
      - name: Download desktop artifacts from this run
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          pattern: LLMInterviewLab-*
          path: dist/downloads
          merge-multiple: false
      - name: Verify original platform checksums and assemble release
        env:
          PYTHONPATH: src
        run: python scripts/release_metadata.py --downloads dist/downloads --output dist/release
      - name: Create a new Release without overwriting any existing Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_NOTES: ${{ steps.version.outputs.notes }}
          IS_PRERELEASE: ${{ steps.version.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists. No assets were changed."
            exit 1
          fi
          python scripts/build_update_feed.py --release dist/release --version "$RELEASE_TAG"
          options=()
          if [[ "$IS_PRERELEASE" == "true" ]]; then options+=(--prerelease); fi
          gh release create "$RELEASE_TAG" --verify-tag \
            --repo "$GITHUB_REPOSITORY" --title "$RELEASE_TAG · LLM Interview Lab" \
            --notes-file "$RELEASE_NOTES" "${options[@]}" \
            dist/release/LLMInterviewLab-Windows-x64-portable.zip \
            dist/release/LLMInterviewLab-macOS-arm64.app.zip \
            dist/release/LLMInterviewLab-macOS-arm64.dmg \
            dist/release/SHA256SUMS.txt \
            dist/release/SHA256SUMS-Windows.txt \
            dist/release/SHA256SUMS-macOS.txt \
            dist/release/update-*
