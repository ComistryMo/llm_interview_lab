name: Publish accepted desktop release

# Creating one version tag is the explicit release action. `create` also allows
# documentation-only [skip ci] commits to promote an already-tested build.
on:
  create:

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.ref_type == 'tag' && startsWith(github.event.ref, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    env:
      PYTHONPATH: src
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.ref }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"
      - name: Verify main ancestry, source CI, version and publication manifest
        id: version
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor HEAD origin/main
          python scripts/release_metadata.py --tag "$RELEASE_TAG" --github-output "$GITHUB_OUTPUT"
          python scripts/verify_release_promotion.py --tag "$RELEASE_TAG" --check-ci
          echo "run_id=$(jq -r .run_id .github/release-manifest.json)" >> "$GITHUB_OUTPUT"
          echo "artifact_ids=$(jq -r '.artifacts | keys | join(",")' .github/release-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: Download the exact accepted platform artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.version.outputs.run_id }}
          artifact-ids: ${{ steps.version.outputs.artifact_ids }}
          path: dist/downloads
          merge-multiple: false
      - name: Verify original checksums and accepted asset hashes
        run: |
          python scripts/release_metadata.py --downloads dist/downloads --output dist/release
          python scripts/verify_release_promotion.py --tag "$RELEASE_TAG" --assets dist/release
      - name: Publish only after every asset has uploaded
        env:
          RELEASE_NOTES: ${{ steps.version.outputs.notes }}
          IS_PRERELEASE: ${{ steps.version.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists. No assets were changed."
            exit 1
          fi
          options=()
          if [[ "$IS_PRERELEASE" == "true" ]]; then options+=(--prerelease); fi
          title="$RELEASE_TAG · 中文桌面版"
          if [[ "$RELEASE_TAG" == "v1.0.0" ]]; then title="v1.0.0 · 首次正式发布"; fi
          gh release create "$RELEASE_TAG" --draft --verify-tag \
            --repo "$GITHUB_REPOSITORY" --title "$title" \
            --notes-file "$RELEASE_NOTES" "${options[@]}" \
            dist/release/LLMInterviewLab-Windows-x64-portable.zip \
            dist/release/LLMInterviewLab-macOS-arm64.app.zip \
            dist/release/LLMInterviewLab-macOS-arm64.dmg \
            dist/release/SHA256SUMS.txt \
            dist/release/SHA256SUMS-Windows.txt \
            dist/release/SHA256SUMS-macOS.txt
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          if [[ "$RELEASE_TAG" == "v1.0.0" ]]; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --latest --prerelease=false
          fi
      - name: Back up the seven development Releases before their removal
        if: env.RELEASE_TAG == 'v1.0.0'
        # Explicit user decision on 2026-09-09. Back up original notes/assets;
        # deletion cannot run if downloading, verification or upload fails.
        shell: bash
        run: |
          set -euo pipefail
          while read -r id tag; do
            directory="$GITHUB_WORKSPACE/dist/development-release-backup/$tag"
            mkdir -p "$directory"
            gh api "repos/$GITHUB_REPOSITORY/releases/$id" > "$directory/release.json"
            test "$(jq -r .tag_name "$directory/release.json")" = "$tag"
            if [[ "$(jq '.assets | length' "$directory/release.json")" -gt 0 ]]; then
              gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$directory"
              jq -r '.assets[] | "\(.digest | sub("^sha256:"; ""))  \(.name)"' \
                "$directory/release.json" > "$directory/backup-checksums.txt"
              (cd "$directory" && sha256sum --check backup-checksums.txt)
            fi
          done <<'RELEASES'
          385175802 v0.4.0-alpha.4
          379514678 v0.4.0-alpha.3
          378312652 v0.4.0-alpha.2
          378221781 v0.4.0-alpha.1
          377676059 v0.3.0-alpha.1
          377636078 v0.2.0-alpha.2
          377603591 v0.2.0-alpha.1
          RELEASES
      - name: Retain the recoverable development-release archive for 90 days
        if: env.RELEASE_TAG == 'v1.0.0'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: development-releases-before-v1
          path: dist/development-release-backup/
          retention-days: 90
          compression-level: 0
          if-no-files-found: error
      - name: Remove the seven superseded development Releases after v1 is public
        if: env.RELEASE_TAG == 'v1.0.0'
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.0.0" \
            --jq 'select(.draft == false and .prerelease == false and (.assets | length) == 6) | .tag_name' | grep -qx v1.0.0
          for record in dist/development-release-backup/*/release.json; do
            id=$(jq -r .id "$record")
            tag=$(jq -r .tag_name "$record")
            actual=$(gh api "repos/$GITHUB_REPOSITORY/releases/$id" --jq .tag_name)
            test "$actual" = "$tag"
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
            echo "Removed superseded Release: $tag (Git tag retained)"
          done
