[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-interview-lab"
version = "0.4.0a2"
description = "A local-first, role-aware, AI-coached interview workbench for AI careers"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "ComistryMo" }]
keywords = ["ai", "llm", "interview", "mock-interview", "pytorch", "post-training", "learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "jsonschema>=4.23,<5",
    "PyYAML>=6.0,<7",
    "pytest>=8.0,<9",
]

[project.scripts]
llm-lab = "llm_interview_lab.cli:main"
llm-lab-gui = "llm_interview_lab.desktop.main:main"

[project.optional-dependencies]
test = []
torch = ["torch>=2.2"]
desktop = ["PySide6>=6.8,<7"]
ai = [
    "any-llm-sdk[openai,anthropic,gemini,ollama]>=1.26,<2; python_version >= '3.11'",
    "httpx>=0.28,<1",
    "keyring>=25,<26",
]
dev = []

[project.urls]
Homepage = "https://github.com/ComistryMo/llm_interview_lab"
Repository = "https://github.com/ComistryMo/llm_interview_lab"
Issues = "https://github.com/ComistryMo/llm_interview_lab/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["llm_interview_lab*"]

[tool.setuptools.package-data]
llm_interview_lab = ["desktop/qml/**/*.qml", "desktop/resources/*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests/infrastructure", "tests/regression"]
pythonpath = [".", "src"]
norecursedirs = [".external", "curriculum/problems", "curriculum/retention", "workspace/profiles"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
markers = [
    "infrastructure: repository tooling tests run by default",
    "training: learner-facing task tests excluded from the default suite",
    "current: tests for the one active implementation task",
    "regression: accepted-task regression tests",
    "locked: tests for tasks that are not yet unlocked",
    "requires_torch: requires the optional PyTorch dependency",
    "requires_cuda: requires a CUDA-capable PyTorch environment",
]
