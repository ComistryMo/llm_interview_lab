    levels: *levels
    evidence: [coding, oral, debugging]
    related_problems: [LOSS-007, LOSS-008, LOSS-013, LOSS-014, LOSS-002, CAP-LOSS-001, CAP-TRN-001, PT-003, PT-022, LOSS-004, LOSS-006, PT-009, LOSS-017]
