    domain: llm_vlm
    description: 解释分词训练、特殊 token 与模板；BPE 要分清带词频的相邻 pair 统计、并列规则、非重叠替换和推理时 merge rank，不能把训练频次直接当编码顺序。
    levels: *levels
    evidence: [coding, oral, debugging]
    related_problems: [TOK-001, TOK-002, TOK-003, TOK-004]
  - id: skill.llm_vlm.attention
