    title: Stateful Optimizers
    domain: deep_learning
    description: 解释带状态的参数更新和恢复；核实 AdamW 解耦衰减、无梯度时的行为、逐参数 step、偏差校正和 m/v 持久化。用中断恢复对照连续运行，不把损失下降当实现正确证明。
    levels: *levels
    evidence: [coding, debugging, oral]
    related_problems: [OPT-001, OPT-002, OPT-003, OPT-004, OPT-005, CAP-TRN-001]

