    levels: *levels
    evidence: [coding, oral, debugging]
    related_problems: [ATT-002, ATT-003, ATT-004, ATT-005, ATT-006, ATT-019, ATT-020, ATT-021, ATT-015, REC-009, ATT-023, ATT-024]
    aliases: [Attention]
