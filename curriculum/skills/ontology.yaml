    description: 实现并验证基础层；辨别最后一维 LayerNorm、RMSNorm、BatchNorm 训练与推理统计、inverted Dropout、卷积互相关的差异。先核实形状和状态，再追问小 batch、边界或梯度，而非堆叠定义。
    levels: *levels
    evidence: [coding, debugging]
    related_problems: [NNL-001, NNL-002, NNL-008, CAP-LOSS-001, CAP-TRN-001, NNL-006, INF-013, NNL-005, NNL-016, NNL-009, REC-009, NNL-018, NNL-019, VLM-015]
