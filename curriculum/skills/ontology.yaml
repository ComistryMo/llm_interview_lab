    description: 串起 embedding、归一化、Attention 与 FFN；核实 Pre-Norm 残差、SwiGLU 双分支、完整 Decoder 与增量 cache 一致性。MoE 先区分路由、权重归一化和专家容量；不把无容量丢弃的教学实现称作完整生产 MoE。
    levels: *levels
    evidence: [coding, oral, design]
    related_problems: [ATT-007, ATT-008, ATT-012, ATT-019, ATT-020, ATT-021, NNL-014, NNL-005, ATT-001, ATT-024, VLM-015]
