schema_version: 1
level_scale: &levels
  "0": 未接触，无法提供有效证据。
  "1": 能解释术语、目标与基本边界。
  "2": 能在提示下完成典型任务。
  "3": 能独立实现、验证并调试。
  "4": 能做系统权衡、优化并指导他人。
