dimensions:
  signal_design:
    weight: 0.25
    anchors:
      1: 把点赞直接当成无偏质量标签，未说明反馈覆盖或选择偏差。
      3: 使用多种信号并承认偏差，但抽样或校准方案仍不完整。
      5: 区分信号用途，结合随机与风险抽样、分群校准和可追溯来源。
  data_governance:
    weight: 0.25
    anchors:
      1: 默认收集全部会话并送入训练，忽略用户控制和访问边界。
      3: 提到授权、脱敏和保留期限，但用途绑定、撤回或审计仍模糊。
      5: 为采集、训练、评测和删除分别定义授权、最小化、访问控制与审计证据。
  evaluation_integrity:
    weight: 0.30
    anchors:
      1: 用可能被训练污染的同一批数据证明版本提升。
      3: 有独立回归集和分群指标，但时效、污染或标注分歧处理不足。
      5: 版本化并保护评测集，处理时效、地区、污染、标注协议和不确定性。
  intervention_and_release:
    weight: 0.20
    anchors:
      1: 所有问题都归因于模型，并给出无条件发布结论。
      3: 能按错误类型选择干预，但门槛、责任人或回滚条件不清楚。
      5: 用可证伪实验选择干预，定义质量与风险双重门槛、灰度、回滚和复盘责任。
fatal_issues:
  - 未经授权把会话用于训练
  - 使用被训练污染的样本证明版本更好
  - 用总体指标掩盖严重或受影响群体风险

