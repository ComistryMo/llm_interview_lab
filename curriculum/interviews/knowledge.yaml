  - id: EGT-QB-090
    kind: eight_stock
    title: ORM 与 PRM：结果对了是否意味着过程可信
    domain: reward_evaluation
    tracks:
    - post_training
    - llm_algorithm
    skills:
    - skill.post_training_rl.reward_modeling
    - skill.post_training_rl.verification
