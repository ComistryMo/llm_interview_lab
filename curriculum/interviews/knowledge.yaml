  - id: EGT-QB-144
    kind: eight_stock
    title: 失败恢复与 Reflexion：有界重试、状态判定与经验记录
    domain: agent_runtime
    tracks:
    - agent
    - systems
    skills:
    - skill.agent_application.agent_loop
    - skill.agent_application.tool_calling
    - skill.agent_application.reliability
    priority: P1
    difficulty:
      concept: 4
      implementation: 3
      debugging: 4
    seniority:
    - new_grad
    - mid
    - senior
    prompt: Agent连续三次调用同一工具都失败。如何决定重试、改变策略、反思还是停止？说明Reflexion式经验记录与真正RL参数更新的差别。
    one_liner: 恢复先识别可重试故障与业务/权限错误，再在预算内改变可检验策略；反思是依据失败证据更新文本经验，不等同于自动训练模型权重。
    core_answer:
    - 把失败分为瞬时网络/限流、参数契约、业务拒绝、权限拒绝、结果不达标和执行状态未知；瞬时读操作可指数退避+jitter，参数错误要修正或补查，权限拒绝不能用变换参数反复绕过。
    - 对副作用使用操作ID和幂等状态机，unknown先查执行结果；重试计数、总deadline与费用是跨调用链预算，不能每层重置导致乘法爆炸。超过上限留证据并返回incomplete/失败。
    - 反思应从实际错误和grader反馈形成短经验，例如“实体名重名，需加入城市”，下一次必须改变查询或检查；没有新信息时重复自评容易加固错误。Reflexion用语言反馈/记忆影响后续尝试，不必更新LLM参数。
    - 保存原始目标、已完成副作用、可回滚动作和重放所需版本；经验经验证后才可长期存储，并用独立任务测试迁移。衡量恢复成功率、额外成本、重复副作用和停止正确性。
    derivation_or_example: search报429可在服务允许期限内退避；库存不足是业务失败，应寻找用户允许替代或停止；create_order超时未知先查operation。三类都写成“再试一次”会造成无效循环或重复订单。
    answer_outline:
    - 失败类型到动作分流
    - 幂等与跨层预算
    - 证据驱动反思
    - 经验验证和停止
    acceptance:
      L1: 能按错误类型选择恢复策略。
      L2: 知道写操作unknown先查状态。
      L3: 区分Reflexion文本反馈与参数RL。
      L4: 设计跨层预算、重复检测和恢复评测。
    follow_ups:
    - L1：哪些错误重试也不会改变结果？
    - L2：每层最多重试3次为何整条链可能调用远超3次？
    - L3：怎样判断反思真的改变了行动？
    - L4：一条成功恢复经验何时不应推广到所有任务？
    pitfalls:
    - 把反思文字自动当成功或学习证据。
    - 用无限重试对抗权限或业务拒绝。
    signals:
    - 能给出明确停止条件和失败记录。
    - 经验只根据实际结果更新。
    source_claims:
    - claim_id: EGT-QB-144-C1
      source_id: qb-reflexion
      claim: Reflexion以语言反馈与情景记忆改进后续尝试，区别于直接权重更新。
      confidence: high
