    one_liner: Mamba让状态更新随token选择保留或遗忘信息，用硬件友好的scan执行序列递推。
    core_answer:
    - 线性SSM可写h′=Ah+Bx、y=Ch，按步长Δ离散化得h_t=Āh_{t−1}+B̄x_t；零阶保持时Ā=exp(ΔA)，B̄=∫₀^Δ exp(uA)Bdu。时间不变参数可对应卷积计算。
    - Mamba令B_t、C_t及Δ_t由当前输入决定，A保留结构化参数，按内容选择传播/遗忘。输入相关性打破固定卷积核，使用融合、重计算与并行scan降低HBM访问；不能简单说训练只做串行RNN循环。
    - 固定通道与状态大小时序列工作量随N线性，解码状态不随已见长度增长，避免Transformer逐步扩大的KV；但历史被压进有限状态，精确检索和信息保留受能力限制。prefill/decode速度依硬件和kernel，论文特定任务结果不能概括所有推理任务优劣。
    derivation_or_example: 标量A=−1时Ā=e^(−Δ)，较大Δ让旧状态衰减更快；若Δ由token决定，相同相邻距离也可拥有不同“记忆保留”强度，类似可学习门控。
    answer_outline:
