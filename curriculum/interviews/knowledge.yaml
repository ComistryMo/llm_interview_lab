  - id: EGT-QB-124
    kind: eight_stock
    title: AllReduce、Ring-AllReduce 与 Parameter Server
    domain: distributed_systems
    tracks:
    - systems
    - llm_algorithm
    - post_training
    skills:
    - skill.training_infra.distributed
    - skill.training_infra.observability
    priority: P1
    difficulty:
      concept: 4
      implementation: 3
      debugging: 4
    seniority:
    - new_grad
    - mid
    - senior
    prompt: 多张GPU各有梯度向量。如何让同步训练得到相同更新？解释AllReduce语义、环形实现的通信量，并比较Parameter Server的集中与分片设计。
    one_liner: AllReduce是所有参与者得到归约结果的语义，Ring是其一种实现；Parameter Server把参数/梯度汇总更新职责放在服务器，可同步也可异步。
    core_answer:
    - AllReduce(sum)把p个rank的同形向量求和并把完整结果送给每个rank；取均值还需除p或按全局有效样本权重归约。所有rank必须以一致顺序参加匹配collective，否则可能挂起或产生错误。
    - 环形实现先reduce-scatter，p−1轮传输并累加分片，使每rank持一份最终分片；再all-gather用p−1轮收集全量。每rank传输约2(p−1)/p·m字节，时间近似2(p−1)α+2(p−1)m/(pβ)，忽略本地计算和拓扑竞争。
    - Ring带宽效率好但延迟随p增加，小消息可能适合tree等算法；AllReduce不等于必须Ring，库会依消息大小和拓扑选择实现。
    - Parameter Server让worker推梯度、拉参数，server可分片与复制；易支持稀疏参数和异步更新，但热点、服务器瓶颈、一致性/陈旧梯度需治理。同步AllReduce通常无专门中心参数节点，却仍受最慢rank和网络拓扑影响。
    derivation_or_example: p=4、m=100MB，Ring每rank总发约150MB，共6轮；不是每张卡发送完整梯度给另外3张。若各rank有效token数不等，先各自平均再除4可能不等于全局token平均。
    answer_outline:
    - AllReduce语义与全局平均
    - reduce-scatter/all-gather
    - Ring通信成本
    - PS同步异步与热点
    acceptance:
      L1: 区分操作语义和通信算法。
      L2: 解释环形两个阶段并算字节量。
      L3: 理解小消息延迟和加权归约。
      L4: 按稀疏性、拓扑、一致性比较PS与collective。
    follow_ups:
    - L1：AllReduce(sum)怎样变全局平均？
    - L2：p很大而向量很小时Ring会有什么问题？
    - L3：PS是否必然异步、单机和单点故障？
    - L4：某个rank调用次序不同为何难以恢复？
    pitfalls:
    - 把AllReduce、AllGather和Broadcast混为一谈。
    - 认为PS一定只有一个服务器或AllReduce完全无瓶颈。
    signals:
    - 能画每rank拥有数据的变化。
    - 在异步讨论中明确陈旧梯度语义。
