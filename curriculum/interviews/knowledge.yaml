    one_liner: 先用profile判断是访存、算力还是launch瓶颈，再减少HBM中间读写与启动次数；融合会增加寄存器/共享内存压力，必须保持数值和同步正确。
    core_answer:
    - 用roofline思路比较算术强度FLOPs/bytes与硬件平衡点；检查global memory合并访问、对齐、重复读写、bank conflict、occupancy、warp分歧和launch开销，先找真实瓶颈。
