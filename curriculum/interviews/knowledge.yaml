    prompt: teacher/student logits[B,T,V] 词表和 token 已对齐，bool mask[B,T]。返回 temperature² * 有效 token 平均 KL(teacher||student)；teacher
      停梯度，student 保持梯度。全 mask 为空时返回与 student 连图的零；temperature>0。禁止直接用 KLDivLoss 替代归约，允许 log_softmax。float64
      保留，其余至少 float32 归约。O(BTV)。不把 batchmean 或反向 KL 当本题目标。
