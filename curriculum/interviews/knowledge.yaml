  - id: EGT-INF-004
    kind: eight_stock
    title: "Prefill/Decode、continuous batching 与 TTFT/TPOT SLO"
    domain: serving_systems
    tracks: [systems, llm_algorithm, agent, vlm_algorithm]
    skills: [skill.inference_systems.serving, skill.inference_systems.capacity, skill.inference_systems.kv_cache, skill.training_infra.observability, skill.system_design.requirements]
    priority: P0
    difficulty: {concept: 4, implementation: 4, debugging: 5}
    seniority: [intern, new_grad, mid, senior]
    prompt: "一个在线 LLM/VLM 服务同时面对长 prompt 和短请求，如何拆 prefill/decode、设计 continuous batching/chunked prefill，并用 TTFT、ITL/TPOT、p99 和成本做调度决策？"
    one_liner: "prefill 受 prompt 计算和大批量吞吐影响，decode 受 KV 带宽与每步公平性影响；调度器必须显式管理 token/KV 预算、队列和尾延迟。"
    core_answer:
      - "prefill 一次处理输入上下文，decode 逐 token 追加 KV；两阶段共用 GPU 但资源瓶颈不同，不能只用平均 tok/s 衡量。"
      - "连续批处理让新请求在已有 decode 迭代间加入；chunked prefill 可缓解长 prompt 阻塞 decode，但会改变 TTFT、ITL、吞吐和公平性。"
      - "记录 queue/admission time、TTFT、ITL/TPOT、E2E、prompt/generation tokens/s、KV 使用率、抢占/重算、p50/p95/p99 和 cost per success。"
      - "SLO 先定义 workload/QPS/长度分布和优先级，再选择 FIFO、token budget、round-robin、deadline、prefix reuse 或 preemption；每个策略要有回放和容量上界。"
    derivation_or_example: "给 2 个长 prompt 和 8 个短请求，在每步 prefill=128、decode=8、KV 容量固定的条件下画队列，预测一个调度策略对 TTFT/ITL 的影响。"
    answer_outline: ["拆两阶段计算与状态", "写 token/KV 预算", "定义延迟与吞吐指标", "用 trace/负载切片选择策略"]
    acceptance:
      L1: "能区分 prefill、decode、TTFT 和 TPOT/ITL。"
      L2: "能说明连续批处理、chunked prefill 和 KV 容量的耦合。"
      L3: "能从 p99、公平、抢占、成本和 workload 设计发布 gate。"
    follow_ups: ["为什么 decode 往往更受显存带宽而非 FLOPs 限制？", "长 prompt flood 时如何避免 decode starvation？", "chunked prefill 的 chunk size 如何用目标 SLO 选择？", "prefix cache 命中后 TTFT、KV ownership 和多租户隔离怎样变化？"]
    pitfalls: ["只报平均 tokens/s，不报 TTFT/ITL p99", "把 active request 数当作 KV token 容量", "新 admission 同步 decode 导致边界不可复现", "抢占/取消后未释放 KV 或没有 trace 原因"]
    signals: ["能把系统设计写成可回放状态机", "指标带明确分位数和 workload", "能解释公平性与吞吐的取舍"]
    source_claims:
