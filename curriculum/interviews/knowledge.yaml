  - id: EGT-QB-083
    kind: eight_stock
    title: 精确去重与近重复检测：哈希、MinHash、SimHash 和片段污染
    domain: data_engineering
    tracks:
    - llm_algorithm
    - post_training
    skills:
    - skill.data_mlops.data_quality
    - skill.data_mlops.reproducibility
    - skill.evaluation_safety.leakage
    priority: P1
    difficulty:
      concept: 4
      implementation: 3
      debugging: 4
    seniority:
    - new_grad
    - mid
    - senior
    prompt: 有数十亿网页，其中存在整页镜像、广告模板差异和长段落抄录。设计分层去重流程，说明四种方法的数学对象、漏检风险和验证办法。
    one_liner: 精确哈希解决规范化后的全等，MinHash 估计集合 Jaccard，SimHash 用位签名近似角度相似，N-gram/后缀结构定位局部重叠。
    core_answer:
    - 先保留原文标识并做可审计规范化，再按内容哈希归并全等文档；哈希命中后可比原文确认。不要过度规范化掉数字、代码缩进或区分性实体。
    - 把文档转成 n-gram 集合 A、B；J=|A∩B|/|A∪B|。理想随机排列下 minhash 最小元素相同的概率等于 J，多个签名位置估计 J；LSH 仅生成候选，最终用真实相似度复核阈值。
    - SimHash 对加权特征哈希的各位做带符号累加再取正负，比较 Hamming 距离；它近似角度关系而非精确 Jaccard。N-gram 倒排或后缀数组能找局部复制，适合 benchmark 片段清除，但公共短语会误报。
    - 先聚重复簇，再按簇做 train/test split；确定保留代表、保留来源和删除理由，按语言/领域抽样测去重 precision 与 recall。全对全比较是 O(D²)，候选索引避免穷举但引入召回与存储取舍。
    derivation_or_example: A={ab,bc,cd}、B={ab,bc,de} 的 Jaccard=2/4=0.5；一段100-token测试答案被嵌进万token网页，整页 Jaccard
      可能很低，局部 n-gram 检测仍能命中。
    answer_outline:
    - 规范化后精确哈希
    - MinHash/Jaccard/LSH
    - SimHash/Hamming
    - N-gram局部匹配与簇级划分
    acceptance:
      L1: 能区分整页重复和局部抄录。
      L2: 正确给出 Jaccard 与 SimHash 的不同对象。
      L3: 能解释 LSH 候选复核、误删和漏检。
      L4: 设计簇级拆分、抽样标注和规模预算。
    follow_ups:
    - L1：哈希相同是否应直接宣称文档完全相等？
    - L2：为何 MinHash 不适合只占网页1%的污染片段？
    - L3：公共版权页造成超大相似簇时怎么处理？
    - L4：如何在不暴露测试答案的条件下运行去污染并保留审计？
    pitfalls:
    - 先随机拆分再分别去重，保留跨集合近重复。
    - 把 SimHash Hamming 距离解释为 Jaccard 的精确值。
    - 为降重复率无差别删除少数语言或模板化合法代码。
    signals:
    - 能指出集合表示丢失词频、顺序的影响。
    - 用人工抽检估误删而非只报删除百分比。
