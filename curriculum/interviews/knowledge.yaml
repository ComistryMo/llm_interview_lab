    - 取A∈R^(r×din)、B∈R^(dout×r)，y=Wx+(α/r)BAx，新增r(din+dout)参数；rank约束的是更新而不是原W。常见B=0、A小随机使初始ΔW=0；论文随机高斯与实现Kaiming等需区分，并非A必须正态。
