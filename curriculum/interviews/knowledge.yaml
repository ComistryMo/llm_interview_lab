      L2: "能给出 reward-true gap、污染和统计指标。"
      L3: "能提出反例、独立 oracle、版本锁定和发布回滚条件。"
    follow_ups: ["RM pair accuracy 很高但线上 win-rate 不升，先查哪些切片？", "如何校准 LLM judge 的位置、长度和自偏好？", "为什么 exact-match 去重不足以证明 benchmark 没污染？", "verifier 被格式漏洞绕过时，如何区分模型能力、解析器和环境故障？"]
