    - 质量评分可混合规则、参考分布困惑度和分类器，但会偏向其训练域；有害内容/PII筛选需定义用途及允许研究语境，用分语言人工审计估precision/recall，避免把讨论伤害的文本全当伤害。每步报告保留token、域比例及错误样例，最后以预训练对照验证效用。
