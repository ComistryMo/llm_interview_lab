    one_liner: 将问题、检索证据、组装上下文和最终断言逐段评分，再用oracle证据和固定证据替换模型，才能分离RAG失败来源。
    core_answer:
    - 检索层测必要证据Recall@K、时效和权限；重排/组装层测正确片段是否被挤出预算、截断或失去标题/来源；生成层测与问题相关、事实正确、对证据忠实以及引用是否实际支持断言。
    - Answer Relevance低只说明偏题，不直接证明检索差。用人工确认的oracle证据替换检索结果、保持生成配置不变：若明显改善指向检索/组装；仍差则检查提示、指令解析、模板、生成能力和评测器偏差。
    - 固定同一证据集比较基座/微调模型，并对比无证据、干扰证据和正确证据条件；必要时把问题拆成可回答子问，检查证据冲突与可回答性。替换实验应控制长度与位置以免引入新混杂。
    - 先校准评测器与人工标注，再按badcase修复召回、chunk、reranker或输出约束；报告端到端正确性/覆盖率、延迟和成本，不只优化单个自动judge分。
    derivation_or_example: oracle退款条款输入后回答正确，生产retrieval也含该条款，但组装时被长运输页面挤掉：根因在上下文预算而非向量模型或LLM。保留证据ID和组装span可直接复现。
