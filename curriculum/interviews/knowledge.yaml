    one_liner: FlashAttention是精确注意力的IO优化，线性额外存储不等于线性算术或无条件线性HBM访问。
    core_answer:
    - 将Q/K/V块载入SRAM，对每行保存最大值m、指数和l及未归一化加权和u；不将完整分数与概率矩阵写回HBM，反向利用统计量重算。
    - 新块分数S到来：m′=max(m,max S)，l′=exp(m−m′)l+Σexp(S−m′)，u′=exp(m−m′)u+Σexp(S−m′)V；最终O=u/l，数学上等价，浮点累加顺序可能有差异。
    - 固定头维d时额外存储为O(Nd)，稠密算术仍O(N²d)。v1论文在SRAM可容纳M个元素且d≤M≤Nd时给出HBM访问O(N²d²/M)，不能笼统写O(N)。v2减少非矩阵运算并改进序列维并行；v1的warp按K/V分割后需汇总，v2按Q行分工并共享K/V，减少warp间共享内存通信。
    derivation_or_example: 先处理最大logit为2的块，后遇到最大logit10，旧l与u必须同时乘exp(−8)；只更新分母会改变结果。全mask行需定义输出并避免−∞减−∞。
    answer_outline:
