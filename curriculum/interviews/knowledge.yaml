    prompt: 用户要求“用中文给出三点，每点不超过20字且不出现某词”。如何用IFEval式评测判断遵循情况，并补上自动规则看不到的质量维度？
    one_liner: IFEval 把部分指令转为可复核的形式约束，按指令级和整题级计分；满足格式不代表内容正确或有帮助。
    core_answer:
    - IFEval 原始集合覆盖25类可验证指令，例如关键词、列表条数、长度与语言；使用确定性检查减少judge不确定性。一个prompt可包含多个约束，需要保留每个检查器的结果。
    - Instruction-level accuracy 是满足的约束占比；prompt-level accuracy要求该题所有约束同时满足。strict按原输出严格验证；loose允许预定义的轻微格式变换，不能为提高分数临时放宽规则。
    - 检查器要定义中文“字/词”的计数、Markdown序号、标点、大小写和Unicode规范化等边界；语言检测对短文本不稳定，要标注规则限制。冲突/不可满足指令应单独评测澄清行为。
    - 结合语义正确、事实支持、多轮约束持续、拒答适当性与真实可用性评测；按约束组合和长度分桶，不将单一IFEval分数解释为所有指令跟随能力。
    derivation_or_example: 3个prompt各含2约束，模型分别满足2、1、1个：指令级为4/6，整题级为1/3。回答恰好三点但每点都是无关内容，可格式全过而语义质量为低。
    answer_outline:
    - IFEval可验证指令
    - instruction/prompt级口径
    - strict/loose与规则边界
    - 语义/多轮等互补维度
    acceptance:
      L1: 能将指令变为具体检查。
      L2: 正确计算两类准确率。
      L3: 说明strict/loose及语言长度规则的限制。
      L4: 能构造格式成功语义失败的测试与冲突约束切片。
    follow_ups:
    - L1：一题五个约束只错一个，该题分数如何算？
    - L2：中文20字是否包括标点和数字？
    - L3：怎样验证检查器而不让模型钻计数漏洞？
    - L4：单轮约束全过，多轮却丢约束，如何扩展评测？
    pitfalls:
    - 混淆指令级与整题级分母。
    - 看到语言流畅就认为形式约束被满足。
    signals:
    - 先冻结规则再运行评测。
    - 把可程序化部分与语义评审分开。
