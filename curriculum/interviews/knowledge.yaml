    one_liner: TP分层内矩阵，PP分连续层，DP复制同一模型分片处理不同样本；三维正交进程组须使参数副本、激活与梯度通信一致。
    core_answer:
    - Megatron式FFN先按W1输出列切、再按W2输入行切，以局部激活接局部矩阵并归约结果；attention按头及输出投影组织。切分名称依存储转置而变，应明确数学XW约定。
