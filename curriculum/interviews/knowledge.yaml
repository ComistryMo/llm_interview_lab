  - id: EGT-QB-158
    kind: eight_stock
    title: 多模态幻觉：视觉缺失、语言先验与受控缓解
    domain: multimodal_evaluation
    tracks:
    - vlm_algorithm
    - post_training
    skills:
    - skill.evaluation_safety.benchmarks
    - skill.llm_vlm.vlm_architecture
    - skill.evaluation_safety.llm_judge
    priority: P1
    difficulty:
      concept: 4
      implementation: 3
      debugging: 4
    seniority:
    - new_grad
    - mid
    - senior
    prompt: 模型看见一张街景后声称有交通灯，但图中没有。如何区分感知失败、语言先验、训练数据和生成策略影响，并防止靠全拒答降低幻觉率？
    one_liner: 多模态幻觉是输出断言缺乏输入模态支持或与之矛盾；需沿视觉信息、连接器、上下文和生成逐层诊断，用反事实和正负例同时验证缓解。
    core_answer:
    - 视觉低分辨率/遮挡、encoder特征局限、query压缩和多图错位可能丢失证据；图文数据caption不实、只描述常见场景会加强语言共现先验，LLM再在缺证据时补全常见对象。
    - 评测把对象、属性、数量、空间、OCR、时间关系分开，使用存在/不存在平衡样例及断言级图像核查；区分确实没有、不可见和图像质量不足。POPE适合对象存在性，但不能单独覆盖全部关系和长描述幻觉。
    - 干预包括修复媒体顺序/processor、局部高分辨率读取、加入grounding/反事实/困难负例训练、改善桥接与模态平衡、要求关键断言绑定视觉证据和证据不足时保留不确定。解码保守或对比解码等应做独立消融，不能承诺完全消除。
    - 用同题换图、移除对象、交换属性、遮挡局部和oracle文字对照分析信息来源；同时测正确率、coverage、误拒、幻觉precision/recall及长度，不让输出更短或永远说看不清伪装成质量提高。
    derivation_or_example: 同一街景图只移除交通灯，问题和其余像素保持不变；模型两次都坚定说“有灯”支持先验依赖嫌疑。若原图灯很小，放大后才区分，则还应检查视觉分辨率与压缩。
    answer_outline:
    - 多层成因
    - 对象到关系的评测
    - 数据/感知/生成干预
    - 反事实及拒答权衡
    acceptance:
      L1: 定义模态证据不支持的断言。
      L2: 能列感知与语言先验不同来源。
      L3: 提出正负例和换图反事实。
      L4: 验证缓解没有通过拒答/短答投机。
    follow_ups:
