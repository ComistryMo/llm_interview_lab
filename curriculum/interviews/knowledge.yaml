  - id: EGT-QB-153
    kind: eight_stock
    title: 多模态架构与连接器：双塔、视觉token、Q-Former和Cross-attention
    domain: multimodal_architecture
    tracks:
    - vlm_algorithm
    - post_training
    skills:
    - skill.llm_vlm.vlm_architecture
    - skill.llm_vlm.multimodal_data
    - skill.deep_learning.losses
