    one_liner: MoE按token激活少量专家扩大总参数容量，训练效率依赖路由负载和通信，不只取决于激活参数数。
    core_answer:
    - Router对E个专家打分，取Top-K，token被送到选中专家的FFN，输出按门控权重加权并回到原token位置。Top-K选择是离散的，梯度可流经选中权重及专家，不能假定未选专家也同样更新。
    - 典型Switch Top-1均衡项为αEΣ_i f_i p̄_i，f_i为硬分配比例、p̄_i为平均路由概率，鼓励避免少数专家拥塞；不同K和实现的定义需另写。capacity约束每专家token数，溢出可能丢弃/重路由/无丢弃调度，影响质量与峰值。
    - DeepSeekMoE把专家拆细，在相近激活计算预算下组合更多专门知识，并设置总激活的共享专家承担公共知识、减少路由专家冗余。专家并行产生all-to-all，偏载、跨机通信和小GEMM会限制收益，稀疏激活不等于权重无需驻留。
    derivation_or_example: 8个专家Top-2只表示每token经过2个路由专家；若另有1个共享专家，其计算也要计入激活预算。某专家收到一半token时，平均负载看似充足也会被热点拖慢。
    answer_outline:
