    prompt: ViT可怎样预训练？若CLIP全局检索很好但区分小物体、细字和局部属性较差，怎样改进数据、特征与目标并验证收益？
    one_liner: ViT可用监督分类、图文对比、掩码重建或自蒸馏预训练；全局CLIP目标不保证局部token可精确对齐，细粒度改进需保留空间信息并加入相应监督。
    core_answer:
    - 监督ViT把图像切patch、线性投影加位置后经Transformer，以类别CE训练；CLIP/SigLIP使用图文匹配目标；MAE遮挡patch并重建像素；DINOv2使用自监督表示学习。目标不同会使语义、局部几何和文本对齐能力不同。
    - 全局CLS/pooled embedding会压缩局部信息，低输入分辨率或大patch可能直接丢失小字；可使用patch token/中间层、多尺度裁剪和更高分辨率，保持位置、比例与文本指代映射，不能只放大已经丢失的像素。
    - 加入region-text/属性/grounding数据，采用token级late interaction或局部对比；FILIP用跨模态token的细粒度交互改善匹配。hard negatives应针对细粒度差异但不能把语义等价样本当负例。
    - 高分辨率增token与attention成本，裁剪可能使原caption部分不再成立；评测局部检索、细粒度属性、OCR和空间关系，同时测全局检索回退、吞吐及显存，用冻结encoder/特征层/目标逐项消融。
    derivation_or_example: 224×224图用16×16patch得到14×14=196token；提升到448×448则784token，标准全局attention的N²项约增16倍。若caption说“左边红杯”，裁剪后必须保留或重标这个空间关系。
    answer_outline:
