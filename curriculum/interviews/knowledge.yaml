  - id: EGT-QB-156
    kind: eight_stock
    title: 跨模态对齐：共同向量空间、模态鸿沟与条件接口
    domain: multimodal_architecture
    tracks:
    - vlm_algorithm
    - post_training
    skills:
    - skill.llm_vlm.vlm_architecture
    - skill.llm_vlm.multimodal_data
    - skill.deep_learning.losses
    priority: P1
    difficulty:
      concept: 4
      implementation: 3
      debugging: 4
    seniority:
    - new_grad
    - mid
    - senior
    prompt: 图像和文本必须落在完全相同的向量分布里，LLM才能理解图像吗？比较对比学习的共享检索空间与生成式连接器的条件对齐。
    one_liner: 共享检索空间需要可比较的相似度，生成式VLM只需视觉表示能有效条件化语言模型；维度相同、分布重合和语义可用是不同要求。
    core_answer:
    - 双塔通过各自encoder和投影得到共同D维，再用配对对比损失拉近相关语义、区分不匹配样本；L2规范化与温度控制相似度尺度。共同空间表示相似度有任务意义，不意味着同一图与所有正确描述应逐元素完全相等。
    - 模态鸿沟来自信息内容和统计差异：图包含大量未被caption描述的细节，文本可含抽象知识；encoder目标、数据噪声、尺度和损失也使两模态分布不同。全局对齐可能保留语义同时忽略计数/关系等局部信息。
    - 若表示不在相同语义空间，可训练projector/MLP、Q-Former或cross-attention，从图像特征到LLM可利用接口；维度匹配只是输入契约，语义接口由配对生成或对齐训练学到，不必强制所有hidden分布重合。
    - 评估双向检索、跨域匹配、局部grounding和生成任务；分布均值距离或漂亮t-SNE不能代替任务效果。可用不变视觉、替换文本和不变文本、反事实视觉检测模型是否真正依赖模态。
    derivation_or_example: 一张图有红杯与蓝盘，caption只写“桌上有杯子”。强制图像向量等于这条文本的全部表示可能丢掉盘子信息；保留patch特征并由问题条件的cross-attention读取，更适合问盘子颜色。
    answer_outline:
    - 共享空间的相似度语义
    - 模态鸿沟的信息/统计原因
    - projector/query/cross-attention条件对齐
    - 任务与反事实评测
    acceptance:
      L1: 区分同维度与已语义对齐。
      L2: 解释图像/文本信息不对称。
      L3: 知道生成VLM不要求完全分布重合。
      L4: 设计双向/局部/反事实任务验证接口有效性。
    follow_ups:
    - L1：两个模型都输出768维能否直接算有意义的余弦？
    - L2：同图多caption为什么不一定能完全重合？
    - L3：减小模态均值距离是否必然提升检索？
    - L4：如何验证LLM回答来自图像而非文字先验？
    pitfalls:
    - 用t-SNE重叠当作完成跨模态理解的证明。
    - 认为投影到LLM embedding维度就无需训练。
    signals:
    - 以任务所需信息解释对齐目标。
    - 能区分检索空间与生成条件接口。
