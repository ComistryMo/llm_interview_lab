    one_liner: 清洗需要可追溯的每阶段统计与抽样审计，不能把一个质量分或毒性分当作完整数据真相。
    core_answer:
    - 保留来源与使用条件后做解析、正文提取、编码规范化、语言识别和长度/重复/乱码规则；对代码、多语言混合和公式单独分桶，避免按普通自然语言规则误杀。
