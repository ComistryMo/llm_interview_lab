    - 常见语言LN沿最后d维算μ、σ²，y=γ(x−μ)/√(σ²+ε)+β，每个样本/位置独立且train/eval同规则。BN通常每通道跨batch及空间聚合，训练用批统计并更新running stats，推理用running
