  - id: EGT-QB-119
    kind: eight_stock
    title: Prefill/Decode 分离与 Chunked Prefill：TTFT和TPOT的权衡
    domain: inference_systems
    tracks:
    - systems
    - llm_algorithm
    skills:
    - skill.inference_systems.serving
    - skill.inference_systems.capacity
    - skill.inference_systems.kv_cache
    priority: P1
    difficulty:
