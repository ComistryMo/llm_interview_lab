    prompt: 开启FSDP FULL_SHARD后参数平时在哪，前向和反向何时聚合？解释它与ZeRO-3的关系以及为什么峰值显存不会简单除以GPU数。
    one_liner: FULL_SHARD把参数、梯度和优化器状态分到数据并行rank，按模块计算前临时all-gather，反向reduce-scatter；目标类似ZeRO-3，运行时和API并不等同。
    core_answer:
    - 在经典PyTorch FSDP FULL_SHARD语义中，每rank持模型状态分片；计算一个FSDP单元前all-gather参数，前向后可reshard，反向再取需要的参数并reduce-scatter梯度，优化器更新本地状态分片。预取/不reshard配置会改变时机。
    - ZeRO-1分优化器状态，ZeRO-2再分梯度，ZeRO-3再分参数；FSDP完整分片与ZeRO-3解决相似冗余问题，但包装单元、预取、CPU offload、checkpoint和版本实现不同，不能互换所有配置。
    - 常驻状态近似按DP度缩小，但还要临时完整参数、通信buffer、激活、fragmentation和峰值重叠。包装单元过大导致大all-gather峰值，过小导致很多小collective和调度成本。
    - checkpoint需明确full/sharded状态及优化器格式、恢复world size；混合精度、梯度累积/no_sync、共享权重和CPU offload影响内存与通信。实际流程按FSDP1/2与版本确认，本题以FULL_SHARD生命周期为主。
    derivation_or_example: 8卡分片一个1GB参数模块，每卡平时约125MB参数分片，但计算该模块时可能需要约1GB完整参数及其他buffer；不是前向峰值永远125MB。把整模型包成一个单元可能失去期望峰值收益。
    answer_outline:
    - all-gather/reshard/reduce-scatter
    - ZeRO三个阶段对应
    - 常驻与峰值显存
    - 粒度、版本和恢复
    acceptance:
      L1: 知道三类模型状态都可分片。
      L2: 说清参数聚合与梯度散发时机。
      L3: 能解释峰值不等于常驻除卡数。
      L4: 能在版本/包装粒度/checkpoint约束下作选择。
    follow_ups:
    - L1：FSDP各rank是否仍处理不同数据？
    - L2：为什么all-gather单元过大或过小都不好？
    - L3：梯度累积期间禁同步为何可能增显存？
    - L4：不同world size恢复怎样保持参数与优化器一致？
