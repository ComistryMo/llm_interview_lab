    one_liner: Sinusoidal加到表示、RoPE旋转Q/K、ALiBi加到logit；相对位置结构提供归纳偏置而非无限外推保证。
    core_answer:
    - Sinusoidal用sin(p/10000^(2i/d))与cos同频配对后加到token表示，无需学习每个位置向量；固定频率可计算任意p，但训练外组合仍可能失效。
    - RoPE对每个二维分量用R(pθ)=[[cos(pθ),−sin(pθ)],[sin(pθ),cos(pθ)]]旋转Q/K；R(m)ᵀR(n)=R(n−m)，故q_mᵀk_n=qᵀR(n−m)k。它保范数且将相对距离进入点积，通常不旋转V。
    - 因果ALiBi给logit加−a_h(i−j)，j≤i且各头斜率不同，形成距离惩罚；不需位置embedding。三者外推都依赖训练长度、频率/斜率及任务，RoPE远距相位和ALiBi远距惩罚会影响可用信息。
    derivation_or_example: 将m、n同时平移Δ，RoPE相对旋转角仍为(n−m)θ；但已旋转cache必须继续用一致位置和频率。interleaved与split-half布局都可实现，不能混用配对方式。
