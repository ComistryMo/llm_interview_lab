  - id: EGT-QB-089
    kind: eight_stock
    title: 事实性与忠实性幻觉：先定义证据，再定位原因
    domain: evaluation
    tracks:
    - llm_algorithm
    - post_training
    - agent
    skills:
    - skill.evaluation_safety.benchmarks
    - skill.data_mlops.experiments
    priority: P1
