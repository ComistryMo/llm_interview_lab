  - id: EGT-QB-112
    kind: eight_stock
    title: PTQ、QAT、GPTQ、AWQ：从量化公式到激活误差
    domain: quantization
    tracks:
    - systems
    - llm_algorithm
    skills:
    - skill.inference_systems.quantization
    - skill.inference_systems.kernels
    - skill.data_mlops.reproducibility
    priority: P1
    difficulty:
      concept: 4
      implementation: 3
      debugging: 4
    seniority:
    - new_grad
    - mid
    - senior
    prompt: 将BF16模型部署为INT8或INT4时，如何区分PTQ与QAT，并解释GPTQ与AWQ为什么都需关注层输入分布？
    one_liner: PTQ在训练后选择低比特表示，QAT在训练中模拟量化误差；GPTQ用二阶信息补偿权重误差，AWQ用激活统计保护重要通道。
    core_answer:
    - 仿射量化q=clip(round(x/s)+z,qmin,qmax)，反量化x̂=s(q−z)；对称量化常取z=0。INT8/INT4表示可用等级不同，粒度可为tensor、channel或group；scale/zero-point元数据也占存储。
    - PTQ不做常规完整重训练，可能使用校准、误差优化与重构；QAT在前向插入fake quant并通过近似梯度让参数适应部署误差。不能笼统说PTQ绝不优化任何变量，或QAT训练全程真INT4反传。
    - GPTQ近似最小化层输出误差||WX−ŴX||²，使用输入相关的二阶近似逐组量化并向未量化权重补偿误差。AWQ发现部分输入激活通道对应重要权重，用等价通道缩放降低这些权重量化损失，主要是activation-aware
      weight-only方法。
    - 选择取决于硬件kernel、校准分布、group size、异常值和SLO；INT4权重常搭配FP16/BF16激活，并不自动比INT8所有场景更快。评测应覆盖PPL、任务切片、prefill/decode、显存与去量化开销。
    derivation_or_example: 对称INT8、scale=0.1时，x=0.26量化为3，反量化0.3；x=20会饱和到12.7。若该权重对应的激活幅度很大，同样0.04权重误差会造成更大的输出误差。
    answer_outline:
    - INT8/INT4量化公式与粒度
    - PTQ/QAT训练语义
    - GPTQ二阶补偿/AWQ缩放
    - 校准、kernel与质量性能
    acceptance:
      L1: 能手算量化反量化误差。
      L2: 区分PTQ、fake-quant QAT和权重/激活精度。
      L3: 正确解释GPTQ与AWQ的不同机制。
      L4: 按工作负载检验精度与kernel收益。
    follow_ups:
    - L1：per-channel为什么可能比per-tensor误差小？
    - L2：GPTQ为何关心XXᵀ而非仅权重直方图？
    - L3：AWQ用激活统计是否就表示量化激活？
    - L4：INT4节省显存但延迟变差如何定位？
    pitfalls:
    - 把AWQ叫作激活INT4量化算法。
    - 只按比特数宣称无条件加速或质量无损。
    signals:
    - 从层输出误差解释校准作用。
    - 明确权重、激活、KV和累加精度各是什么。
