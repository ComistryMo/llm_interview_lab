    prompt: 数学求解器能生成多条推导。比较只评最终结果与逐步评分的训练标签、筛选方式、成本和漏洞，并设计一个能区分二者的例子。
    one_liner: ORM 评价整条答案，PRM 评价局部步骤；PRM提供细粒度反馈，但标签成本、步骤粒度及局部正确与全局可达之间仍有缺口。
    core_answer:
    - ORM 接受问题和完整解答，预测最终正确/偏好；可用二分类CE或成对偏好损失。PRM 接受问题和推导前缀，对当前步骤正确性评分，需要人工步骤标签、合成错误或可验证过程监督。
    - PRM 可用于beam/tree搜索剪枝、best-of-N重排和过程奖励；序列聚合可用min、乘积或学习聚合，但各有长度偏差且步骤概率并非天然独立。ORM便宜、目标直接，却可能把碰巧正确的错误推导当正例。
    - 局部步骤正确不等于最终能完成证明；不合法跳步、含糊推导和自相矛盾需要上下文评估。过程评分器也会被看似严谨的格式、冗长无用步骤欺骗。
    - 公平比较相同候选集、生成预算和独立最终验证器，分别测最终准确率、首错定位、长度切片、噪声标签鲁棒性与额外推理成本。
    derivation_or_example: 求x²=4，推导“x=2，所以共有一个根”。最终只检查某个合法根会错放该答案；PRM应识别遗漏分支，但若训练标签只看每步算术，也可能放过。两步各得0.9并不能无条件宣称全程正确率为0.81。
    answer_outline:
    - 整答与步骤监督
    - 训练/搜索用途
    - 聚合和标签成本
    - 错误推导反例与公平评测
    acceptance:
      L1: 区分结果标签和步骤标签。
      L2: 说明ORM漏掉碰巧正确过程、PRM可定位首错。
      L3: 识别长度偏差和局部/全局缺口。
      L4: 给出固定候选预算及独立验证器的消融。
    follow_ups:
    - L1：PRM的输入为什么需要推导前缀？
    - L2：min与乘积聚合会怎样偏爱不同长度？
    - L3：合成错误步骤可能让PRM学到什么捷径？
    - L4：过程分升高但最终成功率下降如何查因？
    pitfalls:
    - 把PRM等同于PPO Critic或状态价值函数。
    - 把局部高分推导直接当作形式化证明。
    signals:
    - 能给出答案对但推导错的具体样例。
    - 能说明标注预算与搜索成本对最终收益的影响。
