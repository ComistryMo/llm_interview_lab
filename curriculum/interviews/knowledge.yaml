      - {claim_id: EGT-INF-004-C2, source_id: vllm-metrics-docs, claim: "官方指标设计区分队列、prompt/generation 吞吐、KV residency、TTFT、TPOT 和端到端延迟。", confidence: high, locator: "metrics design documentation"}
      - {claim_id: EGT-INF-004-C3, source_id: pagedattention-paper, claim: "PagedAttention 以页/块管理 KV cache，服务调度需同时考虑碎片和访问布局。", confidence: high, locator: "paper abstract/method"}
