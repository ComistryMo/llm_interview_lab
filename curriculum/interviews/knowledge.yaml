    - new_grad
    - mid
    - senior
    prompt: 同一算术题直接回答经常错，增加中间步骤和多次采样后更准。解释三种方法的差异，并说明为什么长推导与多数票仍不能证明正确。
    one_liner: CoT在输出中提供中间求解步骤，Zero-shot CoT用通用求解指令引导，Self-Consistency对多条采样路径的最终答案聚合；它们增加计算机会但不提供正确性保证。
    core_answer:
    - Few-shot CoT示例包含任务、关键中间步骤和答案，引导模型分解与暂存中间结果；Zero-shot CoT用通用提示诱导分步求解而无需同类演示。实际效果依模型、任务与提示协议，现代推理模型未必需要额外冗长提示。
    - Self-Consistency在同一问题下用随机采样生成多条路径，规范化最终答案后多数投票，近似对不同潜在求解路径做边缘化；它不是选最长路径，也不是把每一步单独投票拼成新推导。
    - 收益可能来自可计算中间状态、任务分解和测试时更多采样预算；不能据可读推导断言它忠实反映内部决策。错误前提、共享偏差和伪推理会产生一致但错误的多数。
    - 固定输出预算、温度、样本数和答案规范化，比直接解码、CoT单样本、等token多样本；配合执行式/符号验证，报告准确率与单位成功成本。对无法验证的答案避免将自述置信当证据。
    derivation_or_example: 5条路径的规范化答案是[8,8,9,8,9]，Self-Consistency选8，但若五条都把题目中的“至少”误读为“恰好”，多数票仍系统性错误。可用改写条件或独立验证发现。
    answer_outline:
    - few-shot与zero-shot提示
    - 多路径最终答案聚合
    - 可能机制及非保证性
    - 等预算验证与成本
    acceptance:
      L1: 能区分三种方法。
      L2: 说明对最终答案而非文本措辞投票。
      L3: 认识共享错误和推导非忠实风险。
      L4: 设计等token预算与独立验证的实验。
    follow_ups:
    - L1：两条不同推导得到同一数值如何计票？
    - L2：为什么提高采样温度可能既增多样性又降单条正确率？
    - L3：多数答案一致但错误如何检测？
    - L4：在固定延迟SLO下何时增加样本比增加单条长度更值？
    pitfalls:
    - 把推导长度当推理水平。
    - 把多数投票当事实证明或无限可提升的保证。
    signals:
    - 将正确率与推理预算同时报告。
