  - id: EGT-QB-096
    kind: eight_stock
    title: 不均衡分类：accuracy、precision、recall、F1 与阈值
    domain: evaluation
    tracks:
    - llm_algorithm
    - post_training
    - agent
    skills:
    - skill.evaluation_safety.benchmarks
    - skill.data_mlops.experiments
    priority: P1
    difficulty:
      concept: 4
      implementation: 3
      debugging: 4
    seniority:
    - new_grad
    - mid
    - senior
    prompt: 正类仅占1%，模型accuracy达99%，训练loss下降但F1几乎为零。用混淆矩阵解释问题，给出按证据排序的排查流程。
    one_liner: Accuracy看整体正确，precision看预测正类有多少真，recall看真实正类找回多少，F1取二者调和平均；阈值和类别权重能让loss与F1走势分离。
    core_answer:
    - Accuracy=(TP+TN)/(TP+TN+FP+FN)，Precision=TP/(TP+FP)，Recall=TP/(TP+FN)，F1=2TP/(2TP+FP+FN)。中文“准确率”应明确指accuracy还是precision；分母为0须事先规定返回0或未定义。
    - 不均衡数据上全预测负类仍有高accuracy。多类macro平均各类F1，micro合并计数，weighted按support加权；单标签全类别情形micro-F1等于accuracy，但不能推广到任意多标签设置。
    - 交叉熵是连续概率目标，F1依赖阈值且不含TN；概率变好但未跨阈值可降loss而不涨F1。检查标签映射、正类方向、logits/sigmoid、阈值、缺失类、类别权重、校准和train/valid分布。
    - 在独立验证集扫描阈值或PR曲线，按业务误报/漏报成本选点，再固定阈值评test。报告各类support、混淆矩阵、PR-AUC与bootstrap区间，必要时重采样/加权并检查校准回退。
    derivation_or_example: 1000例含10正类，全预测负类accuracy=99%、recall=0。另一模型TP=6、FP=4、FN=4、TN=986，precision=recall=F1=0.6，accuracy=99.2%。两个accuracy接近，正类价值完全不同。
    answer_outline:
    - 混淆矩阵四指标
    - 不均衡与macro/micro
    - loss-F1分离机制
    - 验证阈值和标签排查
