    prompt: 模型经过RLHF仍会在改写或多轮诱导下违反安全要求。说明Constitutional AI如何使用原则和AI反馈，并设计兼顾安全与正常帮助性的评测。
    one_liner: 对齐通过数据、反馈和优化改善行为，红队寻找失效分布；行为训练不是执行权限控制，也不能证明所有未来提示都安全。
    core_answer:
    - Constitutional AI以一组明确原则指导模型批评/修订回答，再用AI偏好反馈训练和优化策略；原则选择及模型评审能力都会影响最终价值取向，AI反馈并不天然无偏。
    - 红队主动寻找对安全边界的规避，包括语义改写、角色/上下文混淆和多轮升级；只需描述威胁类别与评测契约，无需把真实有害步骤作为教材答案。越狱成功率需区分模型产生违规内容、实际工具越权和评分器误报。
    - RLHF受偏好覆盖、奖励模型误差、分布外输入和优化压力限制；有帮助与无害也可能冲突。工具权限、敏感数据隔离、参数验证等应由宿主程序落实，不能把语言拒答当唯一控制。
    - 按风险类别与正常近邻任务构造对照集，测攻击成功率、违规严重度、误拒率、正常任务完成和多轮持续性；人工校准、留出未见攻击簇，修复后做回归，不能靠背熟公开红队样例验收。
    derivation_or_example: 正常的网络防御解释应能回答，要求读取无权限文件的工具调用应被执行层拒绝。若模型语言上拒绝但已经执行了读取，安全结果仍失败；若对所有网络问题都拒答，帮助性也失败。
    answer_outline:
    - 原则批评/修订与AI反馈
    - 红队/越狱威胁类别
    - RLHF局限和执行边界
    - 安全与误拒的双向评测
    acceptance:
      L1: 理解对齐是行为学习过程。
      L2: 能解释CAI的监督与反馈环节。
      L3: 区分文本违规和工具实际越权。
      L4: 用未见攻击簇与正常近邻任务联合评估。
    follow_ups:
    - L1：原则列表由谁选择、为何影响结果？
    - L2：拒答率高是否等于安全更好？
    - L3：多轮诱导为什么单轮测试容易漏？
    - L4：修复某类越狱后如何检查正常任务回退？
    pitfalls:
    - 声称RLHF可保证不受任何提示攻击。
    - 把模型声明的权限当宿主授权。
    signals:
    - 关注真实副作用和正常用户成本。
    - 能够说明评测覆盖不足的剩余风险。
