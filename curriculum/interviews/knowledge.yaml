    prompt: 比较全参数微调、LoRA、Adapter、Prefix Tuning与P-tuning的更新位置、显存和推理代价。对于多租户小数据与大规模领域迁移，怎样做有证据的选型？
    one_liner: PEFT主要减少可训练状态和每任务权重存储，激活和服务计算仍要按具体插入位置计算。
    core_answer:
    - 全参更新全部权重及其优化器状态，表达自由度高、每任务副本大；LoRA只训练低秩分支，可合并到线性权重并支持小adapter存储，较强领域变化可能需更大秩或更广目标层，效果并非必输全参。
    - Adapter在层间插入可训练瓶颈非线性模块，模块化但一般不能像纯线性LoRA无损吸收到W，推理增加串行算子。Prefix Tuning在各层注入虚拟K/V，增加attention/cache长度；P-tuning
      v1主要学习输入连续提示，效果依模型和任务，v2是深层提示。
    - 冻结大部分参数减少梯度与优化器状态，不代表无需保存所有相关反向激活；长序列下激活仍可主导。多租户时需比较切换、batch混合和合并管理，prefix增加的每请求成本不能仅用可训练参数百分比描述。
    - 小数据或有限显存可先建立LoRA/提示基线，大规模迁移可对比全参；选择看held-out任务、通用回归、实际峰值、训练时间及线上延迟，保持数据和总预算可比。
    derivation_or_example: 一个d→m→d的Adapter约2dm参数外加bias，输入提示p×d约pd参数，而每层prefix的K/V存储随层数增长；参数相近不意味着推理路径成本相同。
    answer_outline:
    - 更新位置与表达约束
    - 状态和激活账本
    - 推理合并或新增token
    - 场景及受控比较
    follow_ups:
    - L1：冻结主模型是否意味着整个反向都能关闭？
