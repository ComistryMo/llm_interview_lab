    prompt: DeepSeek-V2的MLA如何把多头KV压到一个潜在向量？解释矩阵吸收、单独RoPE分量，以及它和减少KV头的GQA/MQA有何不同；怎样公平评估推理速度？
    one_liner: MLA学习联合低维KV表示，并在解码计算中吸收上投影；带位置的Key分量需单独处理。
    core_answer:
    - 对隐藏状态h_t作c_t^KV=W_DKV h_t，维度dc小于多头KV总维；内容K_i=W_UK,i c、V_i=W_UV,i c。缓存潜在c而非所有展开头，不是事后对现成KV做任意SVD就保证等价。
    - q_iᵀW_UK,i c=(W_UK,iᵀq_i)ᵀc可把Key上投影吸到Query侧；V上投影可与输出映射合并，避免逐历史token展开。普通RoPE插入位置相关旋转会妨碍该吸收，因此MLA另有带RoPE的Q/共享K分量。
    - 推理cache每层每token约dc+dR个元素，乘BLSb，dR为缓存的RoPE Key分量；与GQA/MQA直接共享KV头不同，MLA保留各头可学习上投影。压缩率不等于固定加速率，需同硬件、batch、长度、精度和质量比较prefill/decode，并排除MoE等同时变化的混杂。
