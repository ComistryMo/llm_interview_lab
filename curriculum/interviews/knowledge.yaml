    - 经典logit蒸馏可用L=(1−λ)CE(y,p_s)+λT² KL(softmax(z_t/T)||softmax(z_s/T))；教师固定、梯度只进学生，T改变软标签平滑，T²用于补偿梯度尺度。若词表不同，不能按token索引直接算KL。
    - 黑盒只能观察教师输出时，可筛选任务答案/轨迹做SFT或偏好数据；多样采样与可执行验证控制错误，仍会继承教师盲点。Task-specific蒸馏集中目标领域，通常更省但需测域外回退。
