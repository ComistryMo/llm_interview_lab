    - senior
    prompt: Agent检索到的第一份资料不相关。按ReAct范式说明下一步如何决定、执行和更新状态，并比较它与一次性规划完所有工具调用的优缺点。
    one_liner: ReAct让模型基于当前证据选择动作，再用真实观察更新后续决策；它能纠错和获取新信息，但增加调用成本并可能陷入无效循环。
    core_answer:
    - ReAct的Thought/Action/Observation分别表示模型的中间决策、对环境的动作和真实返回；工程中可保留简短决策摘要及结构化动作，不要求泄露或记录完整内部思维。Observation须由工具实际执行产生。
    - 读取当前任务和已知证据后，模型选择下一工具/参数；宿主验证并调用，写入结果和状态，再让模型决定继续、修正或结束。观察可能改变计划，因此不必一开始精确枚举所有未来步骤。
    - 优势是能通过检索/执行获取新事实，发现错误后调整；缺点是串行延迟、token增长、错误观察传播、过多搜索以及停止困难。工具能力、返回设计和状态摘要质量比Thought长度更重要。
    - 用可验证子目标、重复动作检测、最大步数、预算与终态grader控制循环；对确定固定流程的任务可用workflow减少自由决策。评估应检查轨迹事实一致和任务结果，不只看推理文本。
    derivation_or_example: 第一次search返回同名人物，决策摘要指出实体不匹配，下一动作加入年代/领域过滤；若第二次返回仍相同，要改变检索策略或承认缺证据，不能循环原查询十次并声称已查证。
    answer_outline:
