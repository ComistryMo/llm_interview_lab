    prompt: "一个在线 LLM/VLM 服务同时面对长 prompt 和短请求，如何拆 prefill/decode、设计 continuous batching/chunked prefill，并用 TTFT、ITL/TPOT、p99 和成本做调度决策？"
    one_liner: "prefill 受 prompt 计算和大批量吞吐影响，decode 受 KV 带宽与每步公平性影响；调度器必须显式管理 token/KV 预算、队列和尾延迟。"
    core_answer:
      - "prefill 一次处理输入上下文，decode 逐 token 追加 KV；两阶段共用 GPU 但资源瓶颈不同，不能只用平均 tok/s 衡量。"
      - "连续批处理让新请求在已有 decode 迭代间加入；chunked prefill 可缓解长 prompt 阻塞 decode，但会改变 TTFT、ITL、吞吐和公平性。"
      - "记录 queue/admission time、TTFT、ITL/TPOT、E2E、prompt/generation tokens/s、KV 使用率、抢占/重算、p50/p95/p99 和 cost per success。"
      - "SLO 先定义 workload/QPS/长度分布和优先级，再选择 FIFO、token budget、round-robin、deadline、prefix reuse 或 preemption；每个策略要有回放和容量上界。"
    derivation_or_example: "给 2 个长 prompt 和 8 个短请求，在每步 prefill=128、decode=8、KV 容量固定的条件下画队列，预测一个调度策略对 TTFT/ITL 的影响。"
