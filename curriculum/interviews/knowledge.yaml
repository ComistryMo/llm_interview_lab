    prompt: 分布式训练写checkpoint时某个rank退出。怎样避免恢复半个检查点？列出精确续训需要保存的状态，并说明变更world size后的可恢复性边界。
    one_liner: 权重文件可用于推理，可靠续训还需优化器、进度、随机与数据游标的一致快照。
    core_answer:
    - 保存模型及优化器分片、scheduler、scaler、global step/已消费token数、RNG、sampler/数据游标、配置、tokenizer和数据版本；若在累积中途保存，还要保存待累积梯度或选择一致的step边界。
    - 先写唯一临时版本，校验分片数、大小和hash，所有rank完成后再原子提交manifest/完成标记；加载器只接受已提交版本。异步写需冻结一致快照，并把写失败暴露给主训练流程。
    - 保留最近、最佳与周期归档并演练加载及下一步loss/梯度对照。重分片工具能支持改变并行度，但sampler重排、非确定kernel及归约顺序可能破坏逐位一致，不能承诺不同拓扑完全复现。
    derivation_or_example: Adam只恢复θ而m/v清零，下一步自适应更新已不同；只恢复global step但重置数据游标会重复消费样本。恢复检查应比较“接下来读到什么”及“接下来怎么更新”。
    answer_outline:
    - 完整状态清单
    - 一致快照与提交协议
    - 恢复演练与拓扑限制
