    seniority: [new_grad, mid, senior]
    prompt: "比较 GRPO、DAPO 和 GSPO 在长推理、MoE 和异步 rollout 下的 ratio/reduction 粒度，如何监控 stale policy、熵坍塌和有效样本？"
    one_liner: "DAPO 是围绕长 CoT 的采样、截断和 clipping recipe；GSPO 将重要性比率提升到序列粒度；两者都必须用版本、ratio、KL、长度和有效样本日志验证。"
    core_answer:
      - "GRPO 常用 group-relative reward/advantage；DAPO 的 dynamic sampling、decoupled clipping、有效 token 归一化和 overlong 处理各对应不同稳定性问题。"
      - "GSPO 先对有效 completion token 的 log-ratio 求平均再取 exp，得到 sequence-level ratio；不能把 token ratios 直接相乘而忽略长度。"
      - "rollout/learner 解耦时记录 policy version、tokenizer/template、平均与分位 stale KL、ratio、等待时间、过滤/补采样成本。"
      - "监控 entropy、clip fraction、zero-variance/all-correct/all-wrong group、completion length、verifier success 和 hidden eval，避免吞吐掩盖 off-policy 偏差。"
    derivation_or_example: "对两条长度分别为 2、8 的 completion 写出 token-level ratio、exp(mean(log ratio)) 和 raw product，说明三种 reduction 的偏差。"
    answer_outline: ["统一 B/G/T 记号", "比较 ratio/reward/reduction 粒度", "画 rollout—learner 版本边界", "给稳定性监控和回滚 gate"]
    acceptance:
      L1: "能说清 GRPO/DAPO/GSPO 的粒度差异。"
      L2: "能手算 sequence ratio、mask 和 stale 指标。"
      L3: "能设计动态采样/截断/异步的消融与回滚条件。"
    follow_ups: ["Clip-Higher 为什么可能缓解 entropy collapse，何时会增加风险？", "Dynamic Sampling 改变了什么训练分布，如何估计选择偏差？", "全对/全错 group 如何处理而不悄悄改变全局权重？", "如何区分 verifier 变差、policy stale 和 kernel/logit 不一致？"]
    pitfalls: ["把 token denominator、sequence ratio 和 sample mean 混为一谈", "用 raw product 代替 geometric mean 造成长度偏差", "过滤样本后跨 rank 不一致却不记录补采样", "只看 rollout tok/s，不看 stale KL、hidden quality 和安全"]
    signals: ["公式、shape、mask 与日志字段一致", "能用 toy batch 证伪 reduction", "把系统吞吐与训练有效性分开衡量"]
    source_claims:
