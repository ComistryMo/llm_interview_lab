    prompt: 摘要模型把所有实体名写错，但保留了大量原句；另一个模型准确改写，词面重叠很低。BLEU/ROUGE会怎样评分，何时仍适合作为基线？
    one_liner: BLEU偏向修正n-gram精确率并惩罚过短，ROUGE常测参考覆盖；词面重叠不能充分判断事实、否定、同义和开放式质量。
    core_answer:
    - BLEU=BP·exp(Σn w_n log p_n)，p_n 为截断计数的n-gram precision，BP在候选短于参考时惩罚。通常应以语料级累计计算，句级高阶n-gram零值和smoothing选择影响很大。
    - ROUGE-N看参考n-gram覆盖，常报告recall、precision或F1；ROUGE-L使用最长公共子序列衡量顺序覆盖。必须注明变体、分词、stemming、参考数量和聚合方式。
    - 同义正确改写会被低估，复制但实体/否定错可被高估；因此与人类判断的相关性取决于任务、系统差异和评估粒度，并非所有场景都必然差。
    - 机器翻译或摘要中，在固定标准参考和可复现预处理下仍可作为快速回归基线；应结合事实一致性、语义相似、任务成功和人工抽检，不应用词面分数判断无参考开放对话。
    derivation_or_example: 参考“药物A未改善症状”，候选“药物A改善症状”有很高重叠却翻转含义。候选“症状并未因A用药而好转”较忠实但字面匹配下降；仅看ROUGE会漏掉关键差异。
    answer_outline:
    - BLEU公式与BP
    - ROUGE-N/L及口径
    - 实体/否定/改写反例
    - 固定参考场景与互补指标
    acceptance:
      L1: 解释precision与recall倾向。
      L2: 正确写BLEU聚合及ROUGE-L对象。
      L3: 用否定或实体反例指出语义盲点。
      L4: 能设计规范化协议与事实/人工互补评估。
    follow_ups:
    - L1：BLEU为何需要brevity penalty？
    - L2：把句级BLEU简单平均有什么问题？
    - L3：增加参考答案为何可能改变系统排序？
    - L4：指标和人类排序冲突时怎样定位是协议还是目标偏差？
    pitfalls:
    - 将高ROUGE自动解释为事实正确。
    - 不说明ROUGE具体变体或BLEU预处理便横向比较。
    signals:
    - 能保留指标适用条件而非全盘否定。
    - 给出关键字错一个而语义反转的样例。
