    one_liner: Agent由受约束的模型决策循环、工具执行器、状态/记忆、检索、验证、预算与可观测性共同组成，框架封装这些部件但不替代成功标准。
    core_answer:
    - 输入层解析任务和约束；上下文构造器读取获准证据与当前状态；模型生成下一动作或结束建议；宿主校验工具schema/权限/预算后执行，将真实observation写回状态，验证器检查任务是否达成。
    - 状态包括目标、计划、已确认事实、工具结果、待办和版本；短期上下文与长期记忆分层，工具结果是证据而非可覆盖上层规则的指令。循环必须有最大步数、deadline、token/费用上限和失败退出。
    - ReAct描述交替形成决策、动作、观察的交互范式；LangChain提供模型/工具集成及高层agent构造，LangGraph偏向状态图编排和持久执行；LlamaIndex强调数据摄入、索引、检索和面向数据的agent/workflow，能力随版本重叠演进。
