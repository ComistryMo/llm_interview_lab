    prompt: Reward Model 在离线偏好对上准确率很高，但用它训练后回答更长、事实更差。如何评测模型并证实或排除reward hacking？
    one_liner: 离线成对排序只是起点，还需测切片、校准、分布外表现和被策略优化后的独立真实效用。
    core_answer:
    - 在按prompt/来源簇隔离的held-out偏好数据上评估P(r_chosen>r_rejected)，处理平局与标注分歧；分开聊天、安全、推理、难例和长度受控对，检查RM是否靠长度/格式捷径。
    - BT式偏好模型只有差值决定胜率，绝对reward平移不改变成对排序；概率校准、ECE/Brier、成对margin分布与不确定性可作补充，但必须有适当标注概率或采样设计。
    - Reward hacking是优化策略利用代理奖励漏洞；随着best-of-N或RL强度增加，代理分数上升而独立人工/执行真值下降是重要证据。用未参与优化的评审、对抗样例与长度匹配实验排除简单分布差异。
    - 缓解可用更准确/多维奖励、困难负例与迭代再标注、KL约束和早停、独立verifier及奖励ensemble；ensemble共享训练偏差时也可能一起被利用，不能视作保证。
    derivation_or_example: 构造内容完全相同、仅添加礼貌冗语的偏好对。若RM稳定偏好长版，且RL后长度大涨但执行通过率下降，应追踪长度reward相关、独立真值曲线和策略KL，不能只看RM held-out
      accuracy。
    answer_outline:
    - 偏好排序与切片
    - 长度捷径和校准
    - 优化强度下独立效用
    - reward hacking缓解
    acceptance:
      L1: 定义held-out pair accuracy。
