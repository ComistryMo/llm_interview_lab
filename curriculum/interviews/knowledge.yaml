  - id: EGT-QB-160
    kind: eight_stock
    title: Video-LLaMA：时序/音频桥接与多模态检索
    domain: multimodal_architecture
    tracks:
    - vlm_algorithm
    - post_training
    skills:
    - skill.llm_vlm.vlm_architecture
    - skill.llm_vlm.multimodal_data
    - skill.deep_learning.losses
    priority: P1
    difficulty:
      concept: 4
      implementation: 3
      debugging: 4
    seniority:
    - new_grad
    - mid
    - senior
    prompt: 一个视频问答系统需要理解先后顺序与声音，同时支持按文字检索片段。用原始Video-LLaMA说明数据流，并比较全局向量、分段索引和多路融合检索。
    one_liner: Video-LLaMA以帧视觉特征和音频特征经各自Q-Former/位置编码接入LLM；检索则需将时间、模态和证据片段显式建模，整段平均向量不能保证时序理解。
    core_answer:
    - 按EMNLP 2023原始官方设计，视觉分支用ViT-G/14与BLIP-2 Q-Former取得逐帧表示，再加frame embedding和两层video Q-Former聚合，投影到语言解码器；帧顺序/时间采样是输入语义的一部分。
    - 音频分支使用ImageBind-Huge特征，加音频分段位置和audio Q-Former再投影；跨模态阶段主要训练video/audio Q-Former、位置及线性层。原始借助已对齐ImageBind连接音频能力，不应假称训练了完整语音识别器或已精确处理所有同步关系。
    - 检索可用视频/图像与文字双塔全局向量做粗召回，按时间段/关键帧分块向量做细召回，再用跨模态交互或VLM重排；ASR、OCR、标题与视觉可多索引late fusion，分数需校准并保留来源/时间戳。
    - 全局平均会丢失“先开门后坐下”的顺序，稀疏抽帧可能漏短事件，ASR也可能错；评估text↔video Recall@K、时间区间IoU、事件顺序、音画一致与问答正确率，固定帧数、采样率、音频长度和成本，答案引用到实际片段。
    derivation_or_example: “先放杯子再倒水”与“先倒水再放杯子”可有同样对象集合和类似平均embedding，但时间顺序不同。用带时间戳片段索引检索操作区间，再保持帧顺序重排，才能验证动作先后。
    answer_outline:
    - 逐帧视觉到video Q-Former
    - ImageBind/audio Q-Former
    - 全局/分段/多路检索
    - 时序、同步与指标
    acceptance:
      L1: 能描述视觉与音频两条路径。
      L2: 说明帧/音频位置和Q-Former作用。
      L3: 区分全局检索与时序定位。
      L4: 能设计带时间戳证据的融合检索和公平评测。
    follow_ups:
    - L1：无frame position的平均池化为何难区分先后？
    - L2：抽帧率降低会漏掉哪些事件？
    - L3：ASR与视觉检索分数如何融合而不被一方尺度支配？
    - L4：音画不同步或缺音频时应怎样建模和验证？
    pitfalls:
    - 把Video-LLaMA的原始设计混成后续VideoLLaMA2/3。
    - 只用整段caption相似度宣称具备精确时间grounding。
    signals:
    - 输出证据能定位到时间片段。
    - 模型版本、帧采样和音频输入契约清晰。
