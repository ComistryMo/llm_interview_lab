  - id: EGT-QB-082
    kind: eight_stock
    title: BPE、WordPiece、Unigram：合并、解码与中文词表预算
    domain: tokenization
    tracks:
    - llm_algorithm
    - post_training
    skills:
    - skill.llm_vlm.tokenization
    - skill.data_mlops.data_quality
    priority: P1
    difficulty:
      concept: 4
      implementation: 3
      debugging: 4
    seniority:
    - new_grad
    - mid
    - senior
    prompt: 为中英混合代码助手选 tokenizer。说明三种算法如何训练和切分，再用一个合并示例解释 BPE 的未登录词、复杂度和词表成本。
    one_liner: BPE 按合并优先级组合符号，WordPiece 通常最长匹配，Unigram 用概率模型选择切分；字符覆盖、byte fallback 和任务分布决定中文取舍。
    core_answer:
    - BPE 从字符或字节表出发，统计相邻 pair 的频次并反复合并，保存有序 merge ranks；编码时反复应用可用的最高优先级合并，不是直接最长词匹配。WordPiece 的常用训练解释按 pair 相对边际频率选择合并；原始训练实现并未完全公开，应区分教学近似与既定词表上的最长匹配编码。
    - Unigram 从较大候选词表开始，以句子切分概率的和作似然，迭代估计 token 概率并裁剪；编码可用 Viterbi 最大概率路径，也可采样多种切分。中文可直接以 Unicode 字符为初始单位，不要求先按词切分；规范化和标点规则要固定。
    - BPE 子词组合能表示新词，但字符级 BPE 遇到初始字母表之外字符仍可能产生 UNK；完整256字节表或显式 byte fallback 才可覆盖任意合法编码文本。朴素训练 K 轮、总长度 M 时可达 O(KM)，单词编码反复全扫描最坏
      O(n²)；增量计数/优先队列可改善，不能宣称所有实现线性。
    - 词表 V 增大通常缩短序列，但 embedding/输出矩阵约 Vd 参数且 softmax 成本增长；应比较中英代码的每字符 token 数、截断率、罕见字恢复、延迟和同算力任务效果，无通用中文最优词表大小。
    derivation_or_example: 语料有3次 a b、2次 a c，首轮合并 a+b→ab 后频次必须更新；新词 a b c 可编码为 ab,c。若基础表没有“龘”且无 byte fallback，已有
      merge 规则不能凭空表示它。V 从32k增至64k、d=4096且输入输出绑权时增加约1.31亿参数。
    answer_outline:
    - 三种训练与编码策略
    - 中文规范化与词表大小
    - BPE 合并示例和 OOV 条件
    - 训练/编码复杂度与输出成本
    acceptance:
      L1: 能区分词与子词、说明新词可拆。
      L2: 正确给出 BPE ranks、WordPiece 贪心和 Unigram 概率切分。
      L3: 能说明字符 OOV、byte fallback 及朴素复杂度前提。
      L4: 用总 token 成本、罕见字覆盖和任务消融选择词表。
    follow_ups:
    - L1：BPE 合并优先级与最长匹配何时输出不同？
    - L2：Unigram 如何用动态规划找到最优切分？
    - L3：中文稀有字为何仍会 UNK，如何构造回归样例？
    - L4：固定训练 FLOPs 比较32k/64k词表怎样避免偏袒某方案？
    pitfalls:
    - 把 BPE 的名称理解为必然以字节初始化。
    - 把 WordPiece 的教学打分公式当作已公开的唯一官方训练算法。
    - 只比较词表文件大小，忽略序列长度和 Vd 参数。
    signals:
    - 能手动更新一次 pair 计数并保留词边界规则。
    - 能区分语义词、Unicode字符、UTF-8字节和 token。
