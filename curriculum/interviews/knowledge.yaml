  - id: EGT-INF-005
    kind: eight_stock
    title: "AWQ、GPTQ、FP8 与并行部署的质量—性能账本"
    domain: inference_optimization
    tracks: [systems, llm_algorithm, vlm_algorithm]
    skills: [skill.inference_systems.quantization, skill.inference_systems.capacity, skill.inference_systems.kernels, skill.training_infra.distributed, skill.data_mlops.reproducibility]
    priority: P1
    difficulty: {concept: 5, implementation: 4, debugging: 5}
    seniority: [new_grad, mid, senior]
    prompt: "如何在 W4A16、W8A8/FP8 与 TP/PP/DP/EP 之间做部署选型，并证明位宽下降真的改善了质量、显存、尾延迟和成本？"
    one_liner: "量化只改变部分存储/计算路径；校准分布、kernel 支持、通信和累加精度决定端到端结果，必须做质量—显存—p99—成本 Pareto。"
    core_answer:
      - "AWQ 侧重激活感知的权重保护，GPTQ 以近似二阶误差最小化做后训练量化；两者都依赖校准数据和硬件 kernel，不能只看 bit 数。"
      - "FP8/W8A8 还涉及 scale、动态范围、outlier、累加精度和硬件支持；W4A16 可能主要省权重显存而不一定减少 decode 带宽/端到端延迟。"
      - "TP 主要切层内矩阵并有 collective，PP 引入 pipeline bubble，DP 复制模型处理请求/样本，EP/MoE 需要 all-to-all 和负载均衡；通信可能吞掉量化收益。"
      - "锁定 checkpoint、calibration、tokenizer/template、driver/kernel 和 batch/workload，报告任务切片、KV/权重显存、TTFT/TPOT、p99、吞吐、错误率和 cost per success。"
    derivation_or_example: "给一个线性层权重、激活 scale、TP=2 的 toy 账本，比较 W4A16 与 FP8 的存储/通信项，并列出 kernel fallback 的诊断顺序。"
    answer_outline: ["区分权重/激活/累加精度", "比较量化算法和校准", "画 TP/PP/DP/EP 通信", "用 Pareto 与回归 gate 验证"]
    acceptance:
      L1: "能说明 AWQ/GPTQ/FP8 的对象和限制。"
      L2: "能估算显存、通信和 kernel 路径。"
      L3: "能设计跨硬件、质量切片、尾延迟和回滚实验。"
    follow_ups: ["什么时候 W4A16 只省显存却不提速？", "校准集分布漂移如何被发现和修复？", "TP/PP/EP 的通信与故障域怎样影响 batch 和 MoE？", "如何证明低精度误差来自量化而不是 tokenizer、采样或 kernel fallback？"]
    pitfalls: ["把位宽下降直接等同端到端加速", "忽略 scale/packing/dequant/累加精度", "用单卡 benchmark 推断多卡通信", "未锁硬件/驱动/版本就比较 p99 或质量"]
    signals: ["能列出完整显存和通信账本", "会先检查实际 kernel/profile", "用 Pareto 和 hidden regression 而不是单点分数决策"]
    source_claims:
      - {claim_id: EGT-INF-005-C1, source_id: awq-paper, claim: "AWQ 通过激活感知保护重要权重通道，量化效果依赖校准分布和实现路径。", confidence: high, locator: "paper abstract/method"}
      - {claim_id: EGT-INF-005-C2, source_id: gptq-paper, claim: "GPTQ 使用近似二阶信息进行后训练权重量化，误差与层/校准数据相关。", confidence: high, locator: "paper abstract/method"}
      - {claim_id: EGT-INF-005-C3, source_id: fp8-formats-paper, claim: "FP8 格式选择涉及数值范围、精度和硬件实现约束，不能只以位宽比较。", confidence: high, locator: "paper format analysis"}
      - {claim_id: EGT-INF-005-C4, source_id: vllm-official-docs, claim: "vLLM 官方文档列出量化与硬件支持边界，部署行为需按版本复核。", confidence: high, locator: "quantization documentation"}
