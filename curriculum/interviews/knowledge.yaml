    - claim_id: EGT-QB-083-C1
      source_id: dedup-paper
      claim: 预训练去重可降低训练/测试重叠与记忆，文档级和子串级检测互补。
      confidence: high
    - claim_id: EGT-QB-083-C2
      source_id: qb-simhash
      claim: SimHash 位签名与小 Hamming 半径可用于大规模网页近重复检测。
      confidence: high
