    prompt: 服务中短请求被同批长请求拖住且KV预留浪费严重。解释vLLM中的PagedAttention和continuous batching如何分别处理问题，并给出吞吐与尾延迟的测量方案。
    one_liner: 缓存按块管理提升可容纳并发，调度按迭代更新活跃请求提升利用率，两者共同影响服务性能。
    core_answer:
    - 分页把每个序列的逻辑KV块通过块表映射到物理块，生成增长时追加，结束时回收；共享前缀用引用计数及写时复制。它借鉴虚拟内存管理，不等于GPU会自动把所有KV透明换到磁盘。
    - 静态batch通常等待本批全部结束再换批；continuous/iteration-level batching可在解码迭代之间移除完成请求并加入新请求。调度还需限制token和KV预算，协调prefill、decode及抢占。
    - 更多并发可摊薄权重读取并提升吞吐，但prefill大任务、排队和抢占可能恶化TTFT/TPOT。比较时固定输入/输出长度分布、到达率、硬件、模型、采样配置并报告吞吐与P95/P99延迟，而非引用论文倍率当普适值。
    derivation_or_example: A生成2步、B生成8步：静态批的A位置会空等，逐迭代调度可在A结束后纳入C；若C的长prefill一次占满预算，B的下一token仍可能被延迟。
    answer_outline:
    - 块表与共享
    - 迭代级接纳和预算
    - 吞吐及延迟约束实验
    follow_ups:
    - L1：分页和continuous batching是否同一种优化？
    - L2：固定块长为何仍有最后一块内部浪费？
    - L3：长prefill如何影响活跃decode，chunking如何取舍？
    - L4：达到最大吞吐但违反SLO时怎样调整接纳和batch预算？
    pitfalls:
    - 宣称continuous batching由vLLM独自首创
    - 只报tokens/s而隐去排队延迟和长度分布
    signals:
    - 能将KV分配约束与调度时间线相连，报告负载范围内的可持续吞吐
    acceptance:
      L1: 区分页管理与调度
      L2: 解释块表和动态接纳
      L3: 覆盖抢占及prefill干扰
      L4: 用SLO和到达率定义吞吐实验
