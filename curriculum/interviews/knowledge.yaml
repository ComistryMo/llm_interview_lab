    prompt: QLoRA为何能在4-bit基座上微调而不把全部梯度和优化器都存成4-bit？解释NF4、Double Quantization与paged optimizer的不同作用，并给出显存和误差核验方案。
    one_liner: QLoRA冻结量化基座、训练高精度低秩适配器，NF4压权重、二次量化压尺度元数据。
    core_answer:
    - 基座按块量化存储，计算时反量化到BF16等计算dtype，通过冻结权重的运算反传到LoRA参数；量化整数本身不是普通可训练浮点参数，adapter梯度和优化器状态另记。
    - NF4使用为近似正态权重设计的非均匀4-bit码本，结合块尺度表示权重；不是IEEE FP4格式，也不保证对任何分布都是最优。Double Quantization进一步量化第一层量化常数/尺度，降低元数据平均位数。
    - Paged optimizer通过CPU/GPU统一内存管理缓解内存尖峰，可能付出换页传输成本，和PagedAttention的KV块管理不同。总显存还含adapter状态、激活、反量化workspace及尺度，不能仅用0.5P字节估总峰值。
    derivation_or_example: 64权重一块，4-bit载荷共32字节；若每块还存FP32 scale则额外4字节，相当每权重再加0.5bit。二次量化针对这类开销，具体位数依实现而定。
    answer_outline:
    - 冻结基座与adapter梯度
    - NF4和二次量化
    - paged optimizer与完整账本
    follow_ups:
