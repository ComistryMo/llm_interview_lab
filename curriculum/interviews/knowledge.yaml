    prompt: 假设q、k各维独立、零均值、单位方差，推导q·k的方差及除以√dk的理由。若这些假设不成立，结论应如何限定？
    one_liner: 点积方差随维数增长，√dk缩放使logit尺度在简化假设下保持常数量级。
    core_answer:
    - q·k=Σ_i q_i k_i，若各乘积独立且q_i与k_i独立，E[q_i k_i]=0、Var(q_i k_i)=1，所以Var(q·k)=dk；缩放后方差为1，除以dk则会降为1/dk。
    - 大幅logit差让softmax接近one-hot，其Jacobian为diag(p)−ppᵀ，多数导数很小；合适尺度有助避免初始化时过早饱和。数值稳定softmax减最大值只防溢出，不会改变这一饱和程度。
    - 实际训练的q/k可能相关、非单位方差，因此这是一种动机和尺度约定；QK normalization、温度和初始化也会改变有效尺度，不能以方差推导证明任何数据下梯度必稳定。
    derivation_or_example: dk从64增到256，未缩放点积标准差从8到16；分别除以8和16后都约1。令p=(.999,.001)，对角导数约.001，显示饱和影响。
