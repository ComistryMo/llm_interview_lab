  - id: EGT-QB-084
    kind: eight_stock
    title: Self-Instruct、Evol-Instruct、Magpie：如何验证合成指令
    domain: data_engineering
    tracks:
    - llm_algorithm
    - post_training
    skills:
    - skill.data_mlops.data_quality
    - skill.data_mlops.reproducibility
    - skill.evaluation_safety.leakage
    priority: P1
