    prompt: 不训练新的分类头，CLIP怎样用类别文字给图片分类？从图文编码、归一化、温度和双向对比目标推导这一过程。
    one_liner: CLIP用图文配对学习可比较的归一化向量，以batch内双向分类对比训练；zero-shot时把类别文本编码成候选原型，与图像比较相似度。
    core_answer:
    - 图像编码器f和文本编码器g各自产生表示，经投影到共同D维并L2归一化，I_i=f(x_i)/||f(x_i)||、T_j=g(t_j)/||g(t_j)||。logits S_ij=I_iᵀT_j/τ，τ>0通常通过可学习logit
      scale参数化。
    - 对N配对样本，L_i2t=−(1/N)Σ_i log exp(S_ii)/Σ_j exp(S_ij)，反向L_t2i交换两轴，L=(L_i2t+L_t2i)/2；对角线是已知配对，非对角线作为batch内负例的假设需审查重复/多正样本。
    - Zero-shot分类对每个类别构造描述prompt并编码为文本原型，与图像向量做相似度/softmax选类，可对多个合理模板做集成；没有用目标分类训练样本拟合新分类头，但仍受预训练数据与类别描述影响。
    - CLIP原始图像tower包含ResNet/ViT等配置、文本tower为Transformer。它主要学习跨模态全局语义匹配，不自动提供精确OCR、空间关系、计数或开放式文字生成能力；评估需含域移和细粒度切片。
    derivation_or_example: 类别为“猫”“狗”，把“猫的照片”“狗的照片”分别编码为T_cat/T_dog，比较I·T_cat和I·T_dog；若文本描述写成与训练风格差异很大的隐喻，zero-shot边界可能变差。D相同不代表两tower参数相同。
    answer_outline:
    - 双编码器与投影归一化
    - 温度/双向InfoNCE公式
    - 类别文本原型与zero-shot
    - 架构选择和细粒度限制
    acceptance:
