    one_liner: 模型根据任务、工具说明和训练经验生成结构化调用建议；宿主验证授权与参数后执行，再按call ID将真实结果回传。
    core_answer:
    - 向模型提供允许工具的名称、用途、输入schema与必要描述，结合当前任务/上下文决定不用工具、选择一个或多个；模型是在生成受接口约束的消息，不是直接获得任意函数执行权。
    - 宿主解析调用的工具名、call ID和arguments，校验schema、必需字段、值域、权限和资源预算，再调用已登记实现；不使用eval执行模型返回的代码或任意名称。并行调用只有在无数据依赖且语义允许时才合并。
    - 执行结果按对应call ID回传，包含成功、结构化数据或明确错误状态；模型可基于结果继续调用或生成最终回答。长结果应做有来源的截断/摘要，保留原始结果引用便于核验。
    - 提高工具选择可靠性可精简重叠描述、提供反例/示例、检索候选工具、约束tool choice和训练轨迹；结构化输出能改善语法，不保证选对工具、参数真实或用户已授权。
    derivation_or_example: 问题“37×29是多少”适合calculator(expression)，工具实际返回1073后模型回答；若需搜索“某事件日期”，应先取得可验证实体，不能为满足schema编造person_id。
    answer_outline:
    - 工具schema与模型选择
    - 调用解析/授权/执行
    - call ID结果回传
    - 选择可靠性和语义限制
