    prompt: 两个服务引擎分别以PagedAttention和RadixAttention出名。说明它们的原始核心机制、可组合性，以及如何做公平的当前部署选型。
    one_liner: PagedAttention管理KV物理块与共享，RadixAttention按前缀树复用跨调用KV；前者偏分配浪费，后者偏重复计算，两种能力可在现代引擎并存。
    core_answer:
    - vLLM原始核心是PagedAttention：逻辑连续KV映射到非连续物理块，动态按需分配、引用计数和copy-on-write支持共享；配合continuous batching提升可容纳的有效请求。
    - SGLang原始设计包含结构化生成程序前端与运行时；RadixAttention以radix tree组织token前缀和对应KV，做最长公共前缀匹配与缓存回收，复用多轮/分支/重复prompt。它不改变attention数学公式。
    - 分页可以减少分配碎片，prefix caching可以减少重复prefill；没有共享前缀的工作负载中，radix命中收益可能很小。缓存还受模型版本、adapter、tokenizer、位置和多模态内容标识影响。
    - 截至实际部署版本，两引擎功能均会变化，不能说vLLM永远无前缀复用或SGLang不支持分页。固定模型、dtype、硬件、版本、输入输出长度、重复前缀率和SLO，分别比较cold/warm cache、吞吐、尾延迟、显存和运维需求。
    derivation_or_example: 100个请求共享2000-token系统前缀：即使KV分配已分页，每次重做这2000token仍浪费prefill；前缀复用可减少重复计算。若每个prompt完全独立，主要收益又可能来自分页和调度。
    answer_outline:
    - vLLM原始分页机制
    - SGLang结构化运行时与radix
    - 分配/计算两类收益
    - 版本化公平比较
