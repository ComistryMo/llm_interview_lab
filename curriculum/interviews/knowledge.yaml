      {tokens: tuple, score: float, finished: bool}。完成项占 beam 名额，EOS 后不得再调用 step；每轮按累计 log-prob 取最多 K 个，分数同分按
      token tuple 字典序；所有保留项结束或达到上限才停止。无长度惩罚，未遇 EOS 的路径 finished=False。禁止现成生成框架。O(TKV log(KV))，不含 step。'
