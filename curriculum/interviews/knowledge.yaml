    - TP频繁细粒度通信宜放高速互联域，PP跨stage传激活，DP可按带宽/梯度归约安排跨节点；同时权衡pipeline bubble、通信重叠、优化器分片和checkpoint。增加维度会改变batch与显存，不是简单全部设最大。
