  - id: EGT-QB-106
    kind: eight_stock
    title: DeepSeek-R1 原始路线：R1-Zero、冷启动、多阶段训练和蒸馏
    domain: reasoning_training
    tracks:
    - post_training
    - llm_algorithm
    skills:
    - skill.post_training_rl.policy_optimization
    - skill.post_training_rl.grpo
    - skill.post_training_rl.verification
    priority: P1
    difficulty:
      concept: 4
      implementation: 3
      debugging: 4
    seniority:
    - new_grad
    - mid
    - senior
    prompt: 依据2025年R1原始报告，解释R1-Zero与R1各从什么模型开始、如何使用GRPO，以及为什么后者又引入SFT和拒绝采样。
    one_liner: R1-Zero从已预训练的V3-Base直接做RL；R1用冷启动SFT、推理RL、拒绝采样再SFT和全场景RL改善可读性与通用性，并将推理样本蒸馏给稠密小模型。
    core_answer:
    - 此题固定 arXiv:2501.12948v1，避免混同后续R1型号。R1-Zero不是从随机权重训练：基座是DeepSeek-V3-Base，不以SFT作RL前置；使用可验证准确性和格式等奖励，观察到较长推导、自检等行为，同时存在可读性和语言混杂问题。
    - GRPO每个prompt采样一组回答，以组内奖励均值/标准差构造相对优势，优化带ratio clipping与KL约束的策略目标，不额外训练价值Critic；同组全同奖励时没有有效区分信号，故奖励设计与采样覆盖重要。
    - R1先用少量长推理冷启动数据SFT，再推理导向RL；随后对RL检查点拒绝采样形成推理数据，并混入非推理数据重新SFT基座，最后做涵盖推理、帮助性和安全等全场景RL。阶段作用分别是输出可读、增强求解、扩展数据与通用对齐。
    - 报告还以R1生成并筛选的样本微调Qwen/Llama稠密学生；这是序列级蒸馏，不必获得教师内部logits。贡献是公开可复现的训练路线和推理强化证据，不证明所有模型都无需SFT或所有任务都适合规则奖励。
    derivation_or_example: R1-Zero与R1的公平比较应控制基座、推理token预算和评测器；要验证冷启动作用，可看可读性/语言一致性与数学准确率，而不是仅看CoT长度。学生SFT学到教师样本不等于学生自己经历了同样RL。
    answer_outline:
    - 固定原始版本与V3-Base
    - GRPO组相对优势
    - R1的四阶段链
    - 推理样本蒸馏与贡献限制
    acceptance:
      L1: 区分Zero与R1且不说从零预训练。
      L2: 正确说明GRPO不需独立Critic及组优势。
      L3: 按顺序解释冷启动、RL、再SFT、全场景RL作用。
      L4: 能设计阶段消融并区分蒸馏与RL训练证据。
    follow_ups:
    - L1：R1-Zero没有先做SFT，是否代表没有任何预训练？
    - L2：一组回答全错为何难以形成学习信号？
    - L3：为什么拒绝采样后还混入非推理SFT数据？
    - L4：如何评估长推理收益而不把更多test-time算力当架构提升？
