    seniority:
    - new_grad
    - mid
    - senior
    prompt: 一个batch里同一图片出现两次，各带一条正确caption。标准对角线CLIP loss有什么矛盾？给出数据和损失两层修复，并讨论分布式负例。
    one_liner: 一图多文时非对角线也可能是正例，对角线唯一正例会错误排斥有效配对；需去重/分组采样或显式正例集合，不能仅把loss调小。
    core_answer:
    - 标准CLIP对每个图像i只把caption i当正例，其余j当负例；若图像重复且两条caption都描述它，目标要求相同图像同时偏爱不同唯一标签，形成冲突梯度并扭曲相似度。
    - 数据侧用图像hash/perceptual近重复候选和文本语义复核聚簇，采样时每簇限量或保留多caption元数据；同一图不同裁剪/不同局部描述未必都互为正例，关系应由实际视野和语义决定。
    - 损失侧定义P(i)为已确认正例，可用set loss L_i=−log[Σ_{j∈P(i)}exp S_ij/Σ_j exp S_ij]，或对每个正例的log-softmax取均值；二者对易/难正例的权重不同，应明确选择。另一选择是把已知同义非目标从负例分母mask掉。
    - 文到图方向也需对应多正例关系，all-gather跨GPU后要同步样本全局ID与正例mask，不能只处理本地重复。测试重复batch、无重复退化回原loss、缺正例、温度和检索分桶，避免把所有相似样本都屏蔽而失去区分度。
    derivation_or_example: I1=I2，T1“红色汽车”、T2“红车停在路边”均为有效描述。两行相似度在同一权重下相同，标准唯一标签彼此冲突；正例集合{1,2}则不要求把另一条正确caption排斥出去。
    answer_outline:
    - 对角线假设及冲突
    - 图像/语义簇采样
    - 多正例公式或mask
    - 跨卡ID和双向一致
    acceptance:
      L1: 指出非对角线也可是真正例。
      L2: 给出去重或正确正例集合。
      L3: 能写多正例目标并区分两类聚合。
      L4: 处理跨卡负例、裁剪关系和退化测试。
    follow_ups:
    - L1：相同图片但错误caption能否全算正例？
    - L2：集合logsumexp与平均正例log概率有何差异？
    - L3：重复仅在别的GPU出现时怎样构建mask？
    - L4：去重过强导致训练负例太容易如何评估？
    pitfalls:
    - 只把batch变大以为可解决假负例。
    - 把视觉相似但任务区分关键的样本全部当正例。
    signals:
    - 知道监督关系比对角线索引更根本。
    - 能够验证双向与分布式label对齐。
