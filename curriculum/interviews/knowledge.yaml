    derivation_or_example: "构造同一张图的存在/不存在、颜色交换和关系交换三类样本，计算 precision/recall/F1，比较‘流畅但无证据’与‘可靠拒答’的 Pareto。"
    answer_outline: ["建立 hallucination taxonomy", "设计反事实与证据标注", "校准 judge/拒答", "设置质量—安全—成本 gate"]
    acceptance:
