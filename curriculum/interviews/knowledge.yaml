  - id: EGT-QB-113
    kind: eight_stock
    title: KV 显存账本：GQA、MLA 与分页分别省了什么
    domain: inference_systems
    tracks:
    - systems
    - llm_algorithm
    skills:
    - skill.inference_systems.serving
    - skill.inference_systems.capacity
    - skill.inference_systems.kv_cache
    priority: P1
    difficulty:
      concept: 4
      implementation: 3
      debugging: 4
    seniority:
    - new_grad
    - mid
    - senior
    prompt: 给定层数、每条请求长度、KV头数和精度，算出KV占用；再解释PagedAttention、GQA与DeepSeek-V2 MLA作用在账本的哪些项。
    one_liner: 传统KV有效载荷为2·L·ΣT_i·H_kv·d_h·b；GQA减少KV头，MLA缓存潜变量和解耦RoPE键，分页主要减少分配浪费而非改变每token表示。
    core_answer:
    - 对K/V维度相同的标准attention，bytes=2LΣ_i T_i H_kv d_h b，2来自K与V，b是每元素字节数；不同层/键值维度时逐层相加，量化metadata、block table、allocator余量另算，GiB用2^30。
    - MHA的H_kv=H_q，MQA为1，GQA为分组数；在其他项相同时GQA相对MHA按H_kv/H_q缩减有效KV，Q头数仍可不变，质量变化需训练/适配验证。
    - DeepSeek-V2 MLA高效缓存低维联合潜变量c^KV及解耦旋转位置键k^R，每层每token约(d_c+d_R)b，无须再对潜变量机械乘2；依赖投影吸收等实现，若引擎展开缓存K/V则实际占用会不同。
    - PagedAttention按固定块映射逻辑token到物理KV，减少外部碎片和预留浪费并支持共享/COW；块尾仍有内部浪费，单一独立序列的有效元素数不因此减少。还可结合KV量化、前缀复用和token预算。
    derivation_or_example: L=32、H_kv=8、d_h=128、BF16 b=2，单请求T=8192：2×32×8192×8×128×2=1,073,741,824字节=1GiB。若H_q=32的MHA则4GiB；分页后有效载荷仍约1GiB，加块尾与元数据。
    answer_outline:
    - 传统KV公式与单位
    - MHA/MQA/GQA头数
    - MLA潜变量加位置键
    - 分页浪费与结构压缩区别
    acceptance:
      L1: 写对2、层数、token和dtype。
      L2: 手算GQA/MHA示例。
      L3: 理解MLA公式不等于传统KV乘压缩比。
      L4: 区分有效载荷、碎片、复制、元数据和实现策略。
    follow_ups:
    - L1：变长batch为何应使用ΣT_i？
