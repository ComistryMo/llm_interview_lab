    one_liner: SFT拟合给定上下文后的目标回答；是否监督各段应由任务目标和模板契约明确决定。
    core_answer:
    - 给定输入x、目标回答y，L=−Σ_t m_t log pθ(z_t|z_<t)/Σ_t m_t；causal mask限制信息可见性，loss mask仅决定哪些预测计入监督，二者不能互换。
    - response-only避免模型把预算用于模仿用户或系统消息，把训练集中到assistant条件输出；它是常见设计，不是所有SFT的必要规定。多轮可监督每个assistant span，也可只监督最后一轮，均需显式标注。
    - 流程为质量与去重→固定chat template→tokenize/截断→构造mask→按有效目标token归约→训练与held-out生成评测。EOS、工具消息和特殊token按契约处理；全mask样本不得零除，截断不能保留半个角色结构。
    derivation_or_example: 序列[BOS,user,a,assistant,b,EOS]中，若只监督回答，则预测b和EOS的logit位置才有有效label；监督用户位置与允许assistant看到用户是两个独立决定。
