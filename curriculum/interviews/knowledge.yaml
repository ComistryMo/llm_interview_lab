  - id: COD-AI-007
    kind: coding_prompt
    title: AI07 · temperature、top-k、top-p 的顺序与边界
    domain: llm_vlm
    tracks:
    - llm_algorithm
    - systems
    skills:
    - skill.llm_vlm.generation
    priority: P1
    difficulty:
      concept: 3
      implementation: 3
      debugging: 3
    seniority:
    - intern
    - new_grad
    - mid
    prompt: logits[B,V] 可含 -inf 禁用 token，每行至少一个有限项，无 NaN/+inf。返回 (token[B], probabilities[B,V])。依次 temperature→top-k→剩余分布
      top-p→重归一化采样；temperature>0，0≤k≤V，k=0 不限；0<p≤1。同分按 token ID 小者优先，最多保留 k 个有限项。top-p 保留达到阈值的最小前缀（含跨阈值项），p=1
      保留全部剩余项。generator 传给采样；不得使用 Transformers warper。例概率 [.5,.3,.2]，p=.6 → [.625,.375,0]。完整排序 O(BV log
      V)。
    one_liner: 独立实现 sample_filtered，用明确的小例子、定义边界和不变量解释正确性。
    core_answer:
    - 排序并屏蔽 k 以外的位置，重新 softmax；top-p 保留累计概率第一次达到阈值的最小前缀，包含跨过阈值的那一项。`p=1` 明确保留全部剩余有限项，避免累计和舍入导致意外截断。采样使用传入
      generator，以便复现实验。
    derivation_or_example:
    - 概率 `[0.5,0.3,0.2]`、p=0.6 应保留前两项并归一化成 `[0.625,0.375,0]`；k=1 退化为确定选择；只有一个合法 token 必须选中；全禁用必须报错。稳定排序定义了本题
