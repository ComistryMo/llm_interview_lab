    - mid
    - senior
    prompt: 一份评测报告声称换 tokenizer 后 PPL 从10降到7，因此模型推理更强。请推导 PPL，指出这项比较缺什么，并设计正确的固定窗口评测。
    one_liner: PPL 是每个有效token负对数似然的指数，只在tokenization、数据、条件上下文和计分口径匹配时可直接比较。
    core_answer:
    - 自回归概率 p(x)=∏t p(x_t|x_<t)，平均交叉熵 H=−Σt log p(x_t|context_t)/M，PPL=exp(H)=(∏t 1/p_t)^(1/M)。使用log2时为2^H；M必须是实际计分token数。
    - PPL 可解释为达到该平均不确定性时的等效分支数，越低说明该语料真token概率平均更高。它不是“下一词有PPL个正确选项”，也不直接衡量事实正确、指令跟随或代码功能。
    - 不同tokenizer改变随机变量与长度，不能直接横比token PPL；可在同一文本与规范化规则下用bits/byte作补充，但仍要固定模型条件化协议。
    - 有限窗口用滑动窗口提供重叠上下文，每个目标token只计一次；只当上下文的重叠token、padding和不可预测首位置要mask。不同stride或截断上下文会改变难度，应记录。
    derivation_or_example: 两次真token概率分别为1/2和1/8，平均NLL=(ln2+ln8)/2=ln4，所以PPL=4，不是(2+8)/2=5。若两个batch的有效token数为2和8，先加总NLL除10，不能平均两个batch
      PPL。
    answer_outline:
    - 概率分解到PPL推导
    - 几何平均与实例
    - tokenizer/数据可比性
    - 滑窗和有效token归约
    acceptance:
      L1: 能写 PPL=exp(平均NLL)。
      L2: 手算示例并解释为何不是算术平均。
      L3: 识别tokenizer、mask、stride造成不可比。
      L4: 提出固定文本、协议、bits/byte及任务指标联合比较。
    follow_ups:
    - L1：自然对数与以2为底的交叉熵如何转换？
    - L2：为什么平均各句 PPL 与语料 PPL 不同？
    - L3：滑动窗口的重叠token何时只提供上下文？
    - L4：PPL下降而数学正确率下降有哪些可检验原因？
    pitfalls:
    - 对padding计loss或重复计算重叠目标。
    - 跨tokenizer比较PPL后宣称普遍能力提升。
    signals:
    - 明确分母是计分token总数。
    - 把语言建模指标与下游验收目标分开。
