  - id: EGT-VLM-001
    kind: eight_stock
    title: "CLIP/InfoNCE：双向对比学习的温度与负样本"
    domain: multimodal_alignment
    tracks: [vlm_algorithm, llm_algorithm, post_training]
    skills: [skill.llm_vlm.vlm_architecture, skill.machine_learning_math.probability, skill.deep_learning.losses]
    priority: P0
    difficulty: {concept: 4, implementation: 4, debugging: 4}
    seniority: [intern, new_grad, mid, senior]
    prompt: "给 N 对图文 embedding，推导 CLIP 风格 InfoNCE，说明归一化、温度、双向 CE 与 false negatives。"
    one_liner: "归一化 image/text 向量后用相似度矩阵除以可学习温度，分别沿行/列做交叉熵，正配对是对角线。"
    core_answer:
      - "I,T∈R^{N×D} 先 L2 normalize，S=I Tᵀ/τ；labels=arange(N)，image→text 与 text→image 两个方向取平均。"
      - "τ 控制分布尖锐度；过小会放大梯度/数值风险，过大区分度弱，需约束正值。"
      - "batch 内其他样本是 negatives，重复 caption/相似图会造成 false negative，应做去重、hard-negative 和分桶分析。"
      - "不要只看 contrastive loss；报告 retrieval Recall@K、跨域切片、温度和 embedding norm。"
    derivation_or_example: "N=3 时写出 3×3 相似度矩阵、两向 loss 和一个重复配对的影响。"
    answer_outline: ["normalize 与相似度矩阵", "温度/双向 CE", "负样本与 false negative", "检索指标/数值测试"]
    acceptance: {L1: "说清正负配对", L2: "公式/轴和温度正确", L3: "能诊断重复、混合精度和 retrieval 回归"}
    follow_ups: ["为什么要双向而非单向 CE？", "τ 是否应该每 batch 学习？", "多 GPU negatives 怎样保持 label 对齐？"]
    pitfalls: ["未 normalize embedding", "softmax 轴错", "τ≤0", "把 batch 内相似样本都当独立负例"]
