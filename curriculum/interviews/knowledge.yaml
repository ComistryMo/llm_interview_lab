cards:
  - id: EGT-TRN-001
    kind: eight_stock
    title: "Scaled dot-product attention：shape、缩放与 mask"
    domain: transformer
    tracks: [llm_algorithm, vlm_algorithm, post_training, systems]
    skills: [skill.llm_vlm.attention, skill.deep_learning.tensor_ops, skill.deep_learning.losses]
    priority: P0
    difficulty: {concept: 3, implementation: 4, debugging: 4}
    seniority: &all_seniority [intern, new_grad, mid, senior]
    prompt: "请从 Q/K/V 的 shape 推导 attention，并说明为什么除以 sqrt(d_k)、如何处理 causal/padding mask，以及全屏蔽行怎么办。"
    one_liner: "先算 QKᵀ/sqrt(d_k)，再在 key 维做稳定 softmax；mask 的语义必须明确，输出形状回到 query 长度。"
    core_answer:
      - "Q[B,H,Lq,D]、K/V[B,H,Lk,D]，score[B,H,Lq,Lk]，output[B,H,Lq,D]；Lq 与 Lk 不必相等。"
      - "缩放让 logits 方差不随 head dimension 增长，避免 softmax 饱和；实现用减最大值或稳定的 SDPA。"
      - "causal mask 屏蔽未来 key，padding mask 屏蔽无效 key；必须写清 bool mask 是 allow 还是 block。"
      - "全屏蔽 query 行不能产生 NaN：约定返回零/显式拒绝，并在数据契约和测试中固定。"
    derivation_or_example: "给 B=1、H=1、Lq=2、Lk=3、D=2 的矩阵，标注每次 matmul、transpose 和 broadcast 后的 shape。"
    answer_outline: ["列出 Q/K/V 与 score/output shape", "解释 sqrt(d_k) 与稳定 softmax", "区分 causal/padding/additive mask", "给出全屏蔽与梯度测试"]
    acceptance:
      L1: "能说出目标、四个核心 shape 与缩放原因。"
      L2: "能写稳定公式并区分 causal、padding、additive mask。"
      L3: "能处理矩形序列、全屏蔽行、极端 logits、dtype/device 和梯度。"
    follow_ups: ["PyTorch SDPA 的 bool mask True 表示什么？", "为什么把 mask 加在 softmax 前？", "FlashAttention 如何保持同一数学结果？"]
    pitfalls: ["在错误的维度 softmax", "漏掉 sqrt(d_k)", "把 query padding 与 key padding 混为一谈", "全 -inf 行直接 softmax 造成 NaN"]
    signals: ["shape 与 mask 极性可在白板上自洽", "能给出数值稳定和退化输入的测试策略", "明确 framework 行为而不把经验当定律"]
    source_claims:
      - {claim_id: EGT-TRN-001-C1, source_id: attention-is-all-you-need, claim: "Transformer 使用缩放点积注意力和多头分解。", confidence: high, locator: "paper §3.2"}
      - {claim_id: EGT-TRN-001-C2, source_id: pytorch-sdpa, claim: "PyTorch 提供带 causal 与 mask 语义的缩放点积注意力实现。", confidence: verified, locator: "API reference"}
    related_problems: [ATT-002, ATT-004]
    reviewed_at: *reviewed_at

  - id: EGT-TRN-002
    kind: eight_stock
    title: "MHA、MQA、GQA：质量与 KV 成本的取舍"
    domain: transformer
    tracks: [llm_algorithm, vlm_algorithm, systems, post_training]
    skills: [skill.llm_vlm.attention, skill.inference_systems.kv_cache, skill.machine_learning_math.linear_algebra]
    priority: P0
    difficulty: {concept: 4, implementation: 4, debugging: 4}
    seniority: [intern, new_grad, mid, senior]
    prompt: "比较 MHA、MQA、GQA 的 Q/K/V 头数、表达能力、KV-cache 显存和迁移检查点时的风险。"
    one_liner: "Q 头可以多于 KV 头；共享 KV 减少缓存和带宽，但可能牺牲表达能力，必须在质量与吞吐上实测。"
    core_answer:
      - "MHA 的 q_heads=kv_heads；MQA 只有一组 KV；GQA 将多个 query heads 分组共享一个 KV head。"
      - "KV cache 近似按 layers×batch×sequence×kv_heads×head_dim×2×dtype_bytes 增长。"
      - "从 MHA checkpoint 转 GQA/MQA 需要定义 KV head 合并/初始化，不能只改配置字段。"
      - "评估 perplexity/任务质量、长上下文退化、TTFT/TPOT、带宽和显存，而不是只看理论压缩。"
    derivation_or_example: "给 32 个 query heads、8 个 KV heads、head_dim=128、8k tokens、BF16，比较 MHA 与 GQA 的单层缓存大小。"
    answer_outline: ["画三种 head layout", "推导 KV cache bytes", "说明 checkpoint 转换", "列质量/延迟/带宽指标"]
    acceptance:
      L1: "能准确区分三种头布局。"
      L2: "能写出 KV-cache 估算并解释广播维。"
      L3: "能说明 checkpoint 转换、质量回归和 serving 指标。"
    follow_ups: ["GQA 的 repeat_kv 如何避免错误 broadcast？", "MLA 与 GQA 的缓存对象有什么不同？", "为什么 decode 更受 KV 带宽影响？"]
    pitfalls: ["把 MQA 说成没有 K/V", "用 q_heads 估算 GQA cache", "合并 KV head 时打乱 head 顺序", "只报参数量不报带宽"]
    signals: ["能在 head 维度画出广播关系", "把算法选择落到可测 SLO", "指出迁移与回滚策略"]
    source_claims:
      - {claim_id: EGT-TRN-002-C1, source_id: gqa-paper, claim: "GQA 位于 MHA 与 MQA 之间，通过较少 KV 头降低推理成本。", confidence: high, locator: "paper abstract/§2"}
      - {claim_id: EGT-TRN-002-C2, source_id: hf-cache, claim: "缓存状态的序列维度随生成上下文增长并需要 cache position 对齐。", confidence: high, locator: "cache explanation"}
    related_problems: [ATT-005, ATT-006, ATT-009]
    reviewed_at: *reviewed_at

  - id: EGT-TRN-003
    kind: eight_stock
    title: "Decoder-only 训练：shift-right、causal mask 与 loss mask"
    domain: language_model_training
    tracks: [llm_algorithm, post_training, vlm_algorithm]
    skills: [skill.post_training_rl.sft, skill.deep_learning.losses, skill.llm_vlm.transformer]
    priority: P0
    difficulty: {concept: 3, implementation: 4, debugging: 5}
    seniority: [intern, new_grad, mid, senior]
    prompt: "给 logits[B,T,V] 和多轮对话 labels，说明 next-token shift、causal 可见性、padding/assistant-only label mask 的边界。"
    one_liner: "用 logits[:, :-1] 预测 labels[:, 1:]，只对有效 assistant target 计 CE；attention mask 与 label mask 是两份不同契约。"
    core_answer:
      - "shift 后 logits 与 labels 的时间长度都是 T-1，目标 token 的 loss 不能看见自身或未来。"
      - "padding、system/user、图像占位符通常设为 ignore_index（如 -100），但 attention 仍决定条件可见性。"
      - "分母用有效 target token 数，并定义全 mask batch 的返回值/跳过策略。"
      - "packing 必须用 block-diagonal 或边界 position/mask，防止样本之间泄漏。"
    derivation_or_example: "用 [BOS,user,assistant,a,b,EOS] 标出每个 logits 位置实际监督的 token，展示左/右 padding 后的 mask。"
    answer_outline: ["画 shift 对齐表", "拆 attention 与 label mask", "定义有效分母", "覆盖 packing/空样本"]
    acceptance:
      L1: "能说明 shift 与 assistant-only 的目的。"
      L2: "能按索引写出 masked CE 和有效分母。"
      L3: "能诊断双 shift、空答案、packing 泄漏和变长 batch。"
    follow_ups: ["为什么把 user token 也计 loss 会改变行为？", "label mask 和 attention mask 能否共用？", "label smoothing 与 ignore_index 怎样交互？"]
    pitfalls: ["BOS/EOS 偏移一位", "prompt token 误计入 loss", "padding 进入平均分母", "把全 mask 当作正常零损失却产生错误梯度"]
    signals: ["能画出 token 对齐表", "能明确梯度只流向有效 target", "能给出可执行的 mask 单测"]
    source_claims:
      - {claim_id: EGT-TRN-003-C1, source_id: pytorch-cross-entropy, claim: "CrossEntropyLoss 支持 ignore_index、不同输入形状和可解释的 reduction。", confidence: high, locator: "API reference"}
      - {claim_id: EGT-TRN-003-C2, source_id: hf-chat-templates, claim: "聊天模板决定角色控制 token 和 assistant generation 边界，不能脱离 tokenizer 处理。", confidence: high, locator: "chat templating docs"}
    related_problems: [PT-001, PT-002, LOSS-014]
    reviewed_at: *reviewed_at

  - id: EGT-TRN-004
    kind: eight_stock
    title: "RoPE、位置偏移与训练/推理 cache 一致性"
    domain: transformer
    tracks: [llm_algorithm, vlm_algorithm, systems]
    skills: [skill.llm_vlm.transformer, skill.llm_vlm.attention, skill.inference_systems.kv_cache]
    priority: P0
    difficulty: {concept: 4, implementation: 4, debugging: 5}
    seniority: [intern, new_grad, mid, senior]
    prompt: "解释 RoPE 如何作用于 q/k、为什么点积体现相对位置，以及增量 decode 使用 KV cache 时 position_ids/cache_position 如何保持一致。"
    one_liner: "对 q、k 的偶奇维成对旋转并使用同一位置相位；缓存追加时位置必须与训练时的坐标约定一致。"
    core_answer:
      - "每两个通道构成一个二维旋转，位置 m 的相位与频率共同决定；v 通常不旋转。"
      - "相同旋转结构使 q_m 与 k_n 的内积可表达相对位移，但具体频率/缩放是模型配置。"
      - "prefill 与 decode 的位置不能都从 0 开始；cache_position、padding offset、packed sequence 要显式传递。"
      - "奇数 head_dim、错位 q/k、重复应用 RoPE 或 cache 与 mask 不同坐标都会造成隐性退化。"
    derivation_or_example: "写出二维向量在位置 0、1 的旋转矩阵，并验证位置 0 是恒等；再说明单 token decode 的 q 位置。"
    answer_outline: ["写二维旋转公式", "解释相对位置性质", "对齐 prefill/decode 坐标", "列 cache 与维度边界"]
    acceptance:
      L1: "能解释旋转发生在 q/k 而非泛泛地说‘加位置编码’。"
      L2: "能写偶奇维公式和位置索引。"
      L3: "能定位 padding、cache offset、长上下文缩放的实现风险。"
    follow_ups: ["ALiBi 与 RoPE 的外推差异？", "为什么 V 不需要同样旋转？", "多模态 M-RoPE 如何加入时间/高度/宽度轴？"]
    pitfalls: ["把 RoPE 施加给 V", "sin/cos 维度交错顺序错", "prefill/decode position 重置", "奇数维静默截断"]
    signals: ["公式、代码和 cache 坐标三者一致", "能用等价性测试比较 full 与 incremental forward", "识别模型特有缩放不是通用定律"]
    source_claims:
      - {claim_id: EGT-TRN-004-C1, source_id: rope-paper, claim: "RoPE 通过旋转 q/k 注入位置信息并利用相对位置结构。", confidence: high, locator: "paper §3"}
      - {claim_id: EGT-TRN-004-C2, source_id: hf-cache, claim: "增量生成需要显式维护 cache position 以避免位置错位。", confidence: high, locator: "cache position section"}
    related_problems: [ATT-007, ATT-009]
    reviewed_at: *reviewed_at

  - id: EGT-TRN-005
    kind: eight_stock
    title: "Pre-LN、Post-LN 与 RMSNorm：稳定性如何回答"
    domain: transformer_training
    tracks: [llm_algorithm, post_training, systems]
    skills: [skill.llm_vlm.transformer, skill.machine_learning_math.optimization, skill.deep_learning.autograd]
    priority: P1
    difficulty: {concept: 4, implementation: 3, debugging: 4}
    seniority: [new_grad, mid, senior]
    prompt: "比较 Post-LN、Pre-LN、RMSNorm 在深层 Transformer 的梯度路径、初始化和推理开销，并给出实验诊断。"
    one_liner: "归一化位置改变残差与梯度路径；RMSNorm 去掉均值中心化，实际选择要用稳定性、质量和吞吐实验验证。"
    core_answer:
      - "Pre-LN 通常让残差主路径更直接、深层训练更易稳定；Post-LN 的梯度/初始化敏感性不同。"
      - "RMSNorm 只按均方根缩放并保留可学习尺度，不等同于 LayerNorm。"
      - "不能只背‘Pre-LN 一定更好’：比较 loss 曲线、梯度范数、最终质量和推理 kernel。"
      - "换 norm 需要检查 checkpoint、epsilon、精度和 residual dtype。"
    derivation_or_example: "画一个 block 的残差路径，标出 norm、attention、MLP 的前向和反向经过点。"
    answer_outline: ["定义三种 norm/block 顺序", "追踪残差梯度", "比较 epsilon/精度", "设计稳定性与质量 ablation"]
    acceptance:
      L1: "能说清三者定义差异。"
      L2: "能解释梯度路径与 epsilon/精度。"
      L3: "能提出受控 ablation 而不把经验口号当结论。"
    follow_ups: ["为什么 epsilon 过大或过小会影响训练？", "norm 是否应计入量化敏感层？", "如何用 gradient norm 排查深层不稳定？"]
    pitfalls: ["把 RMSNorm 当无参数归一化", "忽略 residual scaling", "只比较早期 loss", "混淆训练稳定和推理速度"]
    signals: ["有结构图和梯度证据", "知道配置迁移的兼容性风险", "能设计可复现实验"]
    source_claims:
      - {claim_id: EGT-TRN-005-C1, source_id: internal-clean-room, claim: "本卡要求用公开定义自行推导并通过实验比较，不把单一架构偏好当事实。", confidence: verified, locator: "project authoring policy"}
    related_problems: [NNL-008, TNS-013]
    reviewed_at: *reviewed_at

  - id: EGT-TRN-006
    kind: eight_stock
    title: "BPE、special tokens 与 chat template 的数据契约"
    domain: tokenization
    tracks: [llm_algorithm, vlm_algorithm, post_training, agent]
    skills: [skill.llm_vlm.tokenization, skill.llm_vlm.multimodal_data, skill.data_mlops.data_quality]
    priority: P0
    difficulty: {concept: 3, implementation: 4, debugging: 5}
    seniority: [intern, new_grad, mid, senior]
    prompt: "从语料统计到线上 encode/decode，说明 BPE 合并、未知字节、special token 和 chat template 为什么必须作为一个版本化契约。"
    one_liner: "BPE 用确定性的高频 pair 合并获得子词；special token 与模板控制边界，tokenizer、模型和数据必须锁定同一版本。"
    core_answer:
      - "训练阶段重复统计相邻 pair 并按确定性 tie-break 合并，直到词表预算；byte-level 方案可保证任意 UTF-8 输入可表示。"
      - "special token 必须优先识别且不被普通合并拆分；未知 token/字节要有明确 fallback。"
      - "chat template 决定 role/control token、generation prompt、assistant mask；改模板会改变训练分布。"
      - "记录 tokenizer files、special-token IDs、template revision，并做 decode round-trip 与边界回归。"
    derivation_or_example: "给一个小语料和 tie 频率，手算两轮 merge；再展示带 image placeholder 的模板序列。"
    answer_outline: ["描述 pair merge 与 tie-break", "处理 special/unknown 字节", "把 template 当数据契约", "给 round-trip/版本测试"]
    acceptance:
      L1: "能解释 BPE 与模板边界。"
      L2: "能写确定性合并和可逆性测试。"
      L3: "能诊断 tokenizer/template 版本漂移、Unicode 和多模态占位符问题。"
    follow_ups: ["为什么词表越大不一定更好？", "packing 时 special token 如何防跨样本泄漏？", "多模态 processor 怎样与 tokenizer 协同？"]
    pitfalls: ["频率 tie 不确定导致不可复现", "special token 被拆分", "只按字符而非字节处理 Unicode", "训练和推理 template 不一致"]
    signals: ["能给出可逆性和版本审计清单", "把数据格式视为模型接口", "区分发现题型的二手资料与事实来源"]
    source_claims:
      - {claim_id: EGT-TRN-006-C1, source_id: bpe-paper, claim: "BPE 通过迭代合并高频相邻符号学习子词单元。", confidence: high, locator: "paper §3"}
      - {claim_id: EGT-TRN-006-C2, source_id: hf-chat-templates, claim: "聊天模板和 special tokens 是 tokenizer/模型输入契约的一部分。", confidence: high, locator: "chat template docs"}
    related_problems: [TOK-001, TOK-002, TOK-003]
    reviewed_at: *reviewed_at

  - id: EGT-TRN-007
    kind: eight_stock
    title: "预训练数据：质量、去重、污染与可追溯性"
    domain: data_engineering
    tracks: [llm_algorithm, vlm_algorithm, post_training, systems]
    skills: [skill.data_mlops.data_quality, skill.data_mlops.reproducibility, skill.evaluation_safety.leakage]
    priority: P0
    difficulty: {concept: 4, implementation: 3, debugging: 4}
    seniority: [intern, new_grad, mid, senior]
    prompt: "loss 下降但下游/评测不升时，如何从数据质量、重复、污染、配比和切片实验定位？"
    one_liner: "把数据当作可审计产品：来源/license、过滤、去重、切分和版本都要可追溯，并用独立切片验证收益。"
    core_answer:
      - "分离质量过滤、近重复去重、污染检测和配比采样；每步保留计数、哈希、来源和拒绝原因。"
      - "train/test overlap 会夸大分数；污染审计需在 token/文档/语义层面定义规则和局限。"
      - "loss 是代理信号，应按语言、长度、领域、难度、模态和来源做 slice 与多 seed。"
      - "数据改动必须和 tokenizer、训练步数、评测 prompt 一起版本化，才能归因。"
    derivation_or_example: "设计一个从原始网页到训练 shard 的 provenance 表，并给出 contamination 发现后的回滚实验。"
    answer_outline: ["拆质量/去重/污染步骤", "定义 provenance 与版本", "按 slice 验证 loss/质量", "保留拒绝与回滚证据"]
    acceptance:
      L1: "能列出质量/重复/污染三类问题。"
      L2: "能描述哈希、切分和版本字段。"
      L3: "能提出独立 holdout、slice 和 rollback 方案。"
    follow_ups: ["近重复阈值如何校准？", "多语言/长尾配比如何避免头部吞噬？", "合成数据怎样防 teacher 错误和模板泄漏？"]
    pitfalls: ["把去重当简单 set", "只报总 token 数", "评测集被用于筛选", "没有拒绝样本和来源审计"]
    signals: ["数据流程可重放", "指标与数据切片相互印证", "对污染结论给出置信边界"]
