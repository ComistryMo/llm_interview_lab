      - {claim_id: EGT-PT-007-C2, source_id: dpo-2305-18290, claim: "DPO 直接使用 chosen/rejected 与 reference-relative log-ratio 优化偏好，数据对齐和长度处理会改变目标。", confidence: high, locator: "paper §3"}
