  - id: EGT-QB-001
    kind: eight_stock
    title: Adam 与 AdamW：衰减项经过了谁的预条件器
    domain: optimization
    tracks:
    - llm_algorithm
    - post_training
    - ai_foundation
    skills:
    - skill.deep_learning.optimizers
    - skill.machine_learning_math.optimization
    priority: P0
    difficulty:
      concept: 3
      implementation: 3
      debugging: 3
    seniority:
    - intern
    - new_grad
    - mid
    - senior
    prompt: 在相同任务梯度下，为何把 L2 项加进 Adam 的 loss 与使用 AdamW 会走出不同轨迹？写出更新式，并解释大模型训练采用解耦衰减的理由与边界。
    one_liner: AdamW 把参数收缩与梯度的自适应缩放分开，衰减项不进入一二阶矩。
    core_answer:
    - Adam 用 m=β1 m+(1−β1)g、v=β2 v+(1−β2)g²，并以偏差校正后的 m̂/(√v̂+ε) 更新；耦合 L2 则先把 g 换为 g+λθ，使正则项也影响 m、v。
    - AdamW 的 θ←(1−ηλ)θ−ηm̂/(√v̂+ε)，矩只由任务梯度更新。各维衰减不再被自适应分母扭曲；学习率与衰减仍须联合调参，不能说数学上完全无关。
    - 大模型常采用此可解释的正则化及成熟实现，但是否更优取决于数据、调度和评测。bias、归一化尺度是否衰减要写成参数组契约。
    derivation_or_example: 若两维 θ 相同但 v̂ 分别为1和100，耦合L2的即时衰减贡献会被不同分母缩放；AdamW显式收缩两维相同的比例。λ=0时两者应退化为同一Adam更新。
    answer_outline:
    - 给出矩估计与偏差校正
    - 对比耦合和解耦更新
    - 说明参数分组与非普适优势
    follow_ups:
    - L1：weight_decay=0还存在算法差别吗？
    - L2：为何SGD的L2与衰减可等价，Adam通常不行？
    - L3：恢复训练只加载θ会怎样改变下一步？
    - L4：如何在相同token预算下隔离衰减策略的收益？
    pitfalls:
    - 把AdamW描述为不使用动量的Adam
    - 把偏差校正ε位置与衰减项混在一起
    signals:
    - 能沿着g→m/v→参数的路径解释差异，并以可复现对照支持工程选择
    acceptance:
      L1: 正确区分L2与显式参数收缩
      L2: 两种更新式及矩估计正确
      L3: 覆盖恢复状态与参数组
      L4: 控制调度和预算比较泛化及参数范数
    source_claims:
    - source_id: qb-adamw
      claim: 自适应梯度法下L2与权重衰减不等价，解耦项不进入任务梯度更新。
      confidence: high
    related_problems:
    - OPT-001
    - OPT-005
    reviewed_at: '2026-09-08'
    provenance:
    - 用户题目集编号：T001
  - id: EGT-QB-002
    kind: eight_stock
    title: 混合精度：算子dtype、主权重与损失缩放
    domain: numerical_training
    tracks:
    - llm_algorithm
    - systems
    - post_training
    skills:
    - skill.deep_learning.autograd
    - skill.deep_learning.optimizers
    - skill.training_infra.observability
    priority: P0
    difficulty:
      concept: 3
      implementation: 3
      debugging: 4
    seniority:
    - intern
    - new_grad
    - mid
    - senior
    prompt: 一个FP16训练任务出现零梯度，另一个BF16任务无需GradScaler。解释两者为何都属于混合精度，以及前向、归约、权重、优化器状态各应怎样选择精度。
    one_liner: 混合精度按数值与硬件需求分配dtype；FP16前向加FP32主权重只是常见方案。
    core_answer:
    - 低精度矩阵乘法减少带宽和存储并利用硬件；敏感归约、累加或优化器状态常保留FP32。autocast按算子选dtype，不要求模型参数全部转FP16。
    - FP32主权重使很小的更新不至于在低精度加法中被舍入掉；实现可能保留FP32原参数，也可能另存主副本，不能重复算账。
    - 对FP16，先对loss乘s再反传，更新前除s以减轻小梯度下溢；检测Inf/NaN后跳过step并调整s。BF16指数范围接近FP32，通常不需缩放，但尾数精度更低且仍可能数值异常。
    derivation_or_example: ∂(sL)/∂θ=s∂L/∂θ；先unscale，再做范数裁剪与optimizer step。若在scaled梯度上裁剪，真实阈值变为max_norm/s。
    answer_outline:
    - 按算子与状态列dtype
    - 解释主权重避免小更新丢失
    - 推导缩放及正确顺序
    follow_ups:
    - L1：BF16与FP16的指数和尾数取舍是什么？
    - L2：loss scaling为何不能修复前向已经溢出的激活？
