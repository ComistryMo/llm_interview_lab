  - id: EGT-QB-155
    kind: eight_stock
    title: 原始 Qwen-VL 三阶段与 LLaVA、DeepSeek-VL 的版本对照
    domain: multimodal_architecture
    tracks:
    - vlm_algorithm
    - post_training
    skills:
