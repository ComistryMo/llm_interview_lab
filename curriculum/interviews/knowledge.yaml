    - L3：合并adapter再量化后如何测误差？
    - L4：何时更低峰值伴随严重吞吐下降，怎样定位换页？
    pitfalls:
    - 把QLoRA写成所有权重都可训练的INT4训练
    - 混淆paged optimizer和PagedAttention
    signals:
    - 能追踪存储计算梯度三种精度，核对量化误差与实际峰值
    acceptance:
