  - id: EGT-QB-095
    kind: eight_stock
    title: pass@k：至少一次成功与组合数无偏估计
    domain: evaluation
    tracks:
    - llm_algorithm
    - post_training
    - agent
    skills:
    - skill.evaluation_safety.benchmarks
    - skill.data_mlops.experiments
    priority: P1
    difficulty:
      concept: 4
      implementation: 3
      debugging: 4
    seniority:
    - new_grad
    - mid
    - senior
    prompt: 一道代码题独立采样n个程序，c个通过测试。如何估计从同一采样分布生成k次至少成功一次的概率？为什么不能直接用1−(1−c/n)^k？
    one_liner: 当n≥k时，pass@k估计为1−C(n−c,k)/C(n,k)；它对固定采样分布下的成功概率1−(1−p)^k无偏，而插件估计通常有偏。
    core_answer:
    - pass@k衡量k次尝试中至少一次通过，不是平均通过比例，也不是k次都成功。对于每题采样n次得到c成功，均匀抽取k个候选全部失败的比例是C(n−c,k)/C(n,k)，其补集即估计值。
    - 在独立同分布伯努利成功、固定温度/提示/测试协议下，对随机样本取期望得到1−(1−p)^k，因此无偏；直接把c/n代入非线性函数一般不能与期望交换。n<k不能套该估计。
    - 若n−c<k则估计为1；实际实现可用失败比例的连乘/稳定计算避免组合数溢出。逐题估计后按题平均，不能先合并不同难度题的c和n。
    - 报告n、k、采样器、测试与超时条件、算力预算；best-of-k需要实际候选选择器，不能将存在一次成功的oracle指标当作无需验证的用户一次成功率。
    derivation_or_example: n=5、c=2、k=2：1−C(3,2)/C(5,2)=0.7；插件估计1−(3/5)²=0.64。k=1时公式退化为c/n。
    answer_outline:
    - 至少一次成功定义
    - 组合数推导与无偏前提
    - 数值边界和逐题聚合
    - 候选预算与实际选择器
    acceptance:
      L1: 正确解释pass@k事件。
      L2: 能手算5选2示例。
      L3: 说明无偏依赖i.i.d.及n≥k。
      L4: 区分oracle存在性、实际选择和上线单次质量。
    follow_ups:
    - L1：c=0或c=n时公式怎样退化？
    - L2：为什么先合并所有题的通过数会改变目标？
    - L3：beam search候选高度相关时可否声称相同无偏性？
    - L4：怎样比较pass@k上涨但每成功任务成本翻倍的方案？
    pitfalls:
    - 把pass@k与pass^k（连续k次都成功）混淆。
    - 对n<k或强相关候选照搬无偏保证。
    signals:
    - 先定义随机事件再写公式。
    - 知道测试和选择器都影响实际收益。
