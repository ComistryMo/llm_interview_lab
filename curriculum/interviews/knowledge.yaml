  - id: COD-AI-008
    kind: coding_prompt
    title: AI08 · DPO loss：先对齐回答 token，再比较相对偏好
    domain: deep_learning
    tracks:
    - ai_foundation
    - llm_algorithm
    - post_training
    skills:
    - skill.deep_learning.losses
    - skill.deep_learning.autograd
    - skill.post_training_rl.preference_data
    priority: P1
    difficulty:
      concept: 3
      implementation: 3
      debugging: 3
    seniority:
    - intern
    - new_grad
    - mid
    prompt: logits[B,T,V] 第 t 位置预测 tokens[:,t+1]；tokens/int64 与 completion_mask/bool 都为 [B,T]。mask 标记目标
      token 属于回答（包含真实 EOS，不包含 prompt/padding）；T≥2，每条回答至少一个有效 shifted token。返回序列 log-prob[B]，按回答 token 求和，不作长度均值；忽略位置允许
      -100，先屏蔽再 gather。另实现 paired_dpo(policy[B,2], reference[B,2], beta=.1)→mean softplus(-beta*((πc-πr)-(refc-refr)))，列为
      chosen,rejected，reference detach，beta>0。这是 PT-002/006 的对齐整合变式，不修改旧接口。
    one_liner: 独立实现 completion_logp，用明确的小例子、定义边界和不变量解释正确性。
    core_answer:
    - 对齐 `logits[:,:-1]` 与 `tokens[:,1:]`，mask 同样右移；只在回答 token 上求和。令 `margin=(logπ_c-logπ_r)-(logref_c-logref_r)`，loss=`softplus(-β*margin)`。参考
      log-prob 停止梯度。标准序列 DPO 不擅自把求和换成长度平均；那会改变优化对象。
    derivation_or_example:
    - 策略等于参考时 loss=`log(2)`；增大 chosen 相对优势应降低 loss；同时给 chosen/rejected 的策略 log-prob 加同一个常数不改变 loss。completion
