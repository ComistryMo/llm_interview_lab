    prompt: 写出Pre-LN和Post-LN残差子层的公式，沿反向路径解释训练稳定性差别，并说明为什么不能由此断言Pre-LN一定更强或完全不需warmup。
    one_liner: Pre-LN把归一化放入残差分支，主干保留直接恒等路径，通常更易优化深层模型。
    core_answer:
    - Pre-LN为y=x+F(LN(x))，Post-LN为y=LN(x+F(x))。前者Jacobian含I+JF·JLN，后者为JLN·(I+JF)，归一化处在整个残差输出路径上。
