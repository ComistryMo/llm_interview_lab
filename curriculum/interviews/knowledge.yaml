  - id: EGT-QB-145
    kind: eight_stock
    title: LangChain 与 LangGraph：高层构造、状态图与检查点
    domain: agent_memory
    tracks:
    - agent
    - systems
    skills:
    - skill.agent_application.state_memory
    - skill.agent_application.planning
    - skill.agent_application.reliability
    priority: P1
    difficulty:
      concept: 4
      implementation: 3
      debugging: 4
    seniority:
    - new_grad
    - mid
    - senior
    prompt: 一个工具Agent需要跨重启继续执行并支持人工暂停。LangChain和LangGraph分别能提供什么？解释检查点保存了什么以及为什么不能自动撤销外部操作。
    one_liner: LangChain提供高层模型/工具和Agent构造，LangGraph提供显式状态图与运行控制；checkpointer保存线程执行状态，store保存跨线程记忆，外部副作用需独立幂等。
    core_answer:
    - 按2026-09-08所见官方文档，LangChain提供高层agent接口、模型/工具集成及middleware；LangGraph适合自定义状态、节点、边、循环和确定性/agent混合控制。两者是可组合层次，不是简单“有状态/无状态”的对立产品。
    - 图的state定义需要保存的业务字段和节点输出；检查点按thread记录可恢复状态、进度/下一任务及相关元信息，支持中断后继续、历史查看和故障恢复。实际snapshot字段与superstep语义须按库版本核对。
    - checkpointer是thread级短期状态；store通常用于跨thread长期信息。内存saver只在进程活着时存在，生产重启恢复需要持久后端、thread隔离、序列化/版本迁移和保留策略。
    - 恢复会重新执行未确认完成的任务；图状态回到过去不代表数据库写入、付款或文件修改自动回滚。应将非幂等动作单独记录操作ID/提交结果，执行前查状态或用事务/补偿，防time travel重复副作用。
    derivation_or_example: 节点A搜索成功、节点B写工单后进程崩溃，若B的checkpoint未提交，恢复可能再次运行B；仅使用相同thread_id不能防重复工单，还需业务幂等键和已提交结果查询。
    answer_outline:
    - LangChain/LangGraph层次
    - 图状态和检查点
    - checkpointer/store与后端
    - 恢复时外部副作用
    acceptance:
      L1: 能说明高层构造与底层编排。
      L2: 解释thread状态和长期store差别。
      L3: 知道内存saver不跨重启持久。
      L4: 处理恢复重放、幂等和状态schema版本。
    follow_ups:
    - L1：一个thread_id应代表什么会话边界？
    - L2：保存聊天messages是否足够恢复多步任务？
    - L3：为何time travel不会自动撤销工单？
    - L4：升级state schema后旧checkpoint怎样迁移或拒绝恢复？
    pitfalls:
    - 认为用了LangGraph就自动满足exactly-once外部执行。
    - 使用内存checkpointer却承诺重启恢复。
    signals:
    - 能区分图内状态提交与外部事务提交。
    - 版本、thread隔离和持久化后端明确。
    source_claims:
    - claim_id: EGT-QB-145-C1
      source_id: qb-langchain
      claim: LangChain提供高层agent构造，并与低层编排能力组合。
      confidence: high
    - claim_id: EGT-QB-145-C2
      source_id: qb-langgraph-persistence
      claim: LangGraph区分checkpointer与store，内存checkpoint在进程重启后丢失。
      confidence: high
