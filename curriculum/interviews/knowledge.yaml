  - id: EGT-QB-146
    kind: eight_stock
    title: Agent 训练：交互轨迹SFT与长时程RL目标
    domain: agent_runtime
    tracks:
    - agent
    - systems
    skills:
    - skill.agent_application.agent_loop
    - skill.agent_application.tool_calling
    - skill.agent_application.reliability
    priority: P1
    difficulty:
      concept: 4
      implementation: 3
      debugging: 4
    seniority:
    - new_grad
    - mid
    - senior
    prompt: 要让模型学会可靠使用工具，SFT样本应包含哪些消息与证据？为什么还会使用RL，二者各自解决不了什么？
    one_liner: SFT模仿有真实观察、合法动作和可验证结果的轨迹，RL按环境反馈优化任务成功与代价；后者适应多步决策，但要解决稀疏奖励、信用分配和副作用。
    core_answer:
    - 轨迹记录任务、工具版本/schema、assistant调用及call ID、实际observation、后续决策/最终答复和环境终态；格式、角色顺序、参数合法与目标完成须验证，不能把虚构工具返回或泄漏未来结果作为上下文。
    - 训练通常监督assistant动作/回答，屏蔽用户、工具observation、padding等非目标span；失败轨迹可作为带解释的恢复示例、对照偏好或RL经验，不能无区别把错误动作当标准答案。按任务/环境/模板簇划分holdout，混入通用数据检查能力保持。
    - SFT优化专家动作似然，在未见状态容易暴露分布偏移；RL可优化最终任务成功、约束满足与工具/时间成本，允许不同于示范的有效路径。可定义r=成功分−成本项−违规罚项，但硬权限仍由环境阻断。
    - RL需可复位环境、可信grader、探索策略、长程信用分配和稳定更新；稀疏奖励、工具变化和reward hacking会影响学习。比较SFT、SFT+RL和等数据/算力基线，测未见任务、恢复、安全与每成功任务成本。
    derivation_or_example: 训练任务先lookup得到item_id=17再update(17)，应让模型在看到lookup结果后预测17；若把最终数据库答案提前放入prompt，会产生未来信息泄漏。错误ID轨迹可教修正，但不应奖励盲猜成功。
    answer_outline:
    - 真实交互轨迹与消息格式
    - assistant监督和失败数据
    - SFT分布偏移/RL终态目标
    - 环境、信用和独立评测
    acceptance:
      L1: 能列完整调用/结果链。
      L2: 正确设置assistant与tool的监督边界。
      L3: 解释RL与行为模仿的目标差异。
      L4: 设计无未来泄漏的环境训练与未见任务评测。
    follow_ups:
    - L1：为什么工具返回一般不作为assistant预测标签？
    - L2：只训练成功轨迹会遗漏什么恢复能力？
    - L3：最终奖励如何分配到前面工具选择？
    - L4：工具版本变化怎样影响离线轨迹和在线RL？
    pitfalls:
    - 伪造成功observation构造“高质量”轨迹。
    - 用最终成功奖励覆盖越权或重复副作用。
    signals:
    - 轨迹中的每个关键参数有真实来源。
    - 目标包含任务成功、约束和总成本。
