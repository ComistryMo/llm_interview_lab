  - id: EGT-PT-007
    kind: eight_stock
    title: "偏好数据与 Reward Model：噪声、长度偏差与校准"
    domain: preference_data_and_reward_modeling
    tracks: [post_training, llm_algorithm, vlm_algorithm, agent]
    skills: [skill.post_training_rl.preference_data, skill.post_training_rl.reward_modeling, skill.post_training_rl.verification, skill.data_mlops.data_quality, skill.evaluation_safety.benchmarks]
    priority: P0
    difficulty: {concept: 4, implementation: 4, debugging: 5}
    seniority: [intern, new_grad, mid, senior]
    prompt: "给一批 chosen/rejected 偏好对和一个 reward model，说明如何构造数据、训练与校准 RM，并诊断 reward 上升但真实质量下降。"
    one_liner: "偏好数据是后训练的监督契约：先保证 pair 语义、标注一致性和切分无泄漏，再用校准 RM 与独立 outcome/verifier 证明 reward 真的代表目标。"
    core_answer:
      - "每个 pair 固定同一 prompt，chosen/rejected 的差异应对应目标偏好；去重、过滤截断/无效回答，保留 tie、标注者分歧、来源和版本。"
      - "典型 RM 用 Bradley–Terry/logistic pairwise loss：-log σ(r(chosen)-r(rejected))；按 prompt/source 分组切分，报告 pair accuracy/AUC、margin 分布和校准误差。"
      - "检查长度、verbosity、位置、模板和 reward scale 偏差；对长度、领域、语言、难度和模型版本做切片，不能用总分掩盖捷径。"
      - "接入 DPO/PPO/GRPO 时锁定 tokenizer/template、response mask、reference/RM 版本和 rollout freshness；无效 completion 与 zero-variance group 有明确策略。"
      - "用独立人评、执行式 verifier、holdout win-rate/成功率和 adversarial counterexample 评估 reward-true gap，必要时修数据/verifier 或回滚。"
    derivation_or_example: "给三组偏好对，其中一组 chosen 更长但人评无差异，手算 pairwise loss 和长度分桶，并提出去重、重标注、校准和停止门槛。"
    answer_outline: ["定义 pair 与 provenance 契约", "推导 RM pairwise objective", "排查长度/标注/泄漏偏差", "用独立 outcome 验证并设回滚门"]
    acceptance: {L1: "能说明 chosen/rejected、RM 与 DPO/PPO 的边界。", L2: "能写出 pairwise loss、切分和校准指标。", L3: "能定位 reward-true gap、设计反例/独立 verifier 并给出回滚条件。"}
    follow_ups: ["RM pair accuracy 很高但 win-rate 不升，优先查哪些切片？", "tie/分歧标签应删除、合并还是建模？", "如何区分长度偏差、模板泄漏和真正能力提升？", "视觉偏好数据如何处理图像质量、OCR 和多模态 hallucination？"]
    pitfalls: ["随机按 response 切分造成同 prompt 泄漏", "把 reward 分数当作真实质量或概率", "忽略长度/位置/格式捷径", "RM、reference、tokenizer 版本漂移却继续训练"]
