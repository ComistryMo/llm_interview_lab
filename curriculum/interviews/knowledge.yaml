    prompt: "给定图像/视频尺寸、patch 或 merge 规则、帧采样策略和上下文上限，如何估算视觉 token、显存与延迟，并保证 processor、placeholder、时间位置和截断一致？"
    one_liner: "先把每个媒体 item 的 grid、帧时间和 token 数写入数据契约，再在预算内联合选择分辨率/采样/压缩；任何截断都必须可审计且不切断媒体 span。"
    core_answer:
      - "图像 patch 数可近似为 ceil(H/P)×ceil(W/P)，视频还要乘有效帧/temporal tubelet；实际数量受动态 resize、merge、分隔 token 和 processor 取整影响。"
      - "placeholder 数量、视觉 embedding span、image/video grid metadata 和多轴 position id 必须按样本顺序一一对应；先做 golden text-only/image-only/interleaved case。"
      - "按任务选择预算策略：OCR/细粒度任务优先保留空间细节，长视频优先分层采样/窗口摘要；同时报告 token、峰值显存、TTFT/TPOT 和质量切片。"
      - "时间 id 使用真实采样时间或明确 stride 单调生成；padding、丢帧、字幕和音频不能静默复用旧位置。"
    derivation_or_example: "对 H=1080、W=1920、P=14、空间 merge=2、T=16 帧和 max_visual_tokens=4096，给出粗略 token 上界、超预算方案及需要记录的 grid/time 字段。"
