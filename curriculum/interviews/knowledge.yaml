    - L4：训练负例增多后如何检查真实对象召回下降？
    pitfalls:
    - 把低温或prompt约束称为无幻觉保证。
    - 只统计不存在对象的回答，不测存在对象的召回。
    signals:
    - 按断言定位真实视觉支持。
