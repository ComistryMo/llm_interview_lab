    title: DPO数据与变体：SimPO、IPO、KTO、ORPO究竟改了什么
    domain: preference_objectives
    tracks:
    - post_training
    - llm_algorithm
    skills:
    - skill.post_training_rl.preference_data
    - skill.post_training_rl.policy_optimization
    - skill.deep_learning.losses
    priority: P1
    difficulty:
      concept: 4
      implementation: 3
      debugging: 4
    seniority:
    - intern
    - new_grad
    - mid
    - senior
    prompt: 为DPO定义一条合法偏好样本，再比较SimPO、IPO、KTO和ORPO在数据、参考模型及目标上的变化。不要把这些名字只列成同义词。
    one_liner: 偏好方法的差异在奖励参数化、损失形状、参考模型和标签结构，数据契约先于算法名。
    core_answer:
    - DPO样本含相同prompt及chosen/rejected完整回答；多轮须共享同一历史，分词模板一致，仅回答token算logprob。记录偏好准则、并列、不确定、长度和来源，按prompt/近重复簇拆分。
    - SimPO去reference，用回答平均logprob作为隐式奖励，并在成对logistic目标中加入目标margin；IPO保留相对reference的偏好差，用目标差值1/(2τ)的平方损失，缓解可分偏好上的过拟合倾向，具体符号按论文定义。
    - KTO不要求同prompt成对偏好，可用每条输出的desirable/undesirable标签，并采用前景理论启发的非对称效用及参考策略基线；ORPO无reference，在chosen的SFT项上加chosen/rejected的odds-ratio偏好项，是联合目标。
    - 这些改变会影响长度偏差、优化尺度和数据需求；不能把任一变体写成普适更好。用相同基础模型、数据边界和独立分桶评价比较质量及资源。
