schema_version: 1
reviewed_at: "2026-09-08"
content_policy:
  mode: clean_room
  attribution: link_only
  no_verbatim: true
  allowed_source_kinds:
    - paper
    - official_paper
    - official_docs
    - official_source
    - benchmark
    - course
    - field_report
    - secondary_curated
    - internal_original

# Method definitions come from primary papers or official documentation. Public
# interview reports only support "this pattern was observed" claims. They are
# never treated as a company's official or statistically representative bank.
