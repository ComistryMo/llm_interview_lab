    - 这是稳定性和优化便利性的解释，不是无条件质量定理；残差尺度、初始化、层数、学习率以及其他Norm变体会影响结果，Pre-LN也可能需要调度和稳定化设计。
    derivation_or_example: 若把一个已训练Post-LN模型仅挪动LN位置，F的输入分布和残差输出均改变，权重不能因此宣称无损等价；比较须重新训练或明确适配。
    answer_outline:
    - 两种公式
    - Jacobian路径
