    - senior
    prompt: 要补充真实数据不足的数学、代码和多轮指令。比较三种合成路线，并给出从生成到训练效果的质量验证闭环。
    one_liner: Self-Instruct 扩展种子任务，Evol-Instruct 改写任务复杂度，Magpie 利用对齐模型的用户消息前缀生成指令；合成规模必须由独立正确性与泛化收益约束。
    core_answer:
    - Self-Instruct 以少量种子任务引导生成新指令、输入和输出，过滤无效及近重复后迭代。Evol-Instruct 从现有指令做增加约束、推理步骤等深度进化，也做任务宽度扩展；复杂度增长不保证可解。
    - Magpie 利用对齐模型对聊天模板的学习，只给用户消息开始之前的模板前缀，让模型续写用户问题，再生成回答；其“无提示”不意味着没有聊天模板或模型先验，适配模型/模板必须明确。
    - 过滤层次包括格式/角色合法、语言、去重、可解性、可执行测试或符号验证、与证据一致性、敏感信息和风险审查。Judge 可筛选，但同一生成器自评会共享盲点，需独立 verifier 与人工分层抽检。
    - 保留 seed、模型/采样/模板版本及谱系；按任务簇留出真实测试集，用固定 token/训练步比较原数据、合成数据、不同混合比，衡量长尾覆盖和通用回退。
    derivation_or_example: 把“返回列表最大值”进化成“空输入返回错误且不得修改输入”；先判断约束无矛盾，再用空列表、重复最大值和突变检测验证回答。只把文字变长而不增加任务能力不应计作新难度。
    answer_outline:
    - 三种生成机制
    - 可解性与正确性分层过滤
    - 谱系、去重和数据污染
    - 等预算下游消融
    acceptance:
      L1: 说清三个方法各生成什么。
      L2: 区分指令复杂、答案正确和真实多样性。
      L3: 给出数学/代码可执行验证与独立抽检。
      L4: 能用谱系拆分和混合比实验决定保留数据。
    follow_ups:
    - L1：Magpie 为什么依赖特定聊天前缀？
    - L2：Evol-Instruct 如何发现互相冲突的新增约束？
    - L3：相同教师既生成又打分会形成什么选择偏差？
    - L4：怎样检测几轮合成后任务分布收缩而总量上涨？
    pitfalls:
    - 把教师置信度或语言流畅当成正确性。
    - 从测试题改写合成训练数据后仍报告无污染测试。
    signals:
    - 能提出与业务能力对应的验证器。
    - 报告数据谱系、拒绝原因和训练收益。
