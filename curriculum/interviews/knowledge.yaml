    prompt: 匿名比较两个聊天模型的回答后收集胜负和平局，如何得到评分？写出Elo更新，并解释为什么不能把Arena分数看作绝对智能值。
    one_liner: Arena 由匿名真人成对偏好构建相对排名；Elo是在线更新方法，Bradley–Terry是成对胜率模型，分数依赖对手、用户分布和估计协议。
    core_answer:
    - 匿名展示同一prompt的两个回答，用户选择A胜、B胜、平局或均差，收集投票与任务元信息。原始Arena论文讨论以Bradley–Terry模型拟合偏好并估计不确定性；不能把所有历史或当前榜单都简化为同一在线Elo实现。
    - 经典Elo期望E_A=1/(1+10^((R_B−R_A)/400))，更新R_A←R_A+K(S_A−E_A)，S_A可取1、0.5、0；K与初始分和对局顺序影响动态。BT可写P(A胜B)=σ(β_A−β_B)，通过全体成对数据估参数，再映射到分数尺度。
    - 用户选择反映特定prompt与人群的综合偏好，可能偏爱冗长、格式或熟悉语言；票源质量、重复投票、非随机匹配、模型风格和置信区间都影响解释。
    - 固定统计版本、投票过滤与平局处理，按语言/领域分桶并bootstrap区间；相近名次可能无显著差异，整体偏好排名不替代代码功能、安全或专业正确性。
    derivation_or_example: R_A=R_B=1500，K=32，A胜时E_A=0.5，A更新到1516、B到1484。若A只对弱模型出战，未经合理全局估计的原始胜率无法与对战强模型的B比较。
