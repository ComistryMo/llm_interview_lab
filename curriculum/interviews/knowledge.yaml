    prompt: 有人说“CLIP嵌入很差，BGE/E5在MTEB大幅领先”。在没有型号、榜单日期和评测设置时应怎样判断这个结论，并从训练目标解释可能差异？
    one_liner: 先核对具体版本与任务；CLIP主要为图文对齐学习表示，BGE/E5主要面向文本语义/检索，文本基准差异可能来自目标与数据匹配，不能推广为全场景排名。
    core_answer:
    - 原命题缺CLIP/BGE/E5型号、语言、checkpoint、MTEB版本和子任务，不能直接承认“大幅领先”这一量化比较。MTEB涵盖检索、分类、聚类、语义相似等多类文本embedding任务，平均分受任务集合和协议影响。
    - CLIP文本tower服务图文caption匹配，常聚焦可视觉化的对象/属性；文本检索模型在query-passage、语义相似、难负例或多任务数据上训练，更直接优化文本相关性。模型容量、文本长度预算、语言与pooling也会影响。
    - E5使用弱监督文本对比预训练及后续监督，BGE相关工作采用面向通用文本embedding的多阶段训练；具体query/passage前缀、归一化和相似度规则须遵守相应模型卡，不能给一方错误输入协议。
    - 在相同语料、ANN/精确搜索、K、长度和成本下分文本检索、图文检索与多语言评测，检查截断、模板和hard-negative切片。CLIP在图像↔文本检索的价值不由文本MTEB排序否定。
