  - id: EGT-QB-110
    kind: eight_stock
    title: 语言模型 RL 难点：探索、长时程信用与非平稳训练
    domain: reasoning_training
    tracks:
    - post_training
    - llm_algorithm
    skills:
    - skill.post_training_rl.policy_optimization
    - skill.post_training_rl.grpo
    - skill.post_training_rl.verification
    priority: P1
    difficulty:
      concept: 4
      implementation: 3
      debugging: 4
    seniority:
    - new_grad
    - mid
    - senior
    prompt: 推理RL中答案逐渐趋同、奖励先涨后跌、训练偶尔崩溃。如何分别从输出分布、奖励漏洞和优化动态解释，并设计监控和干预？
    one_liner: LLM的巨大动作空间、稀疏末端奖励和长轨迹使探索与信用分配困难；策略收缩、代理漏洞和过时rollout又会互相放大。
    core_answer:
    - 每一步是词表上的动作，长序列轨迹空间巨大；若策略概率质量集中在少数回答且奖励稀疏，采样组常全同分，模型难以发现新成功路径。分布集中不是所有模型的恒定事实，应看token/序列熵、重复率与组奖励方差。
    - 语言流畅只是训练先验，奖励器可能偏爱格式、长度或可骗测试；策略优化越强越可能利用代理漏洞。需要把训练reward与独立验证准确率分开看，并保留规则无法验证的任务范围。
    - rollout与更新解耦造成旧策略样本、ratio极端和train/inference logprob不一致；长序列使梯度方差、截断、长度归约和显存成本更敏感。value/advantage估计误差与奖励尺度也会放大不稳定。
    - 按失败证据调节采样温度/课程、KL或熵约束、batch和学习率、clip范围、优势归一化与更新次数；监控独立成功率、熵、KL、clip fraction、长度、组方差和非有限值。先定位退化再回滚/小规模消融。
    derivation_or_example: 训练reward持续涨、独立数学verifier持平且平均回答长度翻倍，优先检查长度捷径；若组内reward全部相同并且重复率很高，优先查探索与样本难度，不能一概归为“没有Critic”。
    answer_outline:
    - 动作空间、稀疏奖励与熵
    - reward hacking
    - 陈旧rollout和数值动态
    - 监控分流与干预
    acceptance:
      L1: 说清探索与信用分配困难。
      L2: 把奖励漏洞与优化不稳分开。
      L3: 用可观测指标区分模式收缩和过时数据。
      L4: 给出单因素稳定性实验与独立任务验证。
    follow_ups:
    - L1：一组样本全得0分为什么难学习？
    - L2：提高温度为什么不总能改善探索？
    - L3：KL突增、clip比例高同时出现时先查什么？
    - L4：何时缩小更新步数比扩大reward模型更有效？
    pitfalls:
    - 认为加Critic可自动解决所有RL不稳定。
    - 只监控训练reward、不留独立验证。
    signals:
    - 每个症状对应不同假设与测量。
    - 知道长序列归约和截断会改变优化目标。
