    prompt: 为何固定参数的因果解码器可以复用历史Key/Value而无需保存历史Query？给出KV显存公式，并说明分页能减少什么、不能减少什么。
    one_liner: 因果mask使旧位置表示不受后续token影响，缓存各层K/V可避免重复投影。
    core_answer:
    - 新token只产生自己的Q/K/V，其Q与所有历史K求分数并聚合历史V；旧Q不参与新位置输出。位置、mask、权重与前缀必须一致，改动前缀或adapter通常使对应cache失效。
    - 若每层KV头数Hkv、头维d、长度S、batch B、层数L、每元素b字节，KV约2·B·L·S·Hkv·d·b；变长请求应对实际长度求和，还须加分页取整及元数据。GQA用Hkv而非Hq。
    - PagedAttention将逻辑token块映射到非连续物理块，按需分配及回收，并可共享只读前缀后写时复制；减少预留空间与外部碎片，不消除每个唯一KV向量的固有字节数。
    derivation_or_example: B=1、L=32、S=8192、Hkv=8、d=128、b=2时KV=1GiB；若改为32个KV头则为4GiB。cache节省重复计算，但每步仍要读取增长的历史KV。
    answer_outline:
    - 用因果依赖证明复用
    - 算实际KV头的字节数
    - 解释分页与失效边界
    follow_ups:
