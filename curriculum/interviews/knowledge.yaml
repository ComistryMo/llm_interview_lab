    prompt: 分布式训练GPU计算很快却长时间等待通信。给出从trace到修复的诊断顺序，并区分NVLink与RDMA各处于什么层面。
    one_liner: 通信优化先测消息大小、频率和拓扑，再选重叠、分桶与层次归约；NVLink是GPU等设备互联，RDMA是远程直接内存访问机制，不能互当同一技术。
    core_answer:
    - 把step分解为算子、collective、等待与输入阻塞，识别带宽受限的大消息、延迟受限的小消息、straggler或拓扑绕路。检查rank绑定、GPU-NIC亲和、链路状态和匹配collective顺序。
    - 梯度按bucket边计算边all-reduce、参数prefetch、reduce-scatter/all-gather和分层collective可重叠通信；bucket太小launch/协议开销大，太大又推迟启动。异步不等于没有依赖，消费buffer前必须等待完成。
    - NVLink在支持硬件上提供高带宽低延迟设备互联，具体连接范围与代际有关；RDMA经网络直接读写远端注册内存，减少CPU介入。GPUDirect RDMA可让网卡直接访问GPU内存，仍受NIC、PCIe/拓扑、注册和网络带宽限制。
    - 梯度累积减少同步频次但改变有效batch/更新时机；压缩或低精度通信可能损失精度，需误差与收敛回归。按有效训练tokens/s、规模效率和最终损失比较，而不是只跑理想网络带宽测试。
    derivation_or_example: 4MB梯度拆成4000个1KB消息会有大量固定延迟；合成适当bucket可改善，但把所有梯度合成一个bucket又可能直到反向结束才开始发送，失去重叠窗口。
    answer_outline:
