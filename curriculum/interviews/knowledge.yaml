  - id: EGT-QB-111
    kind: eight_stock
    title: 安全对齐：Constitutional AI、红队和越狱评测的边界
    domain: evaluation
    tracks:
    - llm_algorithm
    - post_training
    - agent
    skills:
    - skill.evaluation_safety.benchmarks
