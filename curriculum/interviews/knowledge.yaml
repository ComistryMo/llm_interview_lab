      L2: 正确区分选择准确率、最终答案和执行测试。
      L3: 固定prompt、样本数与规范化后做公平比较。
      L4: 能设计互补真实任务并报告统计与污染风险。
    follow_ups:
    - L1：HellaSwag 为什么可用候选log-likelihood计分？
    - L2：MATH 的分数、根式等价如何避免字符串误判？
