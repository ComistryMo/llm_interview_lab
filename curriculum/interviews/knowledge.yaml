      - {claim_id: EGT-PT-011-C2, source_id: prm-paper, claim: "过程监督/过程奖励模型提供比结果级分数更细的步骤级反馈，但仍需验证覆盖和偏差。", confidence: high, locator: "paper abstract/method"}
