  - id: EGT-AGT-006
    kind: eight_stock
    title: "Agent 评测：trace、outcome、pass^k 与安全发布门禁"
    domain: agent_evaluation
    tracks: [agent, systems, post_training]
    skills: [skill.agent_application.evaluation, skill.agent_application.reliability, skill.evaluation_safety.benchmarks, skill.evaluation_safety.llm_judge, skill.evaluation_safety.safety_eval]
    priority: P0
    difficulty: {concept: 4, implementation: 4, debugging: 5}
    seniority: [intern, new_grad, mid, senior]
    prompt: "为会调用工具的 Agent 设计可回放评测：如何分别计分最终 outcome、trajectory、工具/schema、安全和成本，并用多 trial 设置发布门禁？"
    one_liner: "一次最终答对不等于可靠；固定 task/trial/grader/environment 版本，记录完整 trace，用 outcome、过程、安全、成本和 p95 gate 共同决定发布。"
    core_answer:
      - "trace 至少记录 run/step/tool/attempt、输入摘要、schema 校验、授权决策、环境状态、结果、耗时、重试和终止原因，敏感值脱敏且可 replay。"
      - "outcome 评任务状态，trajectory 评步骤/工具顺序，safety 评越权/注入，effectiveness 评用户目标；这些维度不能互相替代。"
      - "多 trial 用于估计环境/工具随机故障；pass@k（至少一次成功）和 pass^k（每次都成功）适合不同风险决策，必须报告 k、预算和置信区间。"
      - "LLM judge 用人工锚点、候选交换、长度匹配和版本锁定校准；代码 grader、环境断言和人工复核按可验证性分工。"
    derivation_or_example: "给 5 次相同任务的 trace，其中一次最终答对但越权、一次工具超时后恢复，计算 outcome/safety/pass@k/pass^k 并给出 release gate。"
    answer_outline: ["定义 trace schema 与信任边界", "拆 outcome/trajectory/safety 指标", "解释多 trial 统计", "设置可回滚发布门"]
    acceptance:
      L1: "能区分最终结果与行为过程。"
      L2: "能设计 trace、grader 和多 trial 指标。"
      L3: "能处理 judge 偏差、环境随机性、安全违规和成本门禁。"
    follow_ups: ["最终答案正确但轨迹越权，overall score 如何防止掩盖？", "pass@k 与 pass^k 分别适合探索性和高风险任务的什么决策？", "如何检测 judge 的位置、长度和自偏好？", "工具失败、模型失败和环境 reset 失败怎样在 trace 中归因？"]
    pitfalls: ["只评最后一句或只跑一次", "把 benchmark leaderboard 当生产 SLO", "不固定 harness/env/tool/judge revision", "为了平均分放宽安全违规和成本阈值"]
    signals: ["trace 可回放且不泄露秘密", "指标能定位而非只排序", "发布门同时覆盖质量、安全、成本和尾延迟"]
