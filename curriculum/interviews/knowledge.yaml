  - id: EGT-QB-147
    kind: eight_stock
    title: Coding Agent：仓库上下文、可验证变更与记忆新鲜度
    domain: agent_memory
    tracks:
    - agent
    - systems
    skills:
    - skill.agent_application.state_memory
    - skill.agent_application.planning
    - skill.agent_application.reliability
    priority: P1
    difficulty:
      concept: 4
      implementation: 3
      debugging: 4
    seniority:
    - new_grad
    - mid
    - senior
    prompt: Agent在一个不断变化的仓库中修复跨模块bug。核心难点是什么？解释当前上下文与长期记忆的区别，以及如何防止依据过时摘要修改错误代码。
    one_liner: 工程编码需要定位契约、依赖、环境和用户已有改动，以测试和diff验证结果；上下文是当前输入，记忆只是待核对的持久线索。
    core_answer:
    - 代码上下文包含相关文件、调用链、接口/测试契约、构建环境和局部规则；仅按文本相似检索可能漏掉动态调用、配置或数据约定，应从错误与依赖逐步扩展读取，避免无界全仓塞入。
    - 挑战还包括多文件一致性、依赖版本、生成代码可执行性、现有未提交修改、测试覆盖不足和工具失败。修改前定位事实，按最小充分范围编辑，保留用户改动；执行结果与静态推断分开报告。
    - 长期记忆可保存架构线索、已验证命令和历史决策，但要带commit/文件hash、来源和适用版本；文件已改变时旧摘要需重新检查。上下文中暂时出现某信息不代表已经持久保存，也不保证未来可检索。
    - 使用独立检查和适当公开测试验证问题触发、契约边界、回归与复杂度；审阅diff和真实退出状态，代码看似合理或Agent自述完成不代表修复。评测可借鉴SWE-bench的仓库问题与执行式验证，不能只以补丁文本相似度衡量。
    derivation_or_example: 记忆称parse()返回字符串，当前代码已改为结果对象。先读取当前定义与调用方、对比版本，再调整修复；直接沿用旧记忆会使新代码类型不匹配。测试通过后也应查看是否意外修改无关文件。
    answer_outline:
    - 相关上下文与调用契约
    - 跨模块/环境/已有修改
    - 上下文与版本化记忆
    - 执行测试与diff验证
    acceptance:
      L1: 能列出源码之外的必要工程事实。
      L2: 区分当前读取与历史记忆。
      L3: 知道用版本/hash核对过时线索。
      L4: 用可复现触发和验证约束变更并保护已有工作。
    follow_ups:
    - L1：为什么检索最相似文件可能找错bug根因？
    - L2：记忆中的测试命令失效时先查什么？
    - L3：部分测试通过为何不能宣称所有回归消失？
    - L4：如何在有限context下保持跨模块接口一致性？
    pitfalls:
    - 把长期记忆当比当前代码更权威的事实。
    - 以生成补丁或模型自评代替执行验证。
    signals:
    - 当前版本、证据和实际运行结果分明。
    - 能控制改动范围并维护用户已有工作。
