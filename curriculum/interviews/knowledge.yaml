    - claim_id: EGT-QB-154-C1
      source_id: blip2-paper
      claim: BLIP-2第一阶段含ITC、ITM、ITG，第二阶段以视觉query前缀连接冻结LLM进行生成学习。
      confidence: high
      locator: §3.2–3.3
