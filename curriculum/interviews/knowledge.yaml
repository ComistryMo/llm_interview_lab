    - claim_id: EGT-QB-082-C1
      source_id: bpe-paper
      claim: BPE 可通过学习字符序列的合并规则构造子词词表。
      confidence: high
    - claim_id: EGT-QB-082-C2
      source_id: qb-wordpiece
      claim: WordPiece 编码使用最长匹配；官方课程明确其训练算法解释存在实现公开程度限制。
      confidence: high
    - claim_id: EGT-QB-082-C3
      source_id: qb-sentencepiece
      claim: SentencePiece 支持直接从原始文本学习 BPE/Unigram 子词模型。
      confidence: high
