  - id: EGT-QB-157
    kind: eight_stock
    title: LLaVA：条件语言模型损失、两阶段与数据清洗
    domain: multimodal_architecture
    tracks:
    - vlm_algorithm
    - post_training
    skills:
    - skill.llm_vlm.vlm_architecture
    - skill.llm_vlm.multimodal_data
    - skill.deep_learning.losses
    priority: P1
    difficulty:
      concept: 4
      implementation: 3
      debugging: 4
    seniority:
    - new_grad
    - mid
    - senior
    prompt: 从图片和多轮指令到loss，描述原始LLaVA的数据流与两阶段训练。连接器学什么，图片、prompt和assistant回答分别怎样监督，数据质量怎样验证？
    one_liner: LLaVA把视觉特征投影为语言模型输入，使用回答token的条件自回归交叉熵；先学习连接器对齐，再微调连接器和LLM以跟随视觉指令。
    core_answer:
    - 原始LLaVA用CLIP视觉encoder提取特征，线性projector映射到LLM embedding；后续型号可换MLP，但必须注明版本。第一阶段冻结视觉和LLM、训练投影以图文caption建立接口，第二阶段训练投影与LLM做视觉指令，视觉tower保持冻结的原始设定应说明。
    - 目标L=−Σ_t m_t log p(y_t|image,prompt,y_<t)/Σ_t m_t，m_t标记实际监督的assistant目标token；图像embedding、用户/系统prompt和padding不作为普通词表target。logits/labels
      shift后仍需保证多轮边界、EOS和媒体span一致。
    - 连接器匹配维度并学习视觉信息对语言隐藏空间的条件作用，不是CLIP的对比loss或自动识别所有视觉内容。原始视觉指令数据包含由文本caption/box等符号信息辅助生成的对话，不能假称生成器当时直接看过原图。
    - 工程清洗应校验图片可解码、文本/图片ID与顺序一致，过滤重复/污染、错误OCR/坐标、与图像不一致答案和无效对话角色；保留来源和生成版本，按图像簇拆split。合成回答仍需图像证据核验和人工抽检，这些是本题建议而非声称原作者逐项实施。
    derivation_or_example: 用户问“图中有几杯水”，assistant答“两杯”。只有回答及契约内终止token计CE，图片span不能被当成“image”单词标签；若图片裁剪后只剩一杯，原标签必须更新或剔除。
    answer_outline:
    - 视觉encoder→projector→LLM
    - 两阶段冻结与作用
    - assistant条件CE/shift
    - 原始数据来源与工程清洗
    acceptance:
      L1: 说清生成式loss而非CLIP对比目标。
      L2: 准确列两阶段trainable模块。
      L3: 能检查媒体span、shift和回答mask。
      L4: 区分原始论文事实与建议清洗流程。
    follow_ups:
    - L1：第一阶段为什么不必立刻解冻LLM？
    - L2：多轮对话中哪个assistant span计loss？
    - L3：caption辅助生成的问答为何可能与原图不一致？
    - L4：图片近重复进入不同split怎样影响泛化评测？
    pitfalls:
    - 把LLaVA的训练loss写成图文InfoNCE。
    - 声称原始文本教师直接读了未输入给它的图像。
    signals:
    - 媒体、文本和labels长度一致。
    - 对生成数据保留可核验事实边界。
