    prompt: "如何区分 object、attribute、relation/temporal 和 knowledge hallucination，并设计反事实样本、拒答策略和多模态偏好对齐的发布门禁？"
    one_liner: "先让答案绑定可见证据，再分别测存在性、属性、关系和时间错误；偏好训练要同时约束有用性、事实性、拒答率和延迟。"
