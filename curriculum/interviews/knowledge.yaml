    prompt: 一个RAG检索器每次返回五个片段。如何同时判断是否找全证据、首条是否可用和排序是否合理，并处理多个相关文档与未标注文档？
    one_liner: Recall@K看相关证据覆盖，Precision@K看返回集合纯度，MRR只看首个相关结果；分级相关排序还需NDCG等互补指标。
    core_answer:
    - 设相关集合R与前K返回集合S_K，Recall@K=|R∩S_K|/|R|，Precision@K=|R∩S_K|/K；若实际只返回m<K条，分母按预先约定写清。MRR=平均_q(1/r_q)，r_q为首个相关排名，无命中记0。
    - MRR对第一个命中之后的排序不敏感；需要多段证据的多跳问答应测joint coverage或所有必要证据都召回。NDCG适合分级相关性，使用固定gain和log折损并以理想排序归一化。
    - 标注应以问题和目标证据为单位，区分同文档重复chunk、部分相关、过时和无权限内容。只有少量已知正例时把所有未标注文档判负会低估新检索器，需要pooling和抽检补标。
    - 固定语料版本、chunk大小、过滤、K、重排和延迟预算；分层比较召回阶段、rerank阶段和最终证据集，同时测空召回、重复率、时效、语言与成本。
    derivation_or_example: 某题有4个相关文档，前5位相关性为[0,1,0,1,0]：Recall@5=2/4=0.5，Precision@5=2/5=0.4，RR=1/2。若第2位只是一半推导，MRR高仍不保证多跳回答完整。
    answer_outline:
    - 三个指标定义与示例
    - MRR对多证据的盲点
    - NDCG与分级标注
    - 分阶段/语料/预算控制
    acceptance:
      L1: 能手算P、R、RR。
      L2: 区分找到首条与覆盖全部证据。
      L3: 说明标注不全及重复chunk影响。
      L4: 设计召回、重排、证据集和下游的联合消融。
    follow_ups:
    - L1：K增加时precision和recall通常怎样变化？
    - L2：为什么两个检索器MRR相同但多跳回答差很多？
    - L3：新系统找到了未标注但相关的文档如何公平评分？
    - L4：怎样衡量权限过滤后仍然可回答的证据覆盖？
    pitfalls:
    - 把同一文档五个重叠chunk算成五个独立证据。
    - 把高MRR直接解释为RAG答案正确。
    signals:
    - 标注对象、分母和K一致。
    - 能够区分召回遗漏与重排降序问题。
