    prompt: "一个 Agent 需要调用外部工具和资源时，如何设计 schema、权限、超时、重试和对抗 prompt injection 的边界？"
    one_liner: "把工具当不可信 RPC：能力声明、参数 schema、授权/审计、幂等和超时都由宿主校验，模型文本不直接获得权限。"
    core_answer:
