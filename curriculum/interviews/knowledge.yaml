  - id: EGT-QB-105
    kind: eight_stock
    title: CoT、Zero-shot CoT 与 Self-Consistency 的收益与边界
    domain: evaluation
    tracks:
    - llm_algorithm
    - post_training
    - agent
    skills:
    - skill.evaluation_safety.benchmarks
    - skill.data_mlops.experiments
    priority: P1
    difficulty:
