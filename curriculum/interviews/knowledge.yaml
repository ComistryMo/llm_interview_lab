      L2: "能说明连续批处理、chunked prefill 和 KV 容量的耦合。"
      L3: "能从 p99、公平、抢占、成本和 workload 设计发布 gate。"
    follow_ups: ["为什么 decode 往往更受显存带宽而非 FLOPs 限制？", "长 prompt flood 时如何避免 decode starvation？", "chunked prefill 的 chunk size 如何用目标 SLO 选择？", "prefix cache 命中后 TTFT、KV ownership 和多租户隔离怎样变化？"]
    pitfalls: ["只报平均 tokens/s，不报 TTFT/ITL p99", "把 active request 数当作 KV token 容量", "新 admission 同步 decode 导致边界不可复现", "抢占/取消后未释放 KV 或没有 trace 原因"]
