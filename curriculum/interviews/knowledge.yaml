    prompt: 一个订票Agent偶尔成功，但经常多订一次或走错流程。如何建立离线评测、获取可信结果并衡量重复运行可靠性？
    one_liner: 以环境中的真实终态判成功，以trace定位过程与越权，以多次重放衡量稳定性，成本和安全失败须单列。
    core_answer:
    - 为每个任务冻结起始环境、权限、成功断言和预算；在可复位测试环境运行完整agent，记录观察、工具名/参数、返回值、时间、重试及最终状态。成功证据来自环境查询或可执行grader，不能依赖agent自述“完成”。
    - 结果指标包括任务完成率、完整约束满足率、错误副作用、无授权操作和人工接管率；过程指标包括参数有效率、工具选择、重复调用、恢复率、每成功任务token/费用/延迟。中间指标改善不必然提高终态成功。
    - 重复运行k次可分别报告至少一次成功pass@k和全部成功的经验频率pass^k；它们回答不同问题。相同任务的多次结果相关，应按任务聚类估置信区间，保留失败轨迹。
    - 按任务类型、难度、工具故障、长轨迹、对抗输入和权限边界切片；先无副作用回放/模拟，再小流量真实验证，保证复位、版本、随机性和评分器不读取未来状态。
    derivation_or_example: 同一任务5次运行成功4次、失败1次且重复下单1次：不能只报80%成功掩盖副作用。执行完应查询订单数、目的地、价格上限和支付状态，而不是读最终自然语言。
    answer_outline:
    - 环境初态/成功断言
    - trace与终态分离
    - 成功、安全、成本指标
    - 重复可靠性与可复位评测
    acceptance:
      L1: 知道需独立读取环境结果。
      L2: 定义成功和副作用分别计分。
      L3: 能区分pass@k和pass^k并记录trace。
      L4: 设计故障注入、环境复位和统计切片。
    follow_ups:
    - L1：工具调用返回200是否代表任务成功？
    - L2：如何识别最终成功但过程越权的轨迹？
    - L3：5次有1次成功与5次全成功分别反映什么？
    - L4：模拟工具和线上接口行为不同如何校准评测？
    pitfalls:
    - 把agent最终回复当grader。
    - 只报最佳一次运行或删掉timeout。
    signals:
    - 每个成功判断可对应环境断言。
    - 能将重试和副作用纳入完整任务成本。
