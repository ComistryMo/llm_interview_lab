    one_liner: Megatron Sequence Parallel在TP组内沿序列维分摊部分激活，用all-gather/reduce-scatter衔接矩阵运算；它不把注意力上下文当独立文档。
    core_answer:
    - 纯TP中一些逐token算子及其输入/输出可能在各rank复制，例如LayerNorm、Dropout与残差相关激活。SP把S×B×H沿S切为S/p×B×H，本地执行逐token操作，减少复制激活。
    - 进入需要完整序列的列并行矩阵算子前all-gather序列；行并行输出通过reduce-scatter得到序列分片。可把原All-Reduce分解为reduce-scatter+all-gather，与TP衔接；具体通信时序与前反向重叠依实现。
    - 这里参数仍按TP等策略存储，SP主要节省激活，不自动将所有attention计算或KV存储按序列分摊。Context Parallel等长序列方法会进一步跨rank分attention输入并交换K/V或采用其他等价算法，必须保证全局因果可见性。
    - 省下的显存可扩大序列或microbatch，但通信/重计算取舍要实测；dropout随机性、position、padding和各rank梯度归约需与非并行基线语义一致。
    derivation_or_example: S=8192、B=1、H=4096、BF16的一个激活约64MiB；TP4下若原来复制，SP分片后每rank该激活约16MiB。此数字不包含其他未分片激活，更不意味着attention总计算量缩为1/4。
    answer_outline:
    - TP中的复制激活
    - 沿S分片与collective衔接
    - SP与context parallel区别
