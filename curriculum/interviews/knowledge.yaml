  - id: EGT-QB-104
    kind: eight_stock
    title: Chinchilla：固定训练算力下参数与token的最优分配
    domain: data_engineering
    tracks:
    - llm_algorithm
    - post_training
    skills:
    - skill.data_mlops.data_quality
    - skill.data_mlops.reproducibility
    - skill.evaluation_safety.leakage
    priority: P1
    difficulty:
      concept: 4
      implementation: 3
      debugging: 4
    seniority:
    - new_grad
    - mid
    - senior
    prompt: 预算只允许一定训练FLOPs，是训练更大的模型还是给小模型更多token？写出可拟合的Scaling Law，并解释Chinchilla结论的适用条件。
    one_liner: 在给定训练预算和数据分布下拟合损失随参数N与token D的幂律，再沿算力约束求最优；Chinchilla的近等比例增长不是所有部署的固定配方。
    core_answer:
    - 常见拟合L(N,D)=E+A/N^α+B/D^β，E为不可约项；稠密Transformer训练近似C≈6ND，常数依架构、序列长度和计算口径改变。固定C代入D=C/(6N)后优化N。
    - 对N求导可得αA N^(−α)=βB D^(−β)，即最优点平衡增加参数与数据的边际损失收益。若α≈β，则N和D均近似随sqrt(C)增长。
    - Chinchilla在其研究配置中发现应同时扩大参数与训练token，常被概括为约20训练token/参数；这个经验比率不应外推成所有模型/数据质量/语言组合的定律。
    - 若考虑大量推理调用，小模型更长训练可能降低全生命周期成本；数据重复、质量、MoE激活参数、长序列attention成本和最优化不足都会改变拟合。用小规模多点实验、外推区间和实际吞吐评估预算。
    derivation_or_example: 若C增加4倍且两指数近似相同，compute-optimal附近可把N、D各增2倍。若N固定、D增加4倍仍满足总算力，但它优化的是不同部署约束，不能简单说“违反Scaling
      Law”。
    answer_outline:
    - N/D损失幂律
    - C≈6ND与边际平衡推导
    - Chinchilla经验范围
    - 训练最优与部署成本
    acceptance:
      L1: 理解参数和数据共同影响损失。
      L2: 写对约束和sqrt增长推导。
      L3: 知道约20 tokens/参数是条件性经验。
      L4: 能根据推理量、质量和架构重估最优点。
    follow_ups:
    - L1：固定算力时参数翻倍会怎样改变可训练token数？
    - L2：α与β不同会如何改变最优增长指数？
    - L3：重复训练低质量数据是否等价于增加有效D？
    - L4：推理请求量很大时为何可能故意过训练小模型？
    pitfalls:
    - 把20 tokens/参数当所有训练的硬要求。
    - 对MoE直接用总参数N代入稠密6ND并忽略激活规模。
    signals:
    - 能把经验结论还原为拟合与约束。
    - 区分训练算力最优和总体商业成本最优。
