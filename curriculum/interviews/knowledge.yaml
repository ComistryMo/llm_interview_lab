    - senior
    prompt: 长prompt使正在输出的短请求卡顿。解释prefill与decode的计算特点，再比较分离部署和分块prefill如何解决、又增加了什么成本。
    one_liner: Prefill并行处理prompt，decode逐步生成并反复读取权重/KV；分块调度减少长prefill阻塞，分离部署隔离资源但要搬运KV并管理队列。
    core_answer:
    - Prefill一次处理T个已知token，较大矩阵运算和attention通常有较高算术强度；decode每序列只处理新token，读历史KV和权重，低batch时常受带宽限制。二者的瓶颈随batch、长度、模型和硬件变化，不能一律断言。
    - Chunked prefill将长prompt切成若干块，跨调度轮保留已计算KV，与decode共同受token预算控制。因果上下文必须连续，分块是调度切分而不是把块当独立文档；可改善已有decode的TPOT，但新请求TTFT与调度开销可能增加。
    - Prefill/Decode分离将两阶段放在不同GPU池，分别扩缩和选batch策略；prefill后把KV和元数据传到decode池，成本包括网络带宽、格式/并行布局转换、排队、重复权重驻留和故障恢复。
    - 测TTFT、TPOT、端到端延迟、goodput（满足SLO的吞吐）、KV搬运耗时和池利用率。长输入短输出、短输入长输出的最优资源比例不同；负载不足时合并部署可能更省。
    derivation_or_example: 长prompt需要200ms prefill，短请求目标每token20ms；一次插入整段可能造成明显停顿。若切成若干10ms量级块可减单次阻塞，但搬1GiB KV到远端即使有效20GB/s也约需50ms，不能忽略传输。
    answer_outline:
    - 阶段算术强度与KV访问
    - 分块prefill连续性
    - 分离部署与KV传输
    - SLO/goodput和负载比例
    acceptance:
      L1: 能区分prompt并行和逐token生成。
      L2: 解释chunk仍需完整历史KV。
      L3: 列出分离后的传输和排队代价。
      L4: 能按负载/SLO选择并评测方案。
    follow_ups:
    - L1：decode在大batch时是否仍必定带宽受限？
    - L2：chunk边界position和cache怎样衔接？
    - L3：分离后TTFT反而增加应查什么？
    - L4：输入输出长度分布改变时如何调节两个资源池？
    pitfalls:
    - 把chunked prefill当语义文本分块并丢弃之前上下文。
    - 只看tokens/s而不计算KV传输和尾延迟。
    signals:
    - 分别分析TTFT和TPOT。
