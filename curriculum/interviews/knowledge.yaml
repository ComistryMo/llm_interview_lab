  - id: EGT-QB-085
    kind: eight_stock
    title: Packing：有效 token 利用率、跨文档 mask 与边界标签
    domain: data_engineering
    tracks:
    - llm_algorithm
    - post_training
    skills:
    - skill.data_mlops.data_quality
    - skill.data_mlops.reproducibility
    - skill.evaluation_safety.leakage
    priority: P1
    difficulty:
      concept: 4
      implementation: 3
      debugging: 4
    seniority:
    - new_grad
    - mid
    - senior
    prompt: 将长度不同的文档装入固定长度训练块时，如何提高有效吞吐，并保证独立样本的 attention 与 next-token 标签不串联？
    one_liner: Packing 用真实 token 填充原本的 padding；文档是否允许互看、边界 target 是否预测及 position 是否重置必须由训练目标显式决定。
    core_answer:
    - 把短序列装入最大长度块可用顺序拼接或装箱；有效利用率=非padding token数/分配token数。无隔离连续文档预训练可在 EOS 后继续因果预测；独立样本训练则必须使用块对角 causal mask
      或等价 varlen 累积长度元数据。
    - Attention mask 决定可见信息，label mask 决定哪些预测计损，两者不等价。独立样本情形还要屏蔽前一文档末尾位置对下一文档首token的跨边界 target；BOS/EOS 的标签约定按具体目标固定。
    - position_ids 重置本身不能阻止信息串流。变长 FlashAttention 可由 cu_seqlens 表达样本边界，若退化成显式大 N² mask 或不支持该布局的 kernel，packing
      利用率提高也未必更快。
    - 控制按token归约、分桶/装箱开销、最大长度和截断；验证单独运行与packed运行在允许误差内具有同样的有效 logits/loss，并报告有效tokens/s和显存而不是仅GPU占用率。
    derivation_or_example: 两文档 A长3、B长2装入长度8，利用率为5/8；独立训练时 B 的第一个有效预测不能看到 A，且 A最后位置的下一词目标不能误设为 B首token。把B修改成任意文本，A的有效logits应不变。
    answer_outline:
    - 拼接与有效利用率
    - 跨序列attention隔离
    - shifted loss/position边界
    - kernel支持与等价性验证
    acceptance:
      L1: 解释 packing 减少 padding。
      L2: 分别说清 attention、labels、position 的职责。
      L3: 能指出 shifted target 跨文档一位错位。
      L4: 用独立/拼接等价性及有效吞吐验证实现。
    follow_ups:
    - L1：EOS 是否天然隔离后续样本的 attention？
    - L2：屏蔽 B首token 的 label 为什么仍需检查 shift 后索引？
    - L3：cu_seqlens 错一位会留下哪些可观察症状？
    - L4：文档间允许因果注意力时，如何解释其目标和 train/test边界？
    pitfalls:
    - 只清零 loss 就以为样本互不可见。
    - 把所有预训练拼接都说成必须块对角隔离。
    signals:
    - 能画一个5×5可见性矩阵并检查边界target。
    - 用有效token量归约，避免短样本获得隐含高权重。
