    - L3：beam重排和prefix分叉要如何维护cache？
    - L4：并发OOM时怎样区分页内浪费与活跃KV固有容量？
    pitfalls:
    - KV公式误用全部query头数
    - 将分页理解为丢弃历史信息或降低注意力复杂度
    signals:
    - 能手算字节并说明复用的因果与身份条件，区分理论容量和分配策略
    acceptance:
