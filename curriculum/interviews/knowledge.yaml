    prompt: 助手回答了一个错误历史日期，又在用户文档摘要中加入文档未提及的指标。这两类错误如何区分、检测和缓解？
    one_liner: 事实性以外部真实世界为参照，忠实性以给定输入/证据或指令为参照；一句话可在一个维度正确而在另一个维度失败。
    core_answer:
    - Factual error 是断言与可靠世界证据冲突；faithfulness error 是输出偏离给定来源、上下文或约束。忠实转述一篇含错误的文档，仍可能事实上错误；来源没写但外部为真的补充也可能不忠实于“仅摘要”的要求。
    - 成因包括训练中错误/过时信息、知识缺口、检索漏召回、上下文截断、语言先验压过证据、错误推理与解码过度确定。生成概率高并不意味着事实可信。
    - 把输出拆为可核验断言，定位来源及支持/矛盾/未提及；结合受控外部检索、实体/数值匹配、NLI辅助和人工裁决。多次自采样一致只能发现不稳定性，不能证明共同错误为真。
    - 缓解按瓶颈选择数据修复、检索/重排、证据引用、证据不足时澄清或拒答、原子事实核查和校准；温度降低可能减少随机性，却不能消除稳定错误。
    derivation_or_example: 原文说“试验组10人”，摘要写“有效率90%”。即使别处有90%，在限定该文档的摘要任务中仍属未支持添加；若原文把1969写成1970，准确复述1970是忠实但未必事实正确。
    answer_outline:
    - 事实性/忠实性参照系
    - 数据、检索、推理成因
    - 断言级证据核验
    - 按瓶颈缓解与拒答
    acceptance:
      L1: 能定义两种参照系。
      L2: 给出忠实却事实错误的反例。
      L3: 把检测落实到断言和支持证据。
      L4: 能选择干预并同时衡量正确率、覆盖率和过度拒答。
    follow_ups:
    - L1：来源缺失与来源明确反驳是否同类？
    - L2：为什么十次生成同一答案仍可能全错？
    - L3：RAG已有正确片段却答错，如何定位？
    - L4：提高拒答率后幻觉率降低，怎样防止指标投机？
    pitfalls:
    - 把所有不确定回答都判幻觉。
    - 承诺RAG或temperature=0可彻底消除幻觉。
    signals:
    - 分清未支持与被证伪。
    - 将拒答成本与事实覆盖率一起验收。
