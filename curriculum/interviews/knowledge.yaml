    prompt: 依据原始Qwen-VL报告，逐阶段说明数据、分辨率和冻结策略；再与原始LLaVA、DeepSeek-VL比较，避免把后续型号训练配方混在一起。
    one_liner: Qwen-VL 2023先图文预训练视觉与adapter，再高分辨率全模型多任务预训练，最后冻结视觉做对话SFT；与LLaVA两阶段及DeepSeek-VL混合视觉路线分别有不同冻结策略。
    core_answer:
    - 固定Qwen-VL arXiv:2308.12966v1：阶段1用大规模图文对、224×224输入，冻结LLM训练视觉encoder和adapter，以文本token交叉熵学习视觉语言接口。阶段2升至448×448，加入VQA/OCR/grounding与文本等多任务数据，解锁并训练全模型。
    - 阶段3混合多模态与纯文本对话，冻结视觉encoder，训练LLM和adapter，仅监督回答及相关特殊token，提升指令、多图和对话能力。这里“三阶段”指原始Qwen-VL，不能套用Qwen2/2.5/3-VL的全部实现细节。
    - 原始LLaVA用CLIP视觉tower加简单投影：先冻结视觉/LLM做投影对齐，再训练投影与LLM做视觉指令SFT，视觉通常冻结。其重点是视觉指令数据与简洁连接，而非Qwen-VL同样的全模型多任务阶段。
    - DeepSeek-VL v1使用混合视觉设计（其7B配置结合SigLIP与SAM特征）：先只训练adapter，再冻结视觉训练adapter/LLM并混入文本保持语言能力，最后SFT训练LLM、adapter和视觉的可训练部分，SAM-B仍冻结。比较时应固定数据、分辨率、token预算与参数，不依据阶段数推断谁更好。
    derivation_or_example: 若候选人说“Qwen-VL三个阶段一直冻结视觉”，与原始报告第1/2阶段不符；若说“DeepSeek-VL最后解冻所有视觉模块”，又忽略原始SAM-B冻结例外。可逐阶段列模块×trainable矩阵核验。
