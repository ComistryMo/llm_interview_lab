  - id: EGT-QB-154
    kind: eight_stock
    title: BLIP-2 两阶段：Q-Former 的三目标和生成桥接
    domain: multimodal_architecture
    tracks:
    - vlm_algorithm
    - post_training
    skills:
    - skill.llm_vlm.vlm_architecture
    - skill.llm_vlm.multimodal_data
    - skill.deep_learning.losses
    priority: P1
    difficulty:
      concept: 4
      implementation: 3
      debugging: 4
    seniority:
    - new_grad
    - mid
    - senior
    prompt: BLIP-2为什么能连接冻结视觉编码器与冻结LLM？分别说明两阶段训练哪些模块、三个表征目标的mask，以及第二阶段的语言生成损失。
    one_liner: 第一阶段训练Q-Former用ITC、ITM、ITG提取与语言有关的视觉信息，第二阶段把query输出投影成冻结LLM的视觉前缀并学习生成。
    core_answer:
    - 视觉encoder冻结，Q-Former包含可学习query与跨视觉特征的attention，query数形成压缩瓶颈。第一阶段共享Q-Former参数但切换不同注意力mask：ITC让query与text互不可见以做图文对比，不能先泄漏文本再算匹配相似度。
    - ITM让query/text双向交互，做图文匹配二分类并使用难负例；ITG让文本看到query和先前文本、query不能看到文本，以图像条件生成文字。三目标对应全局对齐、细粒度匹配与语言信息提取。
    - 第二阶段将Q个输出query经FC投影至LLM embedding维度作为soft visual prompt，视觉encoder与LLM保持冻结，训练Q-Former和投影连接；梯度须穿过冻结LLM传回输入桥接层，冻结参数不等于禁用整段autograd。
    - 对于decoder-only LLM使用图像条件语言建模loss；对于encoder-decoder LLM可用prefix language modeling，把图像/文本前缀送encoder、后缀作decoder目标。Q-Former数量、视觉分辨率及任务数据影响瓶颈，不能指望连接器还原encoder已丢的信息。
    derivation_or_example: 假设视觉输出257×1408，32个query产生32×768，再投影32×4096供LLM使用；第二阶段训练投影时若把LLM整个forward放进no_grad，loss无法通过其输入路径更新桥接层。
    answer_outline:
    - 冻结视觉与可学习query
    - ITC/ITM/ITG及mask
    - 第二阶段模块/投影/梯度
    - decoder与encoder-decoder目标
    acceptance:
      L1: 能说清Q-Former桥接与冻结组件。
      L2: 正确列出三目标。
      L3: 准确说明不同mask和第二阶段梯度路径。
      L4: 能定位query瓶颈与LLM类型造成的训练目标差别。
    follow_ups:
    - L1：ITC为什么不能先让query读取配对文本？
    - L2：ITM和ITG各允许哪些query-text注意力？
    - L3：冻结LLM参数为何仍需让梯度经过它？
    - L4：query从32扩至64怎样验证信息收益和成本？
    pitfalls:
    - 把BLIP-2两阶段都描述成CLIP式对比训练。
    - 把冻结LLM误实现为切断到连接器的梯度。
    signals:
    - mask与目标函数之间有因果解释。
    - 能按阶段列出trainable参数。
