      source_id: clip-paper
      claim: CLIP比较多类视觉编码器并学习图文对齐。
      confidence: high
    - claim_id: EGT-QB-159-C2
      source_id: qb-siglip
      claim: SigLIP用成对sigmoid目标做图文预训练。
      confidence: high
    - claim_id: EGT-QB-159-C3
      source_id: qb-dinov2
      claim: DINOv2学习通用自监督视觉特征。
      confidence: high
    - claim_id: EGT-QB-159-C4
      source_id: qb-deepseek-vl
      claim: DeepSeek-VL研究混合视觉encoder以兼顾语义和高分辨率信息。
      confidence: high
