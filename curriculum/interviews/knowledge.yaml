  - id: EGT-QB-148
    kind: eight_stock
    title: Agent 与 Workflow：动态决策和确定流程的组合
    domain: agent_runtime
    tracks:
    - agent
    - systems
    skills:
    - skill.agent_application.agent_loop
    - skill.agent_application.tool_calling
    - skill.agent_application.reliability
    priority: P1
    difficulty:
      concept: 4
      implementation: 3
      debugging: 4
    seniority:
    - new_grad
    - mid
    - senior
    prompt: 报销审核、开放式研究和有异常处理的数据导入分别该用什么控制方式？解释Agent与Workflow的区别，并给一个混合设计。
    one_liner: Workflow由程序预先定义主要控制路径，Agent由模型根据观察动态选择下一动作；可把确定环节固化，让模型只处理需要判断的有限分支。
    core_answer:
    - Workflow可包含条件分支、循环、人工审批与LLM节点，不等于只能线性执行或不能使用模型。Agent的关键是下一步控制权在一定范围交给模型，依据环境反馈改变行动。
    - 流程稳定、合规约束明确、输入输出可验证、成本敏感的任务优先固定编排；信息不完整、路径难预枚举、需要探索的研究/故障排查适合有工具和终止约束的agent。选择依任务而非营销名称。
    - 混合设计可用workflow做摄入/校验/提交与审计，让agent在只读沙盒中调查异常并提出修复，宿主按规则接收或转人工。这样模型决策范围、状态边界和副作用可逐步验收。
    - 比较成功率、异常覆盖、人工介入、确定性、尾延迟和费用；更自主通常意味着更大验证和恢复成本。若固定路径已满足目标，增加开放循环未必有收益。
    derivation_or_example: 数据导入固定执行schema验证→去重→暂存→提交；遇到无法解释的列名让agent查文档并建议映射，映射通过确定性约束后才继续。不能让agent随意跳过校验直接写正式库。
    answer_outline:
    - 控制路径归属
    - 任务条件与选型
    - 确定流程中的有限Agent分支
    - 成本、异常和验收
    acceptance:
      L1: 知道Workflow也能包含LLM。
      L2: 以路径不确定性解释选型。
      L3: 能设计有限权限的混合流程。
      L4: 用异常覆盖和成本验证是否值得增加自主性。
    follow_ups:
    - L1：有if/else的流程还是workflow吗？
    - L2：开放研究为何难写完所有分支？
    - L3：怎样把稳定成功的agent片段固化？
    - L4：自主性扩大后哪些评测必须新增？
    pitfalls:
    - 把调用LLM的所有程序都叫Agent。
    - 认为Workflow低级而Agent一定更好。
    signals:
