    prompt: 要验证一个通用助手的知识、数学、代码和常识能力。给五个经典基准分别选择输出解析和计分方式，并说明哪些分数不能直接混成总准确率。
    one_liner: 五个基准分别覆盖多学科选择、小学数学、可执行代码、竞赛数学与常识续写；任务格式和解码预算必须随分数一起报告。
    core_answer:
    - MMLU 包含57学科的多项选择，通常报选择正确率和学科切片；GSM8K 是多步小学文字题，抽取最终数值并做规范化 exact match，不能以推导文字相似度代替。
    - HumanEval 从函数签名/docstring生成程序，由单元测试判功能正确；采样多候选时用pass@k并记录n、k、温度和执行限制。测试通过只覆盖给定测试契约，不证明无任意缺陷。
    - MATH 是竞赛数学题，按类型/难度看最终答案，数学等价表达需要受控规范化或可靠验证；HellaSwag 是常识事件续写四选一，常用候选条件似然打分，长度归一化协议会影响结果。
    - 固定版本/数据split、few-shot示例、是否CoT、答案提取、模型模板、工具使用和推理token预算。分别报告置信区间、污染检查和失败类型；知识选择题高分不代表多轮执行可靠。
    derivation_or_example: 模型A在HumanEval以200个候选报pass@100，模型B只生成1个候选报pass@1，二者不能直接比较。GSM8K答案“12元”与“12”可按预先规则等价，但不能从错误推导中任意挑出碰巧出现的12。
    answer_outline:
    - 五项能力与任务格式
    - 各自计分与解析
    - 采样/提示/工具预算
    - 切片与污染限制
