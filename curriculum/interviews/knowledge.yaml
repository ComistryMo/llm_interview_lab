    prompt: 从普通attention存完整分数矩阵开始，逐代解释FlashAttention的性能改进；推导在线softmax合并，并说明“每一代都更快”缺少哪些条件。
    one_liner: v1用分块与在线softmax降低HBM访问和中间存储，v2优化线程块/warp分工，v3针对Hopper异步Tensor Core与FP8设计；计算复杂度仍为稠密attention二次。
    core_answer:
    - v1在片上SRAM分块处理Q/K/V，保留每行最大值m、指数和l及未归一化加权和o，不在HBM物化N×N分数/概率；额外存储随N线性，但稠密attention FLOPs仍O(N²d)。HBM IO界还取决于SRAM容量M，不能一律声称从O(N²)变O(N)。
    - 合并新块时m'=max(m,m_b)，l'=e^(m−m')l+e^(m_b−m')l_b，o'=e^(m−m')o+e^(m_b−m')o_b，最终O=o/l。减最大值和重标定保证跨块精确的softmax语义，仍有浮点舍入差异。
    - v2减少非matmul工作，并沿query序列分给更多线程块；warp划分减少共享内存通信，提高occupancy和并行度。收益源于工作组织而不是把softmax近似掉。
    - v3原始论文针对Hopper，用TMA/WGMMA、producer-consumer warp specialization和GEMM/softmax流水重叠，并研究FP8块量化/误差控制。硬件、head_dim、序列长、batch、causal、前后向和精度不同会改变排序；不能把H100结果直接套到A100。
    derivation_or_example: 旧块分数最大值2、l=2，新块最大值4、l_b=3，则合并l'=2e^(−2)+3；不能把两个已归一化softmax输出简单平均。性能对照应同时固定N、d、dtype和GPU型号。
    answer_outline:
    - v1分块与显存/IO区别
    - 在线softmax重标定
    - v2并行与分工
    - v3硬件特性与比较边界
    acceptance:
      L1: 区分不存N²矩阵与仍做N²计算。
      L2: 写对跨块最大值和指数和合并。
      L3: 说清v2与v3各自优化的瓶颈。
      L4: 能给硬件/形状/精度固定的benchmark协议。
    follow_ups:
    - L1：为什么两个块的softmax不能直接拼起来？
