    one_liner: DPO用策略相对reference的对数概率比参数化隐式奖励，将偏好学习改写为可微分类目标。
    core_answer:
    - 对每个x引入归一化约束，最优π*(y|x)=πref(y|x)exp(r(x,y)/β)/Z(x)，因此r=βlog(π*/πref)+βlog Z(x)，要求reference对相关输出具有支持。
