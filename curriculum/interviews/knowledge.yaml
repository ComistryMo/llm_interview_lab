    prompt: 测试题在训练前已公开，去掉完全重复文本后是否还能信任高分？设计污染检测和动态更新策略，并解释残余不确定性。
    one_liner: 污染包含题面、答案、解析及其改写进入训练或调参闭环；去重可降低风险，动态评测和时间切分也不能证明完全无泄漏。
    core_answer:
    - 先定义污染范围：预训练见题、SFT见解答、评测few-shot误含测试、反复用test选超参数均会削弱泛化解释。题面不重复而解答模板/实体改写重复仍可能泄漏。
    - 精确哈希、字符/token n-gram、MinHash近重复、语义检索与高风险人工核验互补；保存训练数据时间、版本和谱系。模型异常低PPL或能补全题面只是线索，不足以单独证明训练包含某样本。
    - 优先在数据收集前保留私有held-out簇，按时间、来源和模板做隔离；发布时报告已知污染子集与清洁子集，不应把低置信检测全部按污染删除来美化指标。
    - 动态benchmark定期引入新时间段任务与新实例，降低旧语料记忆影响；但新题难度漂移、公开后很快再污染和外部检索可获取答案仍需控制，版本间应有锚点题与校准。
    derivation_or_example: 训练含“甲有3个苹果再买2个”，测试只换成“乙有4个橙子再买2个”，精确哈希不会命中；这可能是模板泄漏线索，需结合任务分布和生成谱系判断，不能把所有同类加法题都判污染。
    answer_outline:
    - 污染通道与影响
    - 多层检测与证据限制
    - 簇/时间/来源隔离
    - 动态benchmark优势与漂移
