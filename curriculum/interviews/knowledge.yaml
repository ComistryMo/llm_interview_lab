  - id: EGT-QB-134
    kind: eight_stock
    title: 流水线 Bubble、1F1B 与 Zero Bubble 的条件
    domain: distributed_systems
    tracks:
    - systems
    - llm_algorithm
    - post_training
    skills:
    - skill.training_infra.distributed
    - skill.training_infra.observability
    priority: P1
    difficulty:
      concept: 4
      implementation: 3
      debugging: 4
    seniority:
    - new_grad
    - mid
    - senior
    prompt: 四个流水阶段利用率不均，部分GPU在等待。解释bubble来源、microbatch数量作用，比较GPipe、1F1B和Zero Bubble的调度思想。
    one_liner: Bubble是阶段因依赖、填充/排空或不平衡而空闲；1F1B交错前反向降低激活积压，Zero Bubble再拆反向输入/参数梯度以填空，收益有调度和资源前提。
    core_answer:
    - PP把连续层放在不同stage，一个microbatch必须依序经过。理想等时、无通信额外开销的GPipe式调度下，有p个stage、m个microbatch，bubble比例常近似(p−1)/(m+p−1)；不等时stage、通信和重计算会破坏这个简化。
    - GPipe常先排m个前向再反向；1F1B在暖机后交错一个前向和一个反向，缩短激活保留时间并降低内存峰值。普通非交错1F1B并不天然把所有填充/排空bubble消除。
    - Zero Bubble将反向分为输入梯度dX（推动前一stage继续）和参数梯度dW（可延后），优先关键依赖的dX，把dW填进原有空档；论文还处理优化器同步边界，才能接近同步训练下的零空泡。
    - 拆分需要额外调度自由度、内存和兼容算子实现；stage不均衡、通信、优化器步骤和某些资源限制仍可能有空闲。增加microbatch会改变累积、内存与吞吐，须保持全局batch和优化语义可比。
    derivation_or_example: p=4、m=8的理想bubble比例约3/11=27.3%；提高到m=32可降为3/35≈8.6%，但每次更新积累的样本数不能悄悄翻倍。1F1B可降低激活驻留，不能把这个公式直接改成0。
    answer_outline:
    - 依赖与理想bubble估计
    - GPipe/1F1B激活生命周期
    - dX/dW拆分填空
    - 资源、同步与公平比较
    acceptance:
      L1: 解释暖机和排空的空闲。
      L2: 能算理想bubble并说明假设。
      L3: 区别1F1B内存优势和Zero Bubble关键路径优化。
      L4: 用阶段耗时、通信和内存约束验证可行调度。
    follow_ups:
    - L1：最慢stage如何限制整条流水线？
    - L2：1F1B为何通常比全前向更省激活？
    - L3：dW为什么可以比dX更晚计算？
    - L4：optimizer step仍需同步时怎样影响零空泡结论？
    pitfalls:
    - 声称1F1B无条件零bubble。
    - 直接照搬理想公式到不均衡stage和跨节点通信。
    signals:
    - 能画microbatch前反向依赖而非只背缩写。
    - 指出延后dW仍必须赶在正确参数更新之前完成。
