    - 权重分布固定，可离线按channel/group选择scale，误差还受层输入放大。激活随prompt、长度、语言和层变化，static calibration可能遇到分布外范围；dynamic per-token
      scale更灵活但增加计算和kernel要求。
    - 离群激活扩大per-tensor范围，使多数小值分辨率不足；可用per-channel/per-token粒度、裁剪、outlier高精度路径和等价缩放。SmoothQuant利用XW=(X S^−1)(S
