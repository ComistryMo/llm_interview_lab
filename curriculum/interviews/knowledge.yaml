    - mid
    - senior
    prompt: 模型能接收128k token却漏掉文档中间的证据。解释位置扩展与真正利用长上下文的差别，并比较YaRN、LongRoPE和RAG。
    one_liner: 位置扩展解决长度适配的一部分，检索解决证据选择；能装入长文本不保证利用中部信息，必须独立测试位置、跨度和干扰。
    core_answer:
    - RoPE把位置映射到不同频率的旋转相位，直接外推会进入训练少见的相位关系。YaRN对频率维采用区别化插值并调整注意力尺度，再结合少量长度适配训练；不能简化成统一把position除常数。
    - LongRoPE利用不同RoPE维度和token位置的非均匀性搜索插值因子，配合逐步长度扩展与短上下文再调整。其论文长度结果依赖具体模型、训练和评测，不意味着所有模型改配置即可达到同效果。
    - RAG先检索少量相关证据，降低token/成本且便于更新，但会漏召回；长上下文保留更广材料及跨段关系，却增加prefill、KV与噪声成本。可先检索文档再在较长窗口联合推理，二者可结合。
    - Lost in the middle描述相关信息位于中间时某些任务准确率下降。要把同一证据移到开头/中间/结尾，控制总长度和干扰，测单针、多证据、多跳、位置分布及短上下文回归，而非只做单针检索。
    derivation_or_example: 同一合同条款分别置于8k/64k/120k位置且其他文字量相同；若中位正确率显著低于两端，先分析位置敏感性。把关键段简单前置改善，不等于模型已获得128k跨段推理能力。
    answer_outline:
    - RoPE长度适配问题
    - YaRN与LongRoPE差别
    - RAG和长窗口成本取舍
    - 中间遗忘与位置消融
    acceptance:
      L1: 区分容纳长度与有效理解。
      L2: 说清YaRN/LongRoPE非均匀适配。
      L3: 给出RAG与长上下文互补条件。
      L4: 设计位置、干扰、多跳和短窗回归实验。
    follow_ups:
