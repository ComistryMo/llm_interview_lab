      一致。每次最多计算 L×block_size 分数，不创建完整 L×S 矩阵；禁止 SDPA、MHA。只要求无 mask 推理 forward，返回不携带 autograd 图；不得将其宣称为 FlashAttention
      GPU kernel。维护在线最大值、分母和加权和，额外 O(LC+LDv)，算术 O(LS(D+Dv))。C=1、C>S、尾块不整除都须一致。
