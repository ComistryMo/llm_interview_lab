  - id: EGT-QB-140
    kind: eight_stock
    title: Agent 记忆：上下文、持久状态、检索与衰减
    domain: agent_memory
    tracks:
    - agent
    - systems
    skills:
    - skill.agent_application.state_memory
    - skill.agent_application.planning
    - skill.agent_application.reliability
    priority: P1
    difficulty:
      concept: 4
      implementation: 3
      debugging: 4
    seniority:
    - new_grad
    - mid
    - senior
    prompt: 助手需记住用户偏好和项目进度，但上下文不断增长且旧信息可能失效。设计短期/长期存储、检索、更新、冲突与衰减机制。
    one_liner: 上下文是本次模型输入，持久记忆是有来源和生命周期的数据；短期保存运行状态，长期经选择性写入和检索使用，衰减不能删除关键承诺与权限边界。
    core_answer:
    - 短期状态保存当前目标、计划、工具调用、已确认事实、检查点和剩余预算；模型上下文只装本轮相关子集，可用摘要压缩，但摘要需保留事实来源、未完成事项和不确定性。
    - 长期记忆可按语义事实/用户偏好、情景事件、程序经验分层，用结构化库保存权威字段、文档或向量索引作检索。记录owner、来源、时间、有效期、置信与版本；模型猜测不能自动提升为确认事实。
    - 写入应去重、验证、合并或保留冲突，支持用户修改/删除、访问控制和跨租户隔离。检索可混合相关度、重要性、时效与权限过滤；相似度高不代表事实仍有效。
    - 衰减可用score=w_r·relevance+w_i·importance+w_t·exp(−λΔt)作工程示例，或TTL/访问频率；不同类别策略不同，已撤回偏好应立即失效，关键任务状态不能仅因时间衰减丢弃。离线测召回、陈旧率、污染率和上下文成本。
    derivation_or_example: 旧记忆“偏好英文”，用户本轮明确要求中文：当前明确指令优先，并记录偏好是否仅本次生效；不能因旧向量更相似继续用英文。项目“文件已保存”的记忆还应关联真实文件版本。
    answer_outline:
    - 短期状态与模型上下文
    - 长期记忆类型和来源
    - 写入/冲突/权限生命周期
    - 相关度与时间衰减
    acceptance:
      L1: 知道上下文不等于持久记忆。
      L2: 能为记忆记录来源、owner和时间。
      L3: 处理新旧冲突、删除和摘要事实性。
      L4: 按类别设计衰减并评估陈旧/污染影响。
    follow_ups:
    - L1：模型摘要中推断出的事实可否直接写长期记忆？
    - L2：长期偏好与本轮指令冲突怎样处理？
    - L3：只用向量相似度会召回哪些危险旧信息？
    - L4：如何验证忘记请求确实从索引和缓存同时生效？
    pitfalls:
    - 把聊天记录无限拼接当记忆系统。
    - 把访问频率高的错误推断反复强化为事实。
    signals:
    - 区分权威状态、事件记录和可丢弃摘要。
    - 能说明记忆写入与读取各自的治理规则。
    source_claims:
    - claim_id: EGT-QB-140-C1
      source_id: qb-langgraph-persistence
      claim: LangGraph区分thread级checkpointer与跨thread长期store。
      confidence: high
    - claim_id: EGT-QB-140-C2
      source_id: qb-effective-agents
      claim: Agent运行需要受控上下文、工具和反馈组织。
      confidence: high
    related_problems:
    - AGT-001
    - AGT-006
    - AGT-009
    provenance:
    - 用户题目集编号：T140
    - synthesized_clean_room
    reviewed_at: '2026-09-08'
  - id: EGT-QB-141
    kind: eight_stock
    title: 多 Agent 协作：拆分收益、上下文契约与共享状态
    domain: agent_memory
    tracks:
    - agent
    - systems
    skills:
    - skill.agent_application.state_memory
    - skill.agent_application.planning
    - skill.agent_application.reliability
    priority: P1
    difficulty:
      concept: 4
      implementation: 3
      debugging: 4
    seniority:
    - new_grad
    - mid
    - senior
    prompt: 一个研究任务可以由单Agent完成，也可以分给多个Agent。比较常见协作模式，说明何时值得并行以及如何避免互相覆盖状态和重复犯错。
    one_liner: 多Agent适合可独立验证的并行子任务或隔离职责，收益必须覆盖通信、上下文损失和协调成本；共享的是明确产物与状态契约，不是无界互发聊天。
    core_answer:
    - 常见模式包括manager→workers分派、planner/executor/reviewer分工、并行专家后聚合、按能力handoff和有界辩论；拓扑应由任务依赖与验收决定，而非人格角色越多越好。
    - 单Agent适合任务短、状态强耦合、工具链确定或预算紧；多Agent适合可独立读取不同来源、并行验证或清晰文件/功能分工。串行依赖仍受关键路径限制，拆分会增加通信和结果整合。
    - 子任务契约包含目标、输入/授权、必须交付物、证据、约束与失败状态；只传必要上下文和可追溯引用，避免传全部敏感历史。父任务验收产物并检测冲突、遗漏与来源一致性。
    - 共享状态应有owner、版本、原子更新或事件日志；同一文件/资源明确写入负责人，副作用调用幂等。评估任务成功、总token/费用、并行wall-time、重复工作与分歧处理；多个同模型同证据错误通常相关，投票不保证独立。
    derivation_or_example: 三名worker各检查不同论文，统一输出“结论、证据段、限制”，manager合并；若三人都修改同一摘要文件，可能互相覆盖。用分离产物再由唯一作者合并更可核验。
    answer_outline:
    - 常见协作拓扑
    - 单/多选择与关键路径
    - 上下文/产物契约
    - 共享状态冲突和相关错误
    acceptance:
      L1: 能列至少三种模式与适用任务。
      L2: 说明独立子任务才有并行收益。
      L3: 给出输入输出与状态owner契约。
      L4: 能测协调开销并防冲突、重复与伪独立投票。
    follow_ups:
    - L1：任务每一步都依赖前一步时多Agent能快多少？
    - L2：子Agent缺少某约束会留下什么证据问题？
    - L3：两个Agent同时更新同一资源怎么协调？
    - L4：如何比较单Agent长上下文与多Agent分工的等预算表现？
    pitfalls:
    - 认为增加Agent数必然提升准确率或速度。
    - 将多个相同模型的同源答案当独立证据。
    signals:
    - 根据依赖图和验收边界拆分。
    - 总成本包含沟通和合并。
    source_claims:
    - claim_id: EGT-QB-141-C1
      source_id: qb-autogen
      claim: AutoGen通过多Agent会话组织协作与工具执行。
      confidence: high
    - claim_id: EGT-QB-141-C2
      source_id: qb-effective-agents
      claim: 工程模式可采用并行和编排，复杂度应由任务需要决定。
      confidence: high
    related_problems:
    - AGT-006
    - AGT-010
    provenance:
    - 用户题目集编号：T141
    - synthesized_clean_room
    reviewed_at: '2026-09-08'
  - id: EGT-QB-142
    kind: eight_stock
    title: 多步规划：目标、依赖图、执行检查与重规划
    domain: agent_memory
    tracks:
    - agent
    - systems
    skills:
    - skill.agent_application.state_memory
    - skill.agent_application.planning
    - skill.agent_application.reliability
    priority: P1
    difficulty:
      concept: 4
      implementation: 3
      debugging: 4
    seniority:
    - new_grad
    - mid
    - senior
    prompt: 用户给出“收集数据、比较方案并生成报告”的目标。怎样拆成可执行步骤、发现不合理依赖，并在新证据出现后重规划？
    one_liner: 计划是带前置条件、产物和验收的暂定依赖图；执行中用真实观察更新，不能把语言上通顺的步骤当作已完成进度。
    core_answer:
    - 先抽取最终目标、硬约束、资源/工具权限与成功断言，再分解为可验证子目标；每步写输入、依赖、动作、产物、验收、成本与可选回退。缺失关键事实先安排查证。
    - 常见prompt策略是分解后执行、先列高层计划再只展开下一步、或基于观察的ReAct；给模型明确任务契约、可用工具和产物格式比泛泛“深入思考”更可执行。计划检查可用DAG无环、依赖存在、工具可用等确定性约束。
    - 执行器只运行当前依赖已满足步骤，以真实工具结果标记pending/running/succeeded/failed；若假设失效、发现新约束或结果不满足验收，重规划受影响后续节点，保留已验证产物和原始目标。
    - 限制最大步骤、重规划次数、deadline和费用；为高影响动作保留会话已授权范围，不能因模型计划里写了发布就自动获得发布权限。用任务完成率、无效步骤、恢复率和预算超限评估。
    derivation_or_example: “比较两份报告”必须依赖“取得报告并确认版本”；若一份缺失，应标为等待/失败而不是生成想象内容。输出文件格式检查可完成，但不等于比较结论已被证据验证。
    answer_outline:
    - 目标与成功断言
    - 输入/产物/依赖拆分
    - 计划执行和局部重规划
    - 预算、权限与进度证据
    acceptance:
      L1: 能定义每步可观测产物。
      L2: 计划包含前置依赖而非口号列表。
      L3: 能因观察失败而重规划并保留已验证部分。
      L4: 用图检查、预算和终态验证约束规划器。
    follow_ups:
    - L1：计划步骤“研究充分”怎样转成可验收产物？
    - L2：如何检测循环依赖或先使用尚未得到的数据？
    - L3：重规划时哪些成功步骤可以复用？
    - L4：模型不断细分任务却不执行怎样终止？
    pitfalls:
    - 把模型计划中的完成标记当事实。
    - 将用户未授权的副作用自动加入执行范围。
    signals:
    - 每步有输入输出和可证伪条件。
    - 能维护目标稳定而让实现计划调整。
