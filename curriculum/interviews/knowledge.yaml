    kind: eight_stock
    title: PPL 的几何平均解释与可比性边界
    domain: evaluation
    tracks:
    - llm_algorithm
    - post_training
    - agent
    skills:
    - skill.evaluation_safety.benchmarks
    - skill.data_mlops.experiments
    priority: P1
