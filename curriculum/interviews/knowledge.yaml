    title: "ORM、PRM、reward hacking 与污染感知发布门禁"
    domain: reward_and_evaluation_integrity
    tracks: [post_training, agent, systems, vlm_algorithm]
    skills: [skill.post_training_rl.reward_modeling, skill.post_training_rl.verification, skill.evaluation_safety.leakage, skill.evaluation_safety.benchmarks, skill.data_mlops.data_quality]
    priority: P0
    difficulty: {concept: 4, implementation: 4, debugging: 5}
    seniority: [intern, new_grad, mid, senior]
    prompt: "一个模型的 proxy reward 上升但真实成功率下降，如何区分 ORM/PRM、verifier、数据污染、优化和评测协议问题，并设计可回滚的发布门禁？"
    one_liner: "proxy reward 只是代理信号；结果级 ORM、过程级 PRM 和规则 verifier 各有覆盖边界，必须用 hidden/动态集、污染审计、安全和成本共同约束。"
    core_answer:
      - "ORM 给整条回答分数，PRM 给步骤级信号，规则/执行 verifier 可解释但可能覆盖窄或被 parser/环境漏洞攻击；保留分项分数和失败原因。"
      - "reward hacking 常利用长度、格式、关键词、工具重试或 judge 偏差；按长度、语言、领域、难度、模型版本和 adversarial slice 分析 reward-true gap。"
      - "污染审计至少覆盖 exact、near-duplicate、semantic、公开反馈和 Agent trace 泄漏；记录 hash/manifest、时间切分、私有/动态样本和抽检证据。"
      - "发布 gate 同时检查 hidden quality/outcome、safety、污染、置信区间、p95 延迟、token/成本和可复现版本；任何关键 gate 失败即停止或回滚。"
    derivation_or_example: "构造关键词 proxy reward 与 hidden verifier，让 best-of-N 找到高 proxy/低真实质量样本；画 reward、长度、重复率和 hidden success 曲线。"
    answer_outline: ["拆代理目标和真实目标", "定位 ORM/PRM/verifier/data/eval 层", "设计污染与对抗切片", "写质量—安全—成本回滚 gate"]
    acceptance:
