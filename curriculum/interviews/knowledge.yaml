  - id: EGT-PT-010
    kind: eight_stock
    title: "DPO、IPO、KTO：偏好数据契约与目标函数选择"
    domain: preference_optimization
    tracks: [post_training, llm_algorithm, vlm_algorithm]
    skills: [skill.post_training_rl.preference_data, skill.post_training_rl.policy_optimization, skill.post_training_rl.reward_modeling, skill.deep_learning.losses, skill.llm_vlm.multimodal_data]
    priority: P0
    difficulty: {concept: 4, implementation: 4, debugging: 5}
    seniority: [intern, new_grad, mid, senior]
    prompt: "比较 DPO、IPO 和 KTO 的反馈形式、reference 约束、长度处理和适用场景，并设计能发现符号/梯度/数据泄漏错误的最小实验。"
    one_liner: "DPO 是 paired preference 的 reference-relative log-ratio 目标，IPO 是其理论框架中的 identity 特例，KTO 可用非配对二元反馈；数据和 reduction 先于超参。"
    core_answer:
      - "DPO 对同一 prompt 的 chosen/rejected 比较 policy/reference 的 completion log-prob 差；reference 通常冻结且不反传。"
      - "IPO 用不同的偏好优化目标缓解近确定偏好下的过拟合风险；不要把论文正式名称、简称和实现默认值混为一谈。"
      - "KTO 只需 desirable/undesirable 标记，不要求成对 response；类别不平衡、baseline/reference 和权重必须校准。"
      - "sum、per-sequence mean、per-token mean 会产生不同长度偏差；VLM 还要保证 chosen/rejected 共用完整媒体特征、template 和截断策略。"
    derivation_or_example: "给一个 chosen/rejected pair 的 policy/reference log-prob，手算 DPO margin；再给一正一负的 KTO 样本，说明 label、beta 和梯度方向。"
    answer_outline: ["定义反馈数据和 reference", "写 DPO/IPO/KTO 目标边界", "对齐 token/mask/长度", "用 toy gradient 和分桶指标验收"]
    acceptance:
      L1: "能区分 paired 与 unpaired preference。"
      L2: "能写出 DPO log-ratio、说明 IPO/KTO 的假设和 reduction。"
      L3: "能诊断 reference 漂移、长度偏差、标签噪声和 VLM 截断。"
    follow_ups: ["DPO 的 partition function 为什么可以消去？", "近确定偏好、tie 和标签分歧时如何选择 IPO/KTO/重标注？", "reference 误加载但 loss 仍下降，如何通过日志和 held-out win-rate 发现？", "视觉偏好数据如何区分图像质量、OCR 错误和语言风格偏好？"]
    pitfalls: ["chosen/rejected 顺序或 ratio 符号反了", "reference 反传或把 prompt token 计入 response logp", "用随机 response 切分造成同 prompt 泄漏", "只看平均 margin 不看长度、语言、领域和媒体质量切片"]
    signals: ["能从数据契约推到公式和梯度", "会明确 reduction/版本前提", "能用独立人评或执行结果验证偏好目标"]
    source_claims:
      - {claim_id: EGT-PT-010-C1, source_id: dpo-2305-18290, claim: "DPO 使用 chosen/rejected 与 reference-relative log-ratio 构造偏好分类目标。", confidence: high, locator: "paper §3"}
      - {claim_id: EGT-PT-010-C2, source_id: ipo-paper, claim: "该理论框架包含常被称为 IPO 的 identity 偏好优化特例，用于讨论偏好过拟合。", confidence: high, locator: "paper objective"}
      - {claim_id: EGT-PT-010-C3, source_id: kto-paper, claim: "KTO 以 desirable/undesirable 二元反馈构造不要求成对回答的对齐目标。", confidence: high, locator: "paper abstract/method"}
      - {claim_id: EGT-PT-010-C4, source_id: trl-official-docs, claim: "TRL 官方文档提供 preference trainer 的数据字段和实现接口，具体默认值随版本变化。", confidence: high, locator: "preference trainer documentation"}
