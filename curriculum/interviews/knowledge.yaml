    one_liner: 预训练建模文本，SFT模仿示范，经典RLHF再用偏好奖励优化策略；这是一条常见路线而非必经定律。
    core_answer:
    - 预训练用大规模语料拟合next-token分布；SFT用高质量prompt-response建立指令/对话行为。两者都用监督似然，但监督分布、mask与目标行为不同。
    - 经典RLHF内部三阶段：SFT示范→在同prompt的候选回答比较数据上训练RM→策略采样回答、RM打分并用PPO等优化。偏好采集需定义标注准则、处理并列/噪声及数据隔离。
    - PPO训练actor及critic，通常冻结RM和reference；old actor是本轮采样策略快照，reference用于KL锚定，二者角色不同。RM给回答质量分，critic预测前缀后续回报。DPO、RLVR等可改变这条链，不要求所有对齐都具备四个独立大模型。
    derivation_or_example: 给同一问题采样A/B并获A优于B，可训练−logσ(r(A)−r(B))；随后新rollout的奖励可用r(y)−βlog[π(y|x)/πref(y|x)]，但优化RM分数后仍需独立人工或可验证评测。
    answer_outline:
