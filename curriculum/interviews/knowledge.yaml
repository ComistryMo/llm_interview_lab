    prompt: 图文检索、图片问答和交错多图对话需要相同架构吗？比较几类视觉语言系统的数据流，并说明连接器的维度、token压缩和训练职责。
    one_liner: 双塔适合可索引的相似度检索，视觉token接LLM适合条件生成，query重采样和cross-attention控制视觉信息进入语言模型的方式与预算。
    core_answer:
    - CLIP式双编码器把图文映射到共同向量，离线编码文档/图像后高效检索；它本身不含能逐token回答的语言解码链。生成式VLM通常由视觉encoder、connector和LLM构成。
    - LLaVA式线性/MLP projector将N_v×d_v映射为N_v×d_l的视觉token并拼入LLM；简单直接但视觉序列可能长。BLIP-2式Q-Former用Q个可学习query通过cross-attention提取视觉信息，再映射到LLM维度，形成可控瓶颈。
    - Flamingo式resampler加门控cross-attention，让语言层按需读取视觉表征，适合交错图文条件。它与把视觉token直接拼入自注意力的路径在可见性、KV和训练参数上不同。
    - 连接器不仅匹配维度，还学习可被LLM读取的语义接口；压缩比、位置、媒体顺序、冻结/解冻、数据和梯度流共同决定效果。按检索、OCR、空间/多图任务评估信息损失与训练/服务成本，不以参数数目单判。
    derivation_or_example: N_v=576、d_v=1024、d_l=4096时线性projector约4.19M权重并输出576token；若Q-Former输出32query，LLM视觉长度可降至32，但局部小字信息可能成为瓶颈。两种“都投影4096维”不代表同样信息。
    answer_outline:
    - 双塔检索与生成VLM区别
    - 直接projector
    - query压缩与cross-attention
    - 连接器shape/梯度/信息瓶颈
    acceptance:
      L1: 能画至少三条数据流。
      L2: 给出投影前后shape与token数量。
      L3: 区分维度匹配、语义对齐和压缩。
      L4: 根据任务局部性和成本设计消融。
    follow_ups:
    - L1：双塔检索模型为什么不能直接生成详细答案？
    - L2：增加query数会怎样影响信息和成本？
    - L3：直接拼token与cross-attention对mask有何不同要求？
    - L4：连接器变复杂而质量不升如何区分数据与视觉瓶颈？
    pitfalls:
    - 把Q-Former、projector和tokenizer当同一部件。
