    prompt: 对FFN Y=φ(XW1)W2做两路张量并行。写出每张GPU的张量形状、最终结果如何合并，并解释decode时通信为什么可能抵消加速。
    one_liner: 第一层按输出列切分产生独立中间激活，第二层按输入行切分产生部分和，再用All-Reduce合成完整输出。
    core_answer:
    - 令X∈R^(B×h)、W1∈R^(h×f)、W2∈R^(f×h)。列并行W1=[W1^(1),…,W1^(p)]，每rank计算Z_i=φ(XW1^(i))∈R^(B×f/p)，局部非线性无需先all-gather。
    - 将W2按f维对应行切为W2^(i)∈R^(f/p×h)，每rank算Y_i=Z_iW2^(i)∈R^(B×h)，最终Y=Σ_iY_i。常用All-Reduce使所有rank拿完整Y；bias应只加一次或按明确分片规则处理。
    - attention可按头切QKV并对输出投影作互补切分，但GQA/MQA头数与TP度不整除时可能需要复制或特别布局；残差、归一化和后续层的复制/分片契约必须一致。
    - Ring All-Reduce通信近似2(p−1)α+2(p−1)/p·m/β，m为归约tensor字节、α为每步延迟、β为有效带宽。小batch decode每层通信频繁，计算量变小而同步固定开销仍在；需按互联、batch、模型规模测端到端收益。
    derivation_or_example: h=4、f=8、p=2、B=1：每rank持W1的4×4与W2的4×4，输出都是1×4部分和，求和后才得到完整FFN输出。把两个Y_i拼成1×8是错误合并。
    answer_outline:
    - 列并行shape
    - 行并行部分和
    - attention与布局契约
    - All-Reduce开销和decode瓶颈
    acceptance:
      L1: 知道TP切同一层权重。
      L2: 正确给出两层切分和求和形状。
      L3: 能定位bias、head整除和分片边界。
      L4: 用通信模型判断TP收益边界。
    follow_ups:
    - L1：为何两层之间无需收齐所有中间激活？
    - L2：第二层结果为什么是求和而非拼接？
    - L3：GQA只有8个KV头却用16路TP会有什么问题？
