    one_liner: AdaLoRA对低秩更新中的奇异方向估计重要性，在总预算下保留更有用的方向。
    core_answer:
    - 用ΔW=PΛQ的SVD风格三因子参数化，其中Λ为可调对角系数，P/Q是可训练方向；以正交正则减少方向冗余。这是学习到的参数化，不要求每步对大权重矩阵重新分解。
    - 按参数对loss的敏感度及其平滑不确定性估计方向重要性，对同一奇异三元组聚合评分，保留高重要性方向，压低/裁去低重要性的Λ项。不同层和投影因此可得到不同有效秩。
    - 预算通常在训练前段有较宽起始rank，经预热和逐步预算缩减到目标，末段稳定分配；需考虑评分噪声、频率、正则和目标模块。与普通LoRA比较要控制总adapter参数、数据和训练预算，不保证所有任务都优于均匀秩。
    derivation_or_example: 两层总预算16个方向可由固定(8,8)变为(12,4)；若第二层噪声梯度导致评分虚高，盲目重分配未必改善泛化，需观察跨seed稳定性和held-out结果。
    answer_outline:
    - 三因子与正交约束
    - 敏感度及方向裁剪
    - 预算调度和公平比较
