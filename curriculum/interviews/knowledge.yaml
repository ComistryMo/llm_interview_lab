  - id: EGT-QB-159
    kind: eight_stock
    title: 视觉 Encoder 选择与视觉/语言参数预算
    domain: multimodal_architecture
    tracks:
    - vlm_algorithm
    - post_training
    skills:
    - skill.llm_vlm.vlm_architecture
    - skill.llm_vlm.multimodal_data
    - skill.deep_learning.losses
    priority: P1
    difficulty:
      concept: 4
      implementation: 3
      debugging: 4
    seniority:
    - new_grad
    - mid
    - senior
    prompt: 给图片问答系统增加参数，应优先增大视觉encoder还是LLM？列出可选视觉表示路线，并解释参数配比、分辨率和信息瓶颈怎样一起决定。
    one_liner: 视觉encoder负责保留任务所需感知信息，语言侧负责理解/推理/生成；参数无通用比例，应结合预训练目标、视觉token预算、接口容量和任务消融分配。
    core_answer:
    - 常见视觉骨干有CNN/ResNet、ViT及层次Transformer；预训练路线包括CLIP/SigLIP图文对齐、DINOv2自监督视觉特征、MAE重建等。SAM类表示偏分割/局部几何，可作为混合视觉补充，但不是所有编码器都天然对齐文本。
    - CLIP双塔中的视觉/文本encoder只需经投影到可比较维度，参数量无需相同。生成VLM的“文本侧”通常是LLM而非独立检索text encoder，更大语言模型能改善推理却不能恢复视觉端已丢的小字。
    - 参数预算还包括connector、分辨率/patch数、视觉token进入LLM的KV与attention成本；冻结视觉可省优化器/梯度但仍有前向算力和激活需求。选择层/全局或patch特征、冻结/解冻与输入resize要配套。
    - 做视觉tower×LLM规模×分辨率×connector的受控消融，固定数据与训练/推理预算；按OCR、空间、知识推理、检索及域移分桶。若oracle文字下LLM可靠而图像输入失败，先改视觉通路；反之增加视觉参数未必有效。
    derivation_or_example: 把LLM由7B增到14B但输入仍把8像素小字缩掉，OCR错误未必改善；将高分辨率特征保留下来可能更有价值。另一方面，数字已正确读出却计算错误时，单独加大vision
      tower也难解决。
    answer_outline:
    - 视觉骨干与预训练路线
    - 双塔text encoder/生成LLM区别
    - 参数、分辨率与token账本
    - 瓶颈诊断和配比消融
    acceptance:
      L1: 能列多种encoder及其训练目标。
      L2: 知道视觉/文本参数无固定比例。
      L3: 能指出感知丢失无法靠LLM参数补回。
      L4: 用oracle文字和多维预算实验选择扩容方向。
    follow_ups:
    - L1：DINOv2特征能否直接与任意文本embedding求语义相似？
    - L2：冻结encoder节省哪些内存、仍需付哪些成本？
    - L3：视觉token减少时为何语言侧成本也会下降？
    - L4：怎样在同延迟预算下比较大tower低分辨率与小tower高分辨率？
    pitfalls:
    - 以参数量比例替代任务与分辨率分析。
    - 把预训练目标不同的视觉特征视为可无训练互换。
    signals:
    - 能够定位感知、接口或推理的主瓶颈。
    - 参数与token两类资源分别计算。
