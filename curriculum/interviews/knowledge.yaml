    - L3：怎样从损坏分片定位最近可用版本？
    - L4：改变DP大小后如何区分语义续训与逐位复现？
    pitfalls:
    - 把成功写出部分rank文件当成功保存
    - 声称固定seed即可跨硬件逐位复现
    signals:
    - 有完成标记和故障注入验证，关注数据游标及optimizer状态而非只有权重
