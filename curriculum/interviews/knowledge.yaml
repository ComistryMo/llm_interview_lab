  - id: EGT-QB-139
    kind: eight_stock
    title: Tool Use、Function Calling、MCP 与 Skill 的层次关系
    domain: agent_runtime
    tracks:
    - agent
    - systems
    skills:
    - skill.agent_application.agent_loop
    - skill.agent_application.tool_calling
    - skill.agent_application.reliability
    priority: P1
    difficulty:
      concept: 4
      implementation: 3
      debugging: 4
    seniority:
    - new_grad
    - mid
    - senior
    prompt: 一个团队说“安装MCP后就无需Function Calling，Skill则是另一个工具协议”。请澄清这些概念，并给一个它们共同工作的例子。
    one_liner: Tool Use是能力范畴，Function Calling是模型提出结构化动作的接口机制，MCP是应用连接工具/资源的协议，Skill是可复用指令与资源包；它们处于不同层并可组合。
    core_answer:
    - Tool Use泛指模型借助外部工具获取信息或执行动作；Function Calling通常把工具名称、schema、参数和结果组织成API消息，具体字段依模型提供方，不能假定所有接口相同。
    - MCP在host/client/server之间定义协议与能力协商，服务端可暴露tools、resources、prompts等；本题固定2025-11-25规范。它规范连接与消息，不替模型选择工具，也不替宿主做业务授权。
    - Skill通常提供某类任务的可加载说明、脚本和资源；Agent Skills开放规范以含SKILL.md的目录表达元信息与按需内容，具体产品可扩展。说明可影响工作方式，却不等于RPC端点、权限授予或自动执行全部脚本。
    - 例如“表格分析”skill规定分析流程，模型通过function calling提出query_table，宿主MCP client调用数据库server的tool，执行结果返回后继续分析。仍需校验参数、授权、版本、来源及敏感数据边界。
    derivation_or_example: 只有MCP server而模型不知道工具用途，仍不会自然得到正确调用；只有skill中的“调用数据库”文字却未连接实现，也没有真实数据库能力。合法JSON和已加载skill都不构成写库授权。
    answer_outline:
    - 能力/接口/协议/资源包四层
    - MCP角色及tools/resources/prompts
    - Skill按需加载
    - 组合实例与权限
    acceptance:
      L1: 能区分四个概念。
      L2: 解释MCP连接角色及非模型执行器。
      L3: 说明Skill不是权限或工具协议。
      L4: 能画出模型→宿主→MCP→服务的实际调用链。
    follow_ups:
    - L1：不使用MCP能否实现function calling？
    - L2：MCP resource和tool的职责有何区别？
    - L3：Skill里包含脚本是否应读取后立即执行？
    - L4：服务端工具schema变化如何影响旧skill和模型上下文？
    pitfalls:
    - 声称MCP取代LLM的工具选择和调用消息。
    - 把Skill文本或工具返回当作提升权限的依据。
    signals:
    - 用具体数据流解释层次而非背缩写。
    - 能指出协议互通与业务安全是两件责任。
