    - 变长、padding和小batch使跨样本统计难处理；逐token LN不依赖其他请求，适配自回归。BN并非不能用于序列，但须明确归约轴、mask与统计一致性。
    - RMSNorm为y=γx/√(mean(x²)+ε)，常不设bias；省去均值中心化及相应计算，保持尺度控制但不具备LN对输入统一平移的不变性。更快与效果相近来自具体实验和kernel，不能宣称总优于LN。
