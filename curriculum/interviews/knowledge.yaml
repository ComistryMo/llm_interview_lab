    prompt: 三个生成请求分别需2、5、8个输出token。静态批处理与按迭代动态调度如何不同？解释Orca的selective batching并给出吞吐提升的条件。
    one_liner: 连续批处理在生成迭代边界补入新请求并移除完成请求；Orca以iteration-level scheduling和selective batching处理变长Transformer工作。
    core_answer:
    - 静态batch通常一起进入、等待整批完成后再接新批，短输出请求留下空位；continuous batching每次迭代重新组织active请求，完成/取消即释放槽位并加入新请求，避免被最长请求锁住。
    - Orca论文将调度粒度从整个请求改为一次模型迭代；对适合合批的操作（如线性层）做selective batching，对受不同历史长度影响的操作保持相应处理，从而适应不同解码进度。不要把它等同于KV分页算法。
    - 新请求prefill与已有decode的工作量不同，需要token/KV预算、优先级、公平性和抢占/取消策略；高吞吐可能以排队、TTFT或TPOT变差为代价。连续批处理是调度机制，不必依赖特定分页实现。
    - 用不同到达率、长度分布、并发和prompt/output比例测tokens/s、每请求完成延迟、TTFT/TPOT尾分位；收益受GPU利用率、内存带宽、scheduler和固定开销影响，无通用倍数。
    derivation_or_example: 2-token请求在第2轮后完成，第3轮即可让新请求加入；静态批若等到第8轮才更新，会浪费6轮槽位。若新请求需要很长prefill，直接塞入同轮又可能让其余decode停顿。
    answer_outline:
    - 静态与迭代级生命周期
    - Orca选择性批处理
    - prefill/decode和KV预算
    - 吞吐/延迟/公平性
