  - id: EGT-QB-109
    kind: eight_stock
    title: 长上下文：YaRN、LongRoPE、检索与位置敏感性
    domain: inference_systems
    tracks:
    - systems
    - llm_algorithm
    skills:
    - skill.inference_systems.serving
    - skill.inference_systems.capacity
    - skill.inference_systems.kv_cache
    priority: P1
    difficulty:
