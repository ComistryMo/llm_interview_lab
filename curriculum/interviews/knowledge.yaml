    one_liner: PPO用悲观的截断代理目标抑制过度有利更新，clip并不是概率ratio的硬约束。
    core_answer:
    - ρ_t=πθ(a_t|s_t)/πold(a_t|s_t)，Lclip=E[min(ρ_t A_t,clip(ρ_t,1−ε,1+ε)A_t)]。A>0时超过上界不再获益，A<0时低于下界不再获益；另一方向仍可能有梯度。
    - 最小化总loss常写−Lclip+c_v·E[(Vφ−R̂)²]−c_e·H(πθ)，也可额外加KL或把reference KL放入奖励。actor给行动概率，critic预测状态回报；old logprob、优势及return
      target在策略更新中detach，避免梯度走错路径。
    - TRPO近似解带平均KL约束的优化问题，常用二阶信息与线搜索；PPO-Clip用一阶minibatch更新和启发式裁剪，易实现但不保证KL或每个ratio始终在区间内，仍需监控KL、clip fraction和更新轮数。
    derivation_or_example: ε=.2、A=2、ρ=1.5时目标min(3,2.4)=2.4；A=−2、ρ=.5时min(−1,−1.6)=−1.6。KL到reference与KL到old回答的是不同偏移问题。
