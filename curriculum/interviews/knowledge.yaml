  - id: EGT-QB-151
    kind: eight_stock
    title: CLIP 假负例：重复图片、多caption与多正样本目标
    domain: multimodal_architecture
    tracks:
    - vlm_algorithm
    - post_training
    skills:
    - skill.llm_vlm.vlm_architecture
