    core_answer:
    - FP32 中计算 `log_p=log_softmax(teacher.detach()/τ)`、`log_q=log_softmax(student/τ)`，逐 token 先沿词表求 `sum(exp(log_p)*(log_p-log_q))`，再应用
      mask，最后除以 mask 的总和。τ² 是本题采用的蒸馏缩放约定，不是 KL 的数学定义本身。
    derivation_or_example:
    - 两组 logits 相同，KL≈0；交换 teacher/student 一般改变数值；增加 padding 不改变结果；teacher 梯度为空，student 梯度有限。若 `[B,T,V]`
      直接调用 `batchmean`，只按 B 除，通常不等于有效 token 平均。top-k 截断后重归一化定义了另一种目标，不能称为全词表 KL 的无损替代。
    answer_outline:
    - FP32 中计算 `log_p=log_softmax(teacher.detach()/τ)`、`log_q=log_softmax(student/τ)`，逐 token 先沿词表求 `sum(exp(log_p)*(log_p-log_q))`，再应用
      mask，最后除以 mask 的总和。τ² 是本题采用的蒸馏缩放约定，不是 KL 的数学定义本身。
