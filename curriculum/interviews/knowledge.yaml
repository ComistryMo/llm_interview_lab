  - id: EGT-AGT-004
    kind: eight_stock
    title: "Agent 状态、规划与长期记忆：可终止 loop 的契约"
    domain: agent_planning
    tracks: [agent, systems, vlm_algorithm, post_training]
    skills: [skill.agent_application.agent_loop, skill.agent_application.state_memory, skill.agent_application.planning, skill.agent_application.reliability, skill.agent_application.evaluation]
    priority: P0
    difficulty: {concept: 4, implementation: 4, debugging: 5}
    seniority: [intern, new_grad, mid, senior]
    prompt: "设计一个会规划、调用工具并跨轮记忆的 Agent：如何建模状态、何时重规划、哪些内容写入记忆，以及怎样保证 loop 可终止、可回放、可评测？"
    one_liner: "把 Agent 视为有预算的状态机：计划、观察、工具结果和记忆写入都要有版本、权限、停止条件与可回放 trace。"
    core_answer:
      - "显式状态至少包含 goal、plan/version、当前 step、observation/tool result、剩余 token/time/tool budget、权限和 stop_reason；模型文本不是隐式状态机。"
      - "规划与执行分离，按新证据或失败类型触发有限次 re-plan；设置最大步数、总时限、重复动作检测和人工接管，禁止无界 self-loop。"
      - "区分 working memory、episodic trajectory 和 semantic memory；写入前做 schema/敏感信息/来源校验，检索结果带 provenance、置信度、TTL 或版本。"
      - "工具返回是不可信 observation，不能直接覆盖系统指令或长期记忆；副作用操作使用幂等键，所有转移记录 trace 以支持 replay。"
      - "评测同时看任务成功率、步骤数、重规划/恢复率、记忆 precision/recall、工具错误率、p95 延迟、成本和越权率。"
    derivation_or_example: "对‘查订单→搜索政策→政策冲突→重新规划→请求用户确认’画状态转移，标出每次 memory read/write、预算扣减、失败原因和最终停止条件。"
    answer_outline: ["定义 typed state 与信任边界", "规划/执行/重规划状态机", "记忆分层与写入策略", "预算、回放和任务级评测"]
    acceptance: {L1: "能画出有停止条件的 Agent loop 并区分 plan、observation、memory。", L2: "能说明重规划触发、记忆 provenance、权限和幂等契约。", L3: "能用故障注入、replay trace 和任务级指标验证恢复与成本。"}
    follow_ups: ["短期 working memory 与长期 semantic memory 如何分工？", "什么时候应该重规划而不是重试同一个工具？", "如何检测重复动作、记忆污染和跨租户串读？", "多 Agent 共享记忆时怎样处理版本冲突与权限？"]
    pitfalls: ["把 prompt history 当作完整 memory 设计", "没有最大步数/总 deadline 导致无限循环", "未经校验把工具返回写入长期记忆", "只看最终成功率而忽略步骤、成本和越权"]
    signals: ["状态字段和转移条件可执行", "能主动给出 replay/failure trace", "把记忆质量、可靠性、安全和成本一起量化"]
