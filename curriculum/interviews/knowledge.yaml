    - 优先统一契约与精度、及时同步权重、限制rollout陈旧度；必要时用π/μ的校正并监控权重方差、裁剪引入的偏差和有效样本量。top-k/p截断改变支持，μ=0区域无法仅靠重要性加权无偏恢复，不应宣称校正万能。
