cards:
  - id: EGT-TRN-001
    kind: eight_stock
    title: "Scaled dot-product attention：shape、缩放与 mask"
    domain: transformer
    tracks: [llm_algorithm, vlm_algorithm, post_training, systems]
    skills: [skill.llm_vlm.attention, skill.deep_learning.tensor_ops, skill.deep_learning.losses]
    priority: P0
    difficulty: {concept: 3, implementation: 4, debugging: 4}
    seniority: &all_seniority [intern, new_grad, mid, senior]
    prompt: "请从 Q/K/V 的 shape 推导 attention，并说明为什么除以 sqrt(d_k)、如何处理 causal/padding mask，以及全屏蔽行怎么办。"
    one_liner: "先算 QKᵀ/sqrt(d_k)，再在 key 维做稳定 softmax；mask 的语义必须明确，输出形状回到 query 长度。"
    core_answer:
      - "Q[B,H,Lq,D]、K/V[B,H,Lk,D]，score[B,H,Lq,Lk]，output[B,H,Lq,D]；Lq 与 Lk 不必相等。"
      - "缩放让 logits 方差不随 head dimension 增长，避免 softmax 饱和；实现用减最大值或稳定的 SDPA。"
      - "causal mask 屏蔽未来 key，padding mask 屏蔽无效 key；必须写清 bool mask 是 allow 还是 block。"
      - "全屏蔽 query 行不能产生 NaN：约定返回零/显式拒绝，并在数据契约和测试中固定。"
    derivation_or_example: "给 B=1、H=1、Lq=2、Lk=3、D=2 的矩阵，标注每次 matmul、transpose 和 broadcast 后的 shape。"
    answer_outline: ["列出 Q/K/V 与 score/output shape", "解释 sqrt(d_k) 与稳定 softmax", "区分 causal/padding/additive mask", "给出全屏蔽与梯度测试"]
    acceptance:
      L1: "能说出目标、四个核心 shape 与缩放原因。"
      L2: "能写稳定公式并区分 causal、padding、additive mask。"
      L3: "能处理矩形序列、全屏蔽行、极端 logits、dtype/device 和梯度。"
    follow_ups: ["PyTorch SDPA 的 bool mask True 表示什么？", "为什么把 mask 加在 softmax 前？", "FlashAttention 如何保持同一数学结果？"]
    pitfalls: ["在错误的维度 softmax", "漏掉 sqrt(d_k)", "把 query padding 与 key padding 混为一谈", "全 -inf 行直接 softmax 造成 NaN"]
    signals: ["shape 与 mask 极性可在白板上自洽", "能给出数值稳定和退化输入的测试策略", "明确 framework 行为而不把经验当定律"]
    source_claims:
      - {claim_id: EGT-TRN-001-C1, source_id: attention-is-all-you-need, claim: "Transformer 使用缩放点积注意力和多头分解。", confidence: high, locator: "paper §3.2"}
      - {claim_id: EGT-TRN-001-C2, source_id: pytorch-sdpa, claim: "PyTorch 提供带 causal 与 mask 语义的缩放点积注意力实现。", confidence: verified, locator: "API reference"}
    related_problems: [ATT-002, ATT-004]
    reviewed_at: *reviewed_at

  - id: EGT-TRN-002
    kind: eight_stock
    title: "MHA、MQA、GQA：质量与 KV 成本的取舍"
    domain: transformer
    tracks: [llm_algorithm, vlm_algorithm, systems, post_training]
    skills: [skill.llm_vlm.attention, skill.inference_systems.kv_cache, skill.machine_learning_math.linear_algebra]
    priority: P0
    difficulty: {concept: 4, implementation: 4, debugging: 4}
    seniority: [intern, new_grad, mid, senior]
    prompt: "比较 MHA、MQA、GQA 的 Q/K/V 头数、表达能力、KV-cache 显存和迁移检查点时的风险。"
    one_liner: "Q 头可以多于 KV 头；共享 KV 减少缓存和带宽，但可能牺牲表达能力，必须在质量与吞吐上实测。"
    core_answer:
      - "MHA 的 q_heads=kv_heads；MQA 只有一组 KV；GQA 将多个 query heads 分组共享一个 KV head。"
      - "KV cache 近似按 layers×batch×sequence×kv_heads×head_dim×2×dtype_bytes 增长。"
      - "从 MHA checkpoint 转 GQA/MQA 需要定义 KV head 合并/初始化，不能只改配置字段。"
      - "评估 perplexity/任务质量、长上下文退化、TTFT/TPOT、带宽和显存，而不是只看理论压缩。"
    derivation_or_example: "给 32 个 query heads、8 个 KV heads、head_dim=128、8k tokens、BF16，比较 MHA 与 GQA 的单层缓存大小。"
    answer_outline: ["画三种 head layout", "推导 KV cache bytes", "说明 checkpoint 转换", "列质量/延迟/带宽指标"]
    acceptance:
      L1: "能准确区分三种头布局。"
      L2: "能写出 KV-cache 估算并解释广播维。"
      L3: "能说明 checkpoint 转换、质量回归和 serving 指标。"
    follow_ups: ["GQA 的 repeat_kv 如何避免错误 broadcast？", "MLA 与 GQA 的缓存对象有什么不同？", "为什么 decode 更受 KV 带宽影响？"]
    pitfalls: ["把 MQA 说成没有 K/V", "用 q_heads 估算 GQA cache", "合并 KV head 时打乱 head 顺序", "只报参数量不报带宽"]
