  - id: EGT-QB-138
    kind: eight_stock
    title: 工具故障分类：坏JSON、超时、空结果和捏造参数
    domain: agent_runtime
    tracks:
    - agent
    - systems
    skills:
    - skill.agent_application.agent_loop
    - skill.agent_application.tool_calling
    - skill.agent_application.reliability
    priority: P1
    difficulty:
      concept: 4
      implementation: 3
      debugging: 4
    seniority:
    - new_grad
    - mid
    - senior
    prompt: 同一个工具调用链可能产生四类错误：JSON解析失败、超时、返回空、参数ID不存在。分别说明应如何恢复，并保证不会因重试重复写入。
    one_liner: 先区分协议错误、执行不确定、合法无结果与语义错误，再用有上限的修复、查询状态、重新检索或澄清；不同错误不能共用盲重试。
    core_answer:
    - 坏JSON优先用支持的结构化输出/schema约束；解析失败时返回具体字段错误，允许有限次数重新生成并再次完整校验，不能用随意正则修补后直接执行。未知字段和超大payload按契约处理。
    - 超时不代表未执行。读操作在deadline与预算内可指数退避加jitter；写操作先用operation ID/幂等键查询状态，确认结果再重试。执行层记录提交、完成/未知状态，避免模型重复发出同一副作用。
    - 空结果可能是合法无匹配，也可能是后端异常或被截断；返回明确status、results=[]和元数据，必要时调整查询/过滤、扩大允许范围或告知无法找到，不能伪造结果补齐。
    - ID不存在、日期越界或实体不匹配是语义错误：用可信lookup/返回的候选解析，必要时澄清用户缺失信息。保持原始目标、已确认事实、失败分类、次数和剩余预算，预算耗尽明确失败。
    derivation_or_example: create_order请求超时，实际服务器已创建订单。若直接重试可产生第二单；应使用同一幂等键或查询operation状态。search返回[]则应调整搜索，不应当作创建订单的网络错误处理。
    answer_outline:
    - JSON/schema可恢复错误
    - 超时的不确定副作用
    - 空结果语义
    - 参数实体校验与预算
    acceptance:
      L1: 能区分四类失败。
      L2: 对写超时采用幂等或状态查询。
      L3: 知道schema不能证明实体真实。
      L4: 设计有上限、可观测且不重复副作用的恢复流程。
    follow_ups:
