    one_liner: off-policy校正的分母必须对应真实行为分布；相同权重不保证相同token概率。
    core_answer:
    - 不一致可能来自权重延迟、量化/混合精度、不同kernel或MoE路由、dropout模式、tokenizer/template、position/mask，以及temperature/top-k/top-p变换；先区分模型条件概率与实际采样分布。
