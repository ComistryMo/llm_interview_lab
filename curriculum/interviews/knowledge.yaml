    prompt: 两种聊天模型的回答由第三个模型打分。请设计评分协议，说明MT-Bench的多轮设计、位置偏差和人类校准如何影响结论。
    one_liner: Judge 以固定量表近似人类或任务判断；双向交换、匿名化、证据锚点和人工校准能减偏，不能把流畅评分当作客观真值。
    core_answer:
    - MT-Bench 原始设计包含80个高质量两轮问题、8类能力，用强模型评分以覆盖多轮指令和上下文；它是具体基准，不等于所有LLM-as-a-Judge方案。可用单答案量表、成对偏好或有参考答案评分。
    - 先定义正确性、完整性、遵循要求、证据一致性等独立维度，并要求评分对应具体输出片段。代码/数学能用执行或符号验证时优先使用，judge用于不可完全程序化部分。
    - 位置偏差指调换A/B后偏好变化；还存在长度、风格、自模型偏好和错误推理。匿名化模型、随机化顺序、A/B与B/A双评并保留不一致、限制评分输入和固定judge版本。
    - 用分层人工样本估计一致率、分歧类型和置信区间，定期检查漂移。可扩展、便宜是优势；偏差相关、judge被输出中的指令影响、版本漂移和领域盲点是局限。
    derivation_or_example: 100对回答原顺序A胜65对，交换后A只胜45对，不能平均后直接声称可靠胜率；先分析20对翻转是否与位置、长度、正确性相关，再按预定义规则处理平局和不一致。
    answer_outline:
    - MT-Bench两轮八类设计
    - 评分量表与证据
    - 位置/长度等偏差控制
    - 人工校准和版本冻结
    acceptance:
