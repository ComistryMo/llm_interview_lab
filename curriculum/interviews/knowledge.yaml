    - 通过tiling、shared memory数据复用、向量化读写、Tensor Core适配、异步拷贝和计算重叠提高利用率；tile/warp数依shape、dtype与架构选择，不能盲目最大化occupancy。
    - 融合过大会增加register spilling、降低并发、限制算子调度或错过更快库GEMM；检查边界mask、stride、非连续输入、同步、NaN/Inf与精度。性能测试需warmup、设备同步/事件计时和多形状，验证绝对/相对误差及必要梯度。
