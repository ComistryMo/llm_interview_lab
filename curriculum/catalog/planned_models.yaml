      oral_questions:
        - "为何掩码 head 维可以为 1？"
        - "增量解码为什么不能使用左上三角替代绝对位置？"
        - "不同 attention API 的布尔语义是否一致？"
        - "全屏蔽行需要调用者怎样处理数值问题？"
    variant_axes: ["query_length","key_length","position_offset","padding_side"]
    invariants: ["future_keys_hidden","invalid_queries_hidden","position_translation_invariant","input_immutable"]
    common_bugs: ["inverse_mask_polarity","left_aligned_decode_triangle","key_only_padding"]
    retention:
      d2: "计划中的无帮助变式：改变数据布局或接口后重写；尚无可运行复测资产，不可用于掌握。"
      d7: "计划中的迁移变式：结合实际训练/解码情境解释与调试；尚未上线。"
    sources:
