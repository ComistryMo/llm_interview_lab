    tracks: ["vlm_algorithm","post_training"]
    tier: core
    difficulty: {concept: 3, coding: 4, debugging: 4}
    prerequisites: ["VLM-006","PT-001"]
    skills: [vlm.mask, vlm.collator, post_training.mask, loss.reduction]
    validation: {level: contract, field_runs: 0}
    assets: {problem_dir: curriculum/problems/VLM-007-multimodal-label-mask}
    interface: {language: python, framework: pytorch, symbol: multimodal_sft_loss}
    constraints:
      forbidden_apis: [transformers.Trainer, trl]
      time_limit_ms: 5000
      output_limit_kb: 256
      memory_limit_mb: 512
    assessment:
      runner: {kind: pytest, public_tests: test_public.py}
      oracle:
        kind: framework_reference
        target: shifted cross-entropy with explicit multimodal masks
        description: "A transparent PyTorch reference checks values, mask precedence, shapes, gradients, and degenerate rows."
      oral_questions:
        - "Which logits and labels remain after the causal shift?"
        - "Why must image masking override an assistant mask?"
        - "How do attention, assistant, image, and padding masks differ?"
        - "What should happen when a batch row has no valid target?"
    variant_axes: [batch_size, sequence_length, image_density, mask_density, dtype]
    invariants: [shape_alignment, image_mask_precedence, masked_positions_ignored, finite_loss]
    common_bugs: [wrong_shift, image_labels_leak, invalid_ignore_index, empty_row_nan, input_mutation]
    retention:
      d2: Rebuild the shifted masked loss with a different batch layout and explicit valid-token counts.
      d7: Diagnose a multimodal collator that misaligns image spans, labels, or devices.
    sources:
      - {type: internal_original, title: LLM Interview Lab clean-room multimodal SFT exercise}
