schema_version: 2
problems:
  - id: FND-001
    legacy_ids:
      - 00A-1
    title: Wrong Prediction Count
    status: ready
    domain: foundation
    tracks:
      - ai_foundation
      - llm_algorithm
      - vlm_algorithm
    tier: core
    difficulty:
      concept: 1
      coding: 1
      debugging: 2
    prerequisites: []
    skills:
      - python.function
      - python.list
      - python.loop
      - python.exception
      - python.runtime_type
    validation: {level: oracle, field_runs: 0, fingerprint: 7c98a256c75fd96728e58bc68865f1eb4f50b2bd6829241b366635f6fca25382}
    assets:
      problem_dir: curriculum/problems/FND-001-wrong-prediction-count
    interface:
      language: python
      framework: stdlib
      symbol: count_wrong_predictions
    constraints:
      forbidden_apis: []
      time_limit_ms: 5000
      output_limit_kb: 256
      memory_limit_mb: 256
    assessment:
      runner:
        kind: pytest
        public_tests: test_public.py
      oracle:
        kind: fixture_expected
        target: strict integer count fixtures
        description: Expected counts and contract violations are declared by public fixtures.
      oral_questions:
        - What value does the loop variable represent when iterating over predictions?
        - How can Python expose both an index and an element during iteration?
        - Why does list[int] not enforce element types at runtime?
        - What are the time and auxiliary-space complexities?
        - Why must bool be handled explicitly when strict integers are required?
        - Why does this function not mutate the input list?
    variant_axes:
      - prediction_count
      - invalid_value_position
      - incorrect_prediction_distribution
      - return_error_indices
    invariants:
      - input_list_is_not_modified
      - result_is_between_zero_and_prediction_count
      - invalid_contract_raises_value_error
    common_bugs:
      - loop_variable_treated_as_index
      - bool_accepted_as_int
      - type_annotation_assumed_to_validate_runtime_input
      - unreachable_code_after_return
    retention:
      d2:
        description: Compute a wrong-prediction rate through a new non-empty input contract.
        assets: {root: curriculum/retention/FND-001/d2, starter: starter.py, public_tests: test_public.py}
        interface: {language: python, framework: stdlib, symbol: wrong_prediction_rate}
        oracle_validated: true
      d7:
        description: Integrate record validation with collection of wrong record indices.
        assets: {root: curriculum/retention/FND-001/d7, starter: starter.py, public_tests: test_public.py}
        interface: {language: python, framework: stdlib, symbol: wrong_record_indices}
        oracle_validated: true
    sources:
      - type: internal_original
        title: LLM Interview Lab clean-room foundation exercise
