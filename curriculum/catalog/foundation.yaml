      problem_dir: curriculum/problems/FND-002-sample-contract-validation
    interface: {language: python, framework: stdlib, symbol: validate_sample}
    constraints:
      forbidden_apis: []
      time_limit_ms: 5000
      output_limit_kb: 256
    assessment:
      runner: {kind: pytest, public_tests: test_public.py}
      oracle:
        kind: fixture_expected
        target: public contract fixtures and invariants
