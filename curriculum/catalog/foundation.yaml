  - id: CAP-FND-001
    title: Hard Sample Data Pipeline
    status: ready
    domain: foundation
    tracks: [ai_foundation, llm_algorithm, vlm_algorithm]
    tier: core
    difficulty: {concept: 3, coding: 3, debugging: 3}
    prerequisites: [FND-001, FND-002, FND-003, FND-004, FND-005, FND-006]
    skills: [python.json, python.validation, python.aggregate, python.filter, python.generator, python.pipeline]
    validation: {level: oracle, field_runs: 0, fingerprint: 79648f2dd54df1a3db45f4b2bdaacd208960849e0a28ad9acdb6acd9766d1cd5}
    assets: {problem_dir: curriculum/problems/CAP-FND-001-hard-sample-data-pipeline}
    interface: {language: python, framework: stdlib, symbol: run_hard_sample_pipeline}
    constraints: {forbidden_apis: [], time_limit_ms: 5000, output_limit_kb: 256}
    assessment:
      runner: {kind: pytest, public_tests: test_public.py}
      oracle:
        kind: fixture_expected
        target: deterministic end-to-end JSONL pipeline fixtures
        description: Fixtures verify strict validation, filtering, aggregation, output persistence, batching, and non-mutation.
      oral_questions:
        - Where does each FND-001 through FND-006 capability appear in the pipeline?
        - Which operations are streaming and which require materialization, and why?
        - What are the time and auxiliary-space complexities in samples and predictions?
        - How are partial output and invalid input handled without hiding filesystem errors?
    variant_axes: [record_count, label_distribution, error_threshold, batch_size, malformed_line]
    invariants: [input_file_not_modified, output_contains_only_defensive_hard_samples, batches_match_output_order, counts_match_output]
    common_bugs: [writing_before_full_validation, bool_accepted_as_int, rate_count_confusion, last_batch_dropped, nested_list_aliasing]
    retention:
      d2: Capstone retention is not part of Alpha.2; complete the six prerequisite retention gates instead.
      d7: Capstone retention is not part of Alpha.2; field feedback drives its future transfer variant.
    sources:
      - {type: internal_original, title: LLM Interview Lab clean-room foundation capstone}
