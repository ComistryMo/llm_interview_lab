        target: "PyTorch cross_entropy label_smoothing plus explicit differentiable-zero all-ignore case"
        description: "独立参考、梯度/不变性与边界验证；不代表真实用户 Field Run。"
      oral_questions:
        - "平滑质量分给 C 类还是 C-1 类？"
