    variant_axes: ["class_count","smoothing","ignore_fraction","logit_offset"]
    invariants: ["shift_invariant","ignored_gradient_zero","input_immutable"]
    common_bugs: ["wrong_class_denominator","batch_instead_of_valid_count","all_ignored_nan"]
