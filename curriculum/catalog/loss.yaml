schema_version: 2
problems:
  - id: LOSS-007
    title: Stable Softmax
    status: ready
    domain: loss_metric
    tracks: [ai_foundation, llm_algorithm, vlm_algorithm, post_training]
    tier: core
    difficulty: {concept: 3, coding: 3, debugging: 4}
    prerequisites:
      - TNS-003
    skills: [math.numerical_stability, tensor.reduction, tensor.gradient]
    validation: {level: oracle, field_runs: 0, fingerprint: df7c84f2f74153bb1bd9346882b64bcea17702f6393596d8d4452df355a954d4}
    assets: {problem_dir: curriculum/problems/LOSS-007-stable-softmax}
    interface: {language: python, framework: pytorch, symbol: stable_softmax}
    constraints:
      forbidden_apis:
      - torch.softmax
      - torch.nn.functional.softmax
      time_limit_ms: 5000
      output_limit_kb: 256
    assessment:
      runner: {kind: pytest, public_tests: test_public.py}
      oracle:
        kind: closed_form
        target: max-shift Softmax identity
        description: Float64 values, extreme inputs, reductions, and gradients are checked independently.
      oral_questions:
        - Derive the stable formula from the mathematical definition.
        - What are the input, unreduced, and reduced shapes?
        - Which numerical failure does the max shift prevent?
        - How does the selected reduction scale gradients?
    variant_axes: [dimension, dtype, reduction, extreme_magnitude]
    invariants: [finite_for_large_finite_inputs, reference_alignment, gradient_connected]
    common_bugs: [missing_max_shift, wrong_reduction_axis, detached_intermediate, ignored_element_denominator]
    retention:
      d2:
        description: Implement stable log-softmax with a different output invariant.
        assets: {root: curriculum/retention/LOSS-007/d2, starter: starter.py, public_tests: test_public.py}
        interface: {language: python, framework: pytorch, symbol: stable_log_softmax}
        oracle_validated: true
      d7:
        description: Integrate stable softmax with a boolean mask and all-masked validation.
        assets: {root: curriculum/retention/LOSS-007/d7, starter: starter.py, public_tests: test_public.py}
        interface: {language: python, framework: pytorch, symbol: masked_softmax}
        oracle_validated: true
    sources:
      - {type: official_docs, title: PyTorch loss function documentation}
