  - id: CAP-LOSS-001
    title: Masked Sequence Classification Loss
    status: ready
    domain: loss_metric
    tracks: [ai_foundation, llm_algorithm, vlm_algorithm, post_training]
    tier: core
    difficulty: {concept: 4, coding: 4, debugging: 4}
    prerequisites: [TNS-011, TNS-013, LOSS-014]
    skills: [tensor.mask, tensor.gather, module.linear, loss.cross_entropy, tensor.gradient]
    validation: {level: oracle, field_runs: 0, fingerprint: bf713db3c79253da8eb4b0254e2f48850114d03fed6dee41a56e216107ef1c9e}
    assets: {problem_dir: curriculum/problems/CAP-LOSS-001-masked-sequence-classification-loss}
    interface: {language: python, framework: pytorch, symbol: masked_sequence_classification_loss}
    constraints:
      forbidden_apis: [torch.nn.functional.cross_entropy, torch.nn.CrossEntropyLoss]
      time_limit_ms: 5000
      output_limit_kb: 256
    assessment:
      runner: {kind: pytest, public_tests: test_public.py}
      oracle:
        kind: cross_implementation
        target: explicit last-valid selection plus PyTorch linear and cross-entropy references
        description: Independent fixtures align values and gradients for padding, non-contiguous inputs, and extreme logits.
      oral_questions:
        - How do you locate the greatest valid token position for both left and right padding?
        - What are the shapes of selected states, logits, targets, and the scalar loss?
        - Which max-shift identity keeps Cross Entropy finite for extreme logits?
        - Which hidden-state rows receive gradient, and why do padded rows receive none?
    variant_axes: [batch_size, padding_side, mask_gaps, hidden_size, class_count, dtype, layout]
    invariants: [greatest_valid_position_selected, finite_stable_loss, gradients_reach_selected_states_and_classifier, inputs_not_mutated]
    common_bugs: [length_minus_one_breaks_left_padding, wrong_gather_axis, unstable_exp_log, detached_selected_state, all_padding_silently_selected]
    retention:
      d2: Capstone retention is outside the Training Foundations Alpha; master its prerequisite Problems instead.
      d7: Capstone transfer is deferred until field feedback identifies a useful integration variant.
    sources:
      - {type: official_docs, title: PyTorch tensor indexing and CrossEntropyLoss documentation}
