schema_version: 2
problems:
  - id: PT-001
    title: SFT Label Mask
    status: ready
    domain: post_training
    tracks: [llm_algorithm, vlm_algorithm, post_training, agent]
    tier: core
    difficulty: {concept: 4, coding: 4, debugging: 5}
    prerequisites:
      - TNS-010
    skills: [post_training.mask, post_training.logprob, post_training.objective]
    validation: {level: contract, field_runs: 0}
    assets: {problem_dir: curriculum/problems/PT-001-sft-label-mask}
    interface: {language: python, framework: pytorch, symbol: build_sft_labels}
    constraints:
      forbidden_apis: [transformers.Trainer, trl]
      time_limit_ms: 5000
      output_limit_kb: 256
    assessment:
      runner: {kind: pytest, public_tests: test_public.py}
      oracle:
        kind: cross_implementation
        target: closed-form objective and transparent PyTorch reference
        description: Values, masks, reductions, gradients, and degenerate batches are checked independently.
      oral_questions:
        - Trace every tensor from model outputs or rewards to the returned value.
        - Which axes are token, sequence, candidate group, and batch?
        - Which tensors carry gradients and which must be detached?
        - What happens for empty masks, invalid completions, or zero reward variance?
    variant_axes: [batch_size, sequence_length, mask_density, reward_distribution]
    invariants: [shape_alignment, masked_items_excluded, finite_degenerate_behavior]
    common_bugs: [wrong_reduction_denominator, reference_gradient_leak, zero_variance_nan, clip_wrong_direction]
    retention:
      d2: Reimplement the objective on a fresh tensor layout without viewing prior code.
      d7: Debug a mask, reduction, reference, or degenerate-reward variant.
    sources:
      - {type: paper, title: "SFT, DPO, and GRPO primary method definitions"}
