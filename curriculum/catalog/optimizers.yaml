schema_version: 2
problems:
  - id: OPT-001
    title: SGD
    status: ready
    domain: optimizer
    tracks: [ai_foundation, llm_algorithm, vlm_algorithm, post_training, systems]
    tier: core
    difficulty: {concept: 3, coding: 4, debugging: 4}
    prerequisites:
      - TNS-013
    skills: [optimizer.state, optimizer.no_grad, optimizer.validation]
    validation: {level: oracle, field_runs: 0, fingerprint: c2c9bc69b981d67216abfb1f45f0fc2d9b8310a561eb4ef402d7fcf50d300b96}
    assets: {problem_dir: curriculum/problems/OPT-001-sgd}
    interface: {language: python, framework: pytorch, symbol: sgd_step}
    constraints:
      forbidden_apis: [torch.optim]
      time_limit_ms: 5000
      output_limit_kb: 256
    assessment:
      runner: {kind: pytest, public_tests: test_public.py}
      oracle:
        kind: closed_form
        target: hand-computed one-step and multi-step update equations
        description: Parameter values and persistent state are compared with explicit float64 equations.
      oral_questions:
        - Write every update equation in execution order.
        - Which tensors are persistent state and when do their steps increment?
        - Why must parameter updates run without autograd tracking?
        - How are missing gradients and invalid later parameters handled?
    variant_axes: [parameter_count, missing_gradient, step_count, hyperparameters]
    invariants: [gradient_not_mutated, state_detached, no_partial_invalid_step]
    common_bugs: [tracked_parameter_update, wrong_step_timing, aliased_state, coupled_weight_decay]
    retention:
      d2:
        description: Return a functional SGD update without mutating the parameter or gradient inputs.
        assets: {root: curriculum/retention/OPT-001/d2, starter: starter.py, public_tests: test_public.py}
        interface: {language: python, framework: pytorch, symbol: functional_sgd}
        oracle_validated: true
      d7:
        description: Integrate global-norm gradient clipping with one in-place SGD update across parameters.
        assets: {root: curriculum/retention/OPT-001/d7, starter: starter.py, public_tests: test_public.py}
        interface: {language: python, framework: pytorch, symbol: clipped_sgd_step}
        oracle_validated: true
    sources:
      - {type: paper, title: Adam and AdamW algorithm definitions}
