  - id: CAP-TRN-001
    title: Tiny Sequence Classifier Trainer
    status: ready
    domain: optimizer
    tracks: [ai_foundation, llm_algorithm]
    tier: core
    difficulty: {concept: 4, coding: 5, debugging: 5}
    prerequisites: [FND-006, TNS-010, TNS-013, LOSS-014, NNL-001, NNL-002, OPT-002, OPT-005]
    skills: [python.generator, tensor.mask, tensor.autograd, module.embedding, module.linear, loss.cross_entropy, optimizer.adamw, training.reproducibility]
    validation: {level: oracle, field_runs: 0, fingerprint: 84bc836559de010606e07e60eb51da8eaca28d958f4f0709aa46530d5dfce26c}
    assets: {problem_dir: curriculum/problems/CAP-TRN-001-tiny-sequence-classifier-trainer}
    interface: {language: python, framework: pytorch, symbol: train_tiny_sequence_classifier}
    constraints:
      forbidden_apis: [torch.nn.Embedding, torch.nn.Linear, torch.optim]
      time_limit_ms: 10000
      output_limit_kb: 256
    assessment:
      runner: {kind: pytest, public_tests: test_public.py}
      oracle:
        kind: cross_implementation
        target: deterministic primitive PyTorch trainer and official component references
        description: Toy fixtures verify reproducibility, gradients, state evolution, decoupled decay, padding, and decreasing loss.
      oral_questions:
        - Trace every Tensor shape from token IDs through mean pooling, logits, loss, and parameter gradients.
        - Why must gradients be cleared between steps, and where does AdamW persistent state live?
        - How is weight decay kept decoupled from the adaptive gradient moments?
        - Which controls make two runs reproducible, and what does a decreasing toy loss prove or not prove?
    variant_axes: [batch_size, sequence_length, padding_ratio, seed, learning_rate, weight_decay, step_count]
    invariants: [fixed_seed_reproducible, loss_decreases, gradients_reach_embedding_and_linear, adamw_state_evolves, inputs_not_mutated]
    common_bugs: [padding_in_mean_denominator, gradients_not_cleared, tracked_parameter_update, coupled_weight_decay, reused_graph, nondeterministic_initialization]
    retention:
      d2: Capstone retention is outside the Training Foundations Alpha; master its prerequisite Problems instead.
      d7: Capstone transfer is deferred until field feedback identifies a useful trainer variant.
    sources:
      - {type: official_docs, title: PyTorch autograd and optimizer documentation}
