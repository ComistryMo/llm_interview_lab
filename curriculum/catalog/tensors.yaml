schema_version: 2
problems:
  - id: TNS-002
    title: Reshape / Permute / Contiguous
    status: ready
    domain: tensor_autograd
    tracks: [ai_foundation, llm_algorithm, vlm_algorithm, post_training, systems]
    tier: core
    difficulty: {concept: 2, coding: 3, debugging: 3}
    prerequisites: []
    skills:
      - tensor.shape
      - tensor.reshape
      - tensor.permute
      - tensor.contiguous
    validation: {level: oracle, field_runs: 0, fingerprint: 6a213e57190a8e047dcb2fd236fa34b1fa73465f3d9b85ef6cc8e1499b794024}
    assets: {problem_dir: curriculum/problems/TNS-002-reshape-permute-contiguous}
    interface: {language: python, framework: pytorch, symbol: split_heads}
    constraints:
      forbidden_apis:
      - torch.Tensor.view
      time_limit_ms: 5000
      output_limit_kb: 256
    assessment:
      runner: {kind: pytest, public_tests: test_public.py}
      oracle:
        kind: framework_reference
        target: elementary PyTorch composition
        description: Results are aligned with transparent primitive PyTorch operations and analytic gradients.
      oral_questions:
        - What are all input and output shapes?
        - Which dimension or index axis is semantically correct?
        - How do dtype and device propagate?
        - Where does autograd connectivity begin and end?
    variant_axes: [batch_size, sequence_length, dtype, layout]
    invariants: [documented_shape, dtype_device_preserved, input_not_mutated]
    common_bugs: [wrong_axis, implicit_cpu_tensor, gradient_detached, non_contiguous_view]
    retention:
      d2:
        description: Merge a head-major tensor back into a contiguous sequence representation through a changed interface.
        assets: {root: curriculum/retention/TNS-002/d2, starter: starter.py, public_tests: test_public.py}
        interface: {language: python, framework: pytorch, symbol: merge_heads}
        oracle_validated: true
      d7:
        description: Reorder packed per-head features into sequence-major layout while preserving non-contiguous input semantics.
        assets: {root: curriculum/retention/TNS-002/d7, starter: starter.py, public_tests: test_public.py}
        interface: {language: python, framework: pytorch, symbol: pack_head_features}
        oracle_validated: true
    sources:
      - {type: official_docs, title: PyTorch tensor and autograd documentation}
