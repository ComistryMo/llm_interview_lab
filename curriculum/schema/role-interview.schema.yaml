$schema: https://json-schema.org/draft/2020-12/schema
$id: https://github.com/ComistryMo/llm_interview_lab/curriculum/schema/role-interview.schema.yaml
$defs:
  level_scale:
    type: object
    additionalProperties: false
    required: ["0", "1", "2", "3", "4"]
    properties:
      "0": {type: string, minLength: 1}
      "1": {type: string, minLength: 1}
      "2": {type: string, minLength: 1}
      "3": {type: string, minLength: 1}
      "4": {type: string, minLength: 1}
  skill:
    type: object
    additionalProperties: false
    required: [id, title, domain, description, levels, evidence, related_problems]
    properties:
      id: {type: string, pattern: '^skill\.[a-z0-9_]+(?:\.[a-z0-9_]+)+$'}
      title: {type: string, minLength: 1}
      domain: {type: string, pattern: '^[a-z][a-z0-9_]*$'}
      description: {type: string, minLength: 1}
      levels: {$ref: '#/$defs/level_scale'}
      evidence:
        type: array
        minItems: 1
        uniqueItems: true
        items: {enum: [coding, oral, debugging, design, case, project, behavioral]}
      related_problems:
        type: array
        uniqueItems: true
        items: {type: string, pattern: '^(?:[A-Z]+|CAP-[A-Z]+)-[0-9]{3}$'}
      aliases:
        type: array
        uniqueItems: true
        items: {type: string, minLength: 1}
  skill_catalog:
    type: object
    additionalProperties: false
    required: [schema_version, level_scale, skills]
    properties:
      schema_version: {const: 1}
      level_scale: {$ref: '#/$defs/level_scale'}
      skills:
        type: array
        minItems: 60
        items: {$ref: '#/$defs/skill'}
  skill_target:
    type: object
    additionalProperties: false
    required: [weight, target_level]
    properties:
      weight: {type: number, exclusiveMinimum: 0, maximum: 1}
      target_level:
        type: object
        additionalProperties: false
        required: [intern, new_grad, mid, senior]
        properties:
          intern: {type: integer, minimum: 0, maximum: 4}
          new_grad: {type: integer, minimum: 0, maximum: 4}
          mid: {type: integer, minimum: 0, maximum: 4}
          senior: {type: integer, minimum: 0, maximum: 4}
  role:
    type: object
    additionalProperties: false
    required: [id, title, aliases, summary, seniority, skill_weights, required_tracks, recommended_quests, optional_quests, interview_blueprints]
    properties:
      id: {type: string, pattern: '^[a-z][a-z0-9_]*$'}
      title: {type: string, minLength: 1}
      aliases:
        type: array
        uniqueItems: true
        items: {type: string, minLength: 1}
      summary: {type: string, minLength: 1}
      seniority:
        type: array
        minItems: 4
        uniqueItems: true
        items: {enum: [intern, new_grad, mid, senior]}
      skill_weights:
        type: object
        minProperties: 6
        propertyNames: {pattern: '^skill\.'}
        additionalProperties: {$ref: '#/$defs/skill_target'}
      required_tracks:
        type: array
        minItems: 1
        uniqueItems: true
        items: {type: string, pattern: '^[a-z][a-z0-9_]*$'}
      recommended_quests:
        type: array
        uniqueItems: true
        items: {type: string, pattern: '^[a-z][a-z0-9_]*$'}
      optional_quests:
        type: array
        uniqueItems: true
        items: {type: string, pattern: '^[a-z][a-z0-9_]*$'}
      interview_blueprints:
        type: object
        additionalProperties: false
        required: [intern, new_grad, mid]
        properties:
          intern: {type: string, pattern: '^interview\.'}
          new_grad: {type: string, pattern: '^interview\.'}
          mid: {type: string, pattern: '^interview\.'}
  role_catalog:
    type: object
    additionalProperties: false
    required: [schema_version, roles]
    properties:
      schema_version: {const: 1}
      roles:
        type: array
        minItems: 8
        items: {$ref: '#/$defs/role'}
  round:
    type: object
    additionalProperties: false
    required: [type, duration, weight, skills, item_count]
    properties:
      type: {enum: [coding, debugging, product_case, system_design, evaluation_case, project_deep_dive, behavioral, oral]}
      duration: {type: integer, minimum: 5, maximum: 60}
      weight: {type: number, exclusiveMinimum: 0, maximum: 1}
      skills:
        type: array
        minItems: 1
        uniqueItems: true
        items: {type: string, pattern: '^skill\.'}
      item_count: {type: integer, minimum: 1, maximum: 4}
  blueprint:
    type: object
    additionalProperties: false
    required: [id, role, seniority, duration_minutes, rounds]
    properties:
      id: {type: string, pattern: '^interview\.[a-z0-9_]+\.(?:intern|new_grad|mid)$'}
      role: {type: string, pattern: '^[a-z][a-z0-9_]*$'}
      seniority: {enum: [intern, new_grad, mid]}
      duration_minutes: {type: integer, minimum: 30, maximum: 150}
      rounds:
        type: array
        minItems: 2
        maxItems: 6
        items: {$ref: '#/$defs/round'}
  item:
    type: object
    additionalProperties: false
    required: [id, title, kind, status, roles, seniority, difficulty, duration_minutes, skills, assets, validation, sources]
    properties:
      id: {type: string, pattern: '^INT-[0-9]{3}$'}
      title: {type: string, minLength: 1}
      kind: {enum: [debugging, product_case, system_design, evaluation_case, project_deep_dive, behavioral, oral]}
      status: {const: ready}
      roles:
        type: array
        minItems: 1
        uniqueItems: true
        items: {type: string, pattern: '^[a-z][a-z0-9_]*$'}
      seniority:
        type: array
        minItems: 1
        uniqueItems: true
        items: {enum: [intern, new_grad, mid]}
      difficulty: {type: integer, minimum: 1, maximum: 5}
      duration_minutes: {type: integer, minimum: 5, maximum: 45}
      skills:
        type: array
        minItems: 1
        uniqueItems: true
        items: {type: string, pattern: '^skill\.'}
      assets:
        type: object
        additionalProperties: false
        required: [item_dir]
        properties:
          item_dir: {type: string, pattern: '^curriculum/interviews/assets/INT-[0-9]{3}-[a-z0-9-]+$'}
      validation: {enum: [maintainer_reviewed, field, stable]}
      sources:
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required: [type, title]
          properties:
            type: {enum: [internal_original, official_docs, paper, official_source]}
            title: {type: string, minLength: 1}
            url: {type: string, format: uri}
  interview_catalog:
    type: object
    additionalProperties: false
    required: [schema_version, blueprints, items]
    properties:
      schema_version: {const: 1}
      blueprints:
        type: array
        minItems: 8
        items: {$ref: '#/$defs/blueprint'}
      items:
        type: array
        minItems: 24
        items: {$ref: '#/$defs/item'}
